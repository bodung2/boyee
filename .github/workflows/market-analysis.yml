# 자산군 경향 분석을 실제 시세로 돌려 실행 기록(로그)에 표로 남긴다.
# 대시보드 코드가 바뀐 PR마다, 또는 Actions 탭에서 "Run workflow"로 실행. 게시(Pages)는 하지 않는다.
name: market-analysis

on:
  pull_request:
    paths:
      - "market_dashboard/**"
      - ".github/workflows/market-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 패키지 설치
        run: pip install "pandas>=2.0" "numpy>=1.24" "yfinance>=0.2.40" pykrx pytest
      - name: 대시보드 테스트
        run: python -m pytest -q tests/test_market_dashboard.py
      - name: 경향 분석(실제 시세)
        run: python -m market_dashboard analyze
      - name: 주식 섹터 지도(실제 시세, 게시하지 않음)
        run: python -m market_dashboard sectors --out site
      - name: 섹터 티커 이름 확인(한국 코드가 맞는 종목인지)
        continue-on-error: true
        run: python -m market_dashboard sectors --check-names
      - name: 한국 종목 지도(실제 데이터, 게시하지 않음)
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          # 공공데이터포털 인증키가 있으면 한국 종목은 그쪽(금융위원회 주식시세정보, 이용허락 제한 없음)으로 만든다
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -m market_dashboard krstocks --out site
      - name: 시황 요약·기록(게시하지 않음)
        continue-on-error: true
        env:
          NAVER_BLOG_ID_INVEST: ${{ vars.NAVER_BLOG_ID_INVEST }}
        run: python -m market_dashboard brief --out site
      - name: 섹터·한국 종목 화면 내려받기용으로 보관
        uses: actions/upload-artifact@v4
        with:
          name: sectors-preview
          path: |
            site/sectors.html
            site/kr.html
            site/brief.json
            site/history.html
