# 자산군 경향 분석을 실제 시세로 돌려 실행 기록(로그)에 표로 남긴다.
# 대시보드 코드가 바뀐 PR마다, 또는 Actions 탭에서 "Run workflow"로 실행. 게시(Pages)는 하지 않는다.
name: market-analysis

on:
  pull_request:
    paths:
      - "market_dashboard/**"
      - ".github/workflows/market-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 패키지 설치
        run: pip install "pandas>=2.0" "numpy>=1.24" "yfinance>=0.2.40" pytest
      - name: 대시보드 테스트
        run: python -m pytest -q tests/test_market_dashboard.py
      - name: 경향 분석(실제 시세)
        run: python -m market_dashboard analyze
