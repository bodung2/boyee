# 코인 매매 방법론 비교(Yahoo 일봉 2014~ + Hyperliquid 펀딩비)를 실행 기록(로그)에 남긴다. 주문은 하지 않는다.
name: perp-research

on:
  pull_request:
    paths:
      - "perp_bot/research.py"
      - "perp_bot/xsmom.py"
      - ".github/workflows/perp-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 패키지 설치
        run: pip install "pandas>=2.0" "numpy>=1.24" yfinance pytest
      - name: 테스트
        run: python -m pytest -q tests/test_perp_bot.py
      - name: 방법론 비교(실제 시세)
        run: python -m perp_bot research
      - name: 종목 선정형 모멘텀(실제 시세)
        run: python -m perp_bot xsmom
