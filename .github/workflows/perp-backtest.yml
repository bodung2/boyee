# 코인 선물 봇 백테스트를 Hyperliquid 실제 4시간 봉으로 돌려 실행 기록(로그)에 남긴다. 주문은 하지 않는다.
name: perp-backtest

on:
  pull_request:
    paths:
      - "perp_bot/**"
      - "tests/test_perp_bot.py"
      - ".github/workflows/perp-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 패키지 설치
        run: pip install "pandas>=2.0" "numpy>=1.24" pytest
      - name: 테스트
        run: python -m pytest -q tests/test_perp_bot.py
      - name: 백테스트(실제 시세)
        run: python -m perp_bot backtest
