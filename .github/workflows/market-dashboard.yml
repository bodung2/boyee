# 자산군 모멘텀 대시보드: 화~토 아침(한국 시간 07:30, 전날 미국장 마감 반영)에 새로 계산해 GitHub Pages에 올린다.
# 주소: https://bodung2.github.io/boyee/
# 최초 1회: 저장소 Settings → Pages → Build and deployment → Source를 "GitHub Actions"로.
# 텔레그램 요약(선택): Settings → Secrets and variables → Actions에 TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
name: market-dashboard

on:
  schedule:
    - cron: "30 22 * * 1-5"   # UTC 월~금 22:30 = 한국 화~토 07:30
  workflow_dispatch:           # Actions 탭에서 "Run workflow"로 바로 실행

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: market-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치(대시보드에 필요한 것만)
        run: pip install "pandas>=2.0" "numpy>=1.24" "yfinance>=0.2.40"

      # 지난 실행에서 받은 시세. Yahoo가 막히는 날에도 이 저장본으로 화면을 만든다.
      - uses: actions/cache@v4
        with:
          path: data/market
          key: market-data-${{ github.run_id }}
          restore-keys: market-data-

      - name: 계산·화면 만들기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://bodung2.github.io/boyee/
        run: python -m market_dashboard run --out site --notify

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
