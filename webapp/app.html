<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>인생 대시보드</title>
<!-- 인생 대시보드 화면(구글 Apps Script 웹앱). 집 PC가 이 파일을 드라이브의 life_dashboard_app.html로 올리고,
     webapp/Code.gs의 doGet이 그 파일을 보여 준다. 데이터는 google.script.run으로 Code.gs의 함수를 불러 주고받는다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script>
// 화면 모드: dark(기본) · light · auto(기기 설정). 이 기기에만 기억한다
(function () { let m = "dark"; try { m = localStorage.getItem("theme") || "dark"; } catch (e) {}
  const dark = m === "auto" ? matchMedia("(prefers-color-scheme: dark)").matches : m === "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light"; })();
</script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--cardbg:#fff;--ink:#111827;--sub:#6b7280;--mute:#9ca3af;--line:#e7e9f0;--accent:#4f46e5;
--up:#dc2626;--down:#2563eb;--warn:#a86400;--warn-bg:#fdf0d8;--chip:#eef0f6;--shadow:0 6px 20px rgba(17,24,39,.06);
--s1:#4f46e5;--s2:#ea580c;--s3:#059669;--s4:#d97706;--s5:#db2777;--s6:#16a34a;
--hero:linear-gradient(135deg,#2563eb,#7c3aed);--tabon:#fff;--tabsh:0 2px 8px rgba(0,0,0,.08);
--g-body:#ea580c;--g-mind:#7c3aed;--g-craft:#db2777;--g-social:#059669;--g-career:#2563eb;--g-economy:#d97706}
:root[data-theme=dark]{--bg:#070b18;--card:#0f172a;--cardbg:linear-gradient(160deg,#0f172a,#111827);--ink:#e5e7eb;--sub:#94a3b8;--mute:#64748b;
--line:rgba(148,163,184,.16);--accent:#6366f1;--up:#f87171;--down:#60a5fa;--warn:#fbbf24;--warn-bg:#3a2c12;--chip:#1e293b;--shadow:0 10px 30px rgba(0,0,0,.35);
--s1:#22d3ee;--s2:#fb923c;--s3:#34d399;--s4:#fbbf24;--s5:#f472b6;--s6:#4ade80;
--hero:radial-gradient(120% 90% at 50% 0%,#312e81 0%,#0f172a 55%,#070b18 100%);--tabon:linear-gradient(135deg,#1e293b,#312e81);--tabsh:0 0 0 1px rgba(129,140,248,.4),0 6px 18px rgba(99,102,241,.25);
--g-body:#ff8a3d;--g-mind:#a78bfa;--g-craft:#f472b6;--g-social:#34d399;--g-career:#60a5fa;--g-economy:#fbbf24}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
font:15px/1.5 Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:700;color:var(--sub);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--tabon);color:var(--ink);box-shadow:var(--tabsh)}
.tabs #themeBtn{flex:none;width:36px;padding:8px 0;font-size:16px}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{white-space:nowrap;flex:1 0 auto}
@media (max-width:420px){.tabs{gap:2px;padding:8px 6px}.tabs button{padding:8px 6px;font-size:13px;letter-spacing:-.4px}}
.camp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.tile{position:relative;display:flex;flex-direction:column;gap:4px;padding:14px 12px 12px;border-radius:16px;text-decoration:none;color:var(--ink);
background:var(--cardbg);border:1px solid var(--line);box-shadow:var(--shadow);min-height:118px;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--tc,var(--accent))}
.tile .ti{font-size:30px;line-height:1}.tile b{font-size:15px;line-height:1.25}.tile small{font-size:12px;color:var(--sub);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .tm{position:absolute;right:6px;top:8px;border:0;background:none;color:var(--sub);font-size:18px;padding:2px 6px;cursor:pointer}
.tile .tst{position:absolute;right:34px;top:15px;width:9px;height:9px;border-radius:50%}.tst.ok{background:#22c55e}.tst.login{background:#f59e0b}.tst.down{background:#ef4444}
.tile .tpin{position:absolute;right:34px;top:9px;font-size:12px}.tile .tpin+.tst{right:52px}.tile.builtin{min-height:92px}
.chips2{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;margin-top:8px}.chips2 button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.chips2 button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.swatch{display:flex;gap:6px;flex-wrap:wrap}.swatch label{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent}.swatch input{display:none}.swatch input:checked+span{outline:3px solid var(--ink);outline-offset:2px}
.swatch span{display:block;width:100%;height:100%;border-radius:50%}
main{max-width:860px;margin:0 auto;padding:16px 16px 96px}
#qframe{width:100%;border:0;display:block;min-height:70vh;background:var(--bg)}
.card{background:var(--cardbg);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.hero .label{color:var(--sub);font-size:13px}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin:2px 0}
.delta{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
.ranges{display:flex;gap:4px;margin:10px 0 2px}
.ranges button{border:1px solid var(--line);background:none;border-radius:6px;padding:2px 10px;font-size:12px;color:var(--sub);cursor:pointer}
.ranges button[aria-pressed=true]{background:var(--chip);color:var(--ink);font-weight:700}
.chart{position:relative;margin-top:6px}
.chart svg{display:block;width:100%;height:150px;touch-action:pan-y}
.tip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:3px 8px;
border-radius:6px;white-space:nowrap;transform:translateX(-50%);display:none}
.empty{color:var(--sub);font-size:13px;padding:24px 0;text-align:center}
.alloc{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:12px 0 8px;background:var(--card)}
.alloc i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px;color:var(--sub)}
.legend b{margin-left:auto;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font-size:15px;margin:22px 0 8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left}
.stat .n{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--sub)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;
grid-template-columns:1fr auto;gap:2px 12px;cursor:pointer;text-align:left;width:100%}
.item .t{font-weight:700;overflow-wrap:anywhere}.item .s{color:var(--sub);font-size:13px;overflow-wrap:anywhere}
.item .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.item .rs{text-align:right;font-size:12px;color:var(--sub);white-space:nowrap}
.item a{color:var(--accent)}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;margin-left:6px;background:var(--chip);color:var(--sub)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.group{font-size:12px;color:var(--sub);font-weight:700;margin:14px 0 6px}
.dday{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.dday:last-child{border-bottom:0}.dday b{font-variant-numeric:tabular-nums;white-space:nowrap}
.year{font-weight:800;font-size:15px;margin:18px 0 6px}
.tl{display:flex;gap:10px;padding:6px 0;border-left:2px solid var(--line);margin-left:6px;padding-left:12px;font-size:14px}
.tl .d{color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.danger{color:var(--up)}
.fab{position:fixed;right:16px;bottom:20px;z-index:6;border:0;border-radius:999px;padding:12px 18px;background:var(--accent);
color:#fff;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet form{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px 24px}
.sheet h3{margin:0 0 12px;font-size:17px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f label{font-size:13px;font-weight:700}
.f small{color:var(--sub);font-size:12px}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);width:100%}
.f textarea{min-height:70px;resize:vertical}
.sheet .row{margin-top:8px}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);
padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);display:none}
.muted{color:var(--sub);font-size:12px}
.mini{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 2px 0;font-size:13px;color:var(--sub)}
.mini b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.grow-row{display:grid;grid-template-columns:28px 1fr auto 64px;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);
border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.grow-row .gi{font-size:18px}.grow-row .gn{font-weight:700}.grow-row .gn small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.grow-row .gt{font-variant-numeric:tabular-nums;font-weight:700;color:var(--sub);white-space:nowrap}.grow-row .gt.up{color:var(--up)}
.grow-row .gp{text-align:right;font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px}
.hex2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.hex{margin:0;padding:10px}.hex figcaption{font-size:13px;font-weight:700}
.hex svg{width:100%;height:auto;display:block}.hexv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px 6px;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.track{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 2px}.track span{background:var(--chip);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--sub)}
.track b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}.track small{font-size:11px;color:var(--mute)}
.bar1{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin:8px 0 6px}.bar1 i{display:block;height:100%;background:var(--s1);border-radius:4px}
.pss{display:flex;gap:6px}.pss label{flex:1;display:flex;gap:4px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;padding:6px 0;font-weight:400}
.tm-goals{display:grid;gap:12px}.tm-goal{display:flex;align-items:center;gap:14px;padding:22px 18px;font-size:20px;font-weight:800;border-radius:14px;
border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:left}.tm-goal small{display:block;font-size:12px;font-weight:400;color:var(--mute);margin-top:3px}
.tm-goal .ic{font-size:32px}.tm-acts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.tm-act{padding:14px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;cursor:pointer}
.tm-act[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;font-weight:700}
.tm-big{width:100%;padding:18px;font-size:20px;border-radius:14px}.tm-clock{font-size:52px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-1px;margin:8px 0}
#runbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:2px solid var(--accent);box-shadow:0 -4px 14px rgba(0,0,0,.12);
padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:grid;gap:6px}
.rb-row{display:grid;grid-template-columns:10px 1fr auto auto;gap:10px;align-items:center;max-width:720px;margin:0 auto;width:100%}
.rb-dot{width:10px;height:10px;border-radius:50%;background:var(--up);animation:rbp 1.4s infinite}@keyframes rbp{50%{opacity:.25}}
.rb-name{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rb-name small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.rb-clock{font-size:20px;font-variant-numeric:tabular-nums}
body.has-run #toast{bottom:auto;top:64px}body.has-run{padding-bottom:calc(76px + env(safe-area-inset-bottom))}body.has-run .fab{bottom:calc(84px + env(safe-area-inset-bottom))}
.tm-rec .rs{display:flex;gap:6px;justify-content:flex-end}.tm-rec .rs .btn{padding:4px 10px;font-size:12px}
.vs{background:var(--hero);color:#fff;border:0;position:relative;overflow:hidden}
.vs .vrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-top:6px}
.vs .who{text-align:center}.vs .av{width:60px;height:60px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-size:28px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35)}
.vs .me .av{box-shadow:0 0 0 3px #22d3ee,0 0 22px rgba(34,211,238,.6)}.vs .rv .av{box-shadow:0 0 0 3px #f87171,0 0 22px rgba(248,113,113,.55)}
.vs .nm{font-weight:800;font-size:15px}.vs .sc{font-size:26px;font-weight:900;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1}.vs .sb{font-size:11px;opacity:.8}
.vs .vx{font-size:32px;font-weight:900;font-style:italic;background:linear-gradient(180deg,#fde68a,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(245,158,11,.5))}
.vs .tug{height:14px;border-radius:99px;background:linear-gradient(90deg,#f97316,#ef4444);margin:14px 0 6px;position:relative;overflow:hidden}
.vs .tug i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#22d3ee,#6366f1)}
.vs .tug em{position:absolute;top:0;width:4px;height:100%;background:#fff;box-shadow:0 0 10px #fff;transform:translateX(-2px)}
.vs .tip2{background:rgba(255,255,255,.14);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;margin-top:8px}
.vs .vbtn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer}
.vs details{margin-top:8px;font-size:13px}.vs details summary{cursor:pointer;opacity:.85}.vs details table{color:#fff}.vs details .muted{color:rgba(255,255,255,.65)}
.tier{display:flex;gap:14px;align-items:center}.tier svg{width:90px;height:90px;flex:none}
.tier .tb{font-size:26px;font-weight:900;letter-spacing:-1px}
.gplus{position:absolute;left:84px;top:96px;font-weight:900;font-size:22px;color:#22c55e;text-shadow:0 0 12px rgba(34,197,94,.6);animation:gplus 1.8s ease-out forwards;pointer-events:none}
@keyframes gplus{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-28px)}}
.grass2{display:grid;grid-template-columns:18px repeat(6,1fr);gap:4px;margin-top:10px;align-items:center}.grass2 .gd{font-size:10px;color:var(--mute)}
.grass2 i,.lg{display:block;height:18px;border-radius:4px;background:var(--chip);cursor:pointer}.lg{width:12px;height:12px;cursor:default}.grass2 i.gf{opacity:.25;cursor:default}
.grass2 i.gt{outline:2px solid var(--accent);outline-offset:1px}
.g1{background:#bbf7d0!important}.g2{background:#86efac!important}.g3{background:#22c55e!important}.g4{background:#15803d!important}
:root[data-theme=dark] .g1{background:#14532d!important}:root[data-theme=dark] .g2{background:#16a34a!important}:root[data-theme=dark] .g3{background:#22c55e!important}:root[data-theme=dark] .g4{background:#4ade80!important}
.mis{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;color:var(--ink)}
.mis:first-of-type{border-top:0}.mis .ck{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:900;border:2px solid var(--mute);flex:none}
.mis.done .ck{background:#22c55e;border-color:#22c55e;color:#fff}.mis.done .mt{text-decoration:line-through;color:var(--sub)}
.mis .flip{margin-left:auto;font-size:11px;font-weight:800;color:#f59e0b;border:1px solid #f59e0b;border-radius:99px;padding:1px 7px}
.vs .prof{margin-top:10px;font-size:12.5px;line-height:1.5;background:rgba(255,255,255,.1);border-radius:12px;padding:8px 12px}
.vs .taunt{margin-top:8px;font-size:13px;font-style:italic;opacity:.95}
.bdg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.bd{border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;opacity:.55}
.bd.on{opacity:1;border-color:#f59e0b;box-shadow:0 0 0 1px rgba(245,158,11,.35),0 6px 16px rgba(245,158,11,.15)}.bd .bi{font-size:26px}.bd b{display:block;font-size:12px}.bd small{display:block;font-size:10px;color:var(--sub)}
.report summary{cursor:pointer;list-style:none}.report summary::-webkit-details-marker{display:none}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.rgrid div{background:var(--chip);border-radius:10px;padding:8px;text-align:center}.rgrid small{display:block;font-size:11px;color:var(--sub)}.rgrid b{font-size:20px;font-variant-numeric:tabular-nums}
#ko{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(2,6,23,.55)}#ko[hidden]{display:none}
#ko .kc{width:270px;text-align:center;border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,#7c2d12,#b91c1c);box-shadow:0 20px 50px rgba(239,68,68,.5);animation:kopop .5s cubic-bezier(.2,1.6,.4,1)}
#ko .kc b{display:block;font-size:40px;font-style:italic;font-weight:900;letter-spacing:-1px}
#ko .cf{position:absolute;width:8px;height:13px;border-radius:2px;top:-20px;animation:cf 2.6s linear forwards}
@keyframes kopop{0%{transform:scale(.4) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(-3deg);opacity:1}}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){#ko .kc,#ko .cf,.gplus{animation:none}}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}.hero .big{font-size:26px}.legend{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="tabs" role="tablist">

// ---------------------------------------------------------------- 숫자·날짜
function won(n, sign) {
  if (n == null || !isFinite(n)) return "-";
  const s = n < 0 ? "−" : (sign && n > 0 ? "+" : "");
  n = Math.abs(Math.round(n));
  const eok = Math.floor(n / 1e8), man = Math.floor((n % 1e8) / 1e4);
  if (eok) return s + eok.toLocaleString("ko-KR") + "억" + (man ? " " + man.toLocaleString("ko-KR") + "만" : "") + "원";
  const rest = n % 1e4;                          // 천만 원 아래는 끝자리까지(월 수입 등)
  if (man) return s + man.toLocaleString("ko-KR") + "만" + (rest && n < 1e7 ? " " + rest.toLocaleString("ko-KR") + "원" : "원");
  return s + n.toLocaleString("ko-KR") + "원";
}
const pct = n => n == null || !isFinite(n) ? "" : (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(1) + "%";
const tone = n => n > 0 ? "up" : n < 0 ? "down" : "";
const num = v => { const n = Number(String(v == null ? "" : v).replace(/[,\s원$₩]/g, "")); return v === "" || v == null || !isFinite(n) ? null : n; };
function parseDay(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; }
function today() { return parseDay(DATA && DATA.today) || new Date(new Date().toDateString()); }
const fmtDay = s => { const d = parseDay(s); return d ? `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}` : ""; };
function age(s) {
  const b = parseDay(s), t = today(); if (!b) return null;
  let a = t.getFullYear() - b.getFullYear();
  if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--;
  return a;
}
function nextDday(s) {
  const d = parseDay(s), t = today(); if (!d) return null;
  let n = new Date(t.getFullYear(), d.getMonth(), d.getDate());
  if (n < t) n = new Date(t.getFullYear() + 1, d.getMonth(), d.getDate());
  return {days: Math.round((n - t) / 864e5), years: n.getFullYear() - d.getFullYear()};
}
function span(from, to) {
  const a = parseDay(from), b = to ? parseDay(to) : today(); if (!a || !b) return "";
  let m = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
  if (b.getDate() < a.getDate()) m--;
  if (m < 1) return "1개월 미만";
  return (m >= 12 ? Math.floor(m / 12) + "년 " : "") + (m % 12 ? m % 12 + "개월" : "").trim();
}
function ago(iso) {
  const t = Date.parse(iso); if (!t) return "";
  const m = Math.round((Date.now() - t) / 6e4);
  return m < 1 ? "방금" : m < 60 ? m + "분 전" : m < 1440 ? Math.round(m / 60) + "시간 전" : Math.round(m / 1440) + "일 전";
}

const THEME_LABEL = {dark: "🌙 다크", light: "☀️ 라이트", auto: "🖥 기기 설정 따라"};
function themeMode() { return store.get("theme") || "dark"; }
function applyTheme() {
  const m = themeMode(), dark = m === "auto" ? matchMedia("(prefers-color-scheme: dark)").matches : m === "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const b = $("#themeBtn"); if (b) b.textContent = m === "auto" ? "🖥" : dark ? "🌙" : "☀️";
}
function cycleTheme() {
  const order = ["dark", "light", "auto"], next = order[(order.indexOf(themeMode()) + 1) % order.length];
  store.set("theme", next); applyTheme(); toast("화면 모드: " + THEME_LABEL[next]);
}
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (themeMode() === "auto") applyTheme(); }); } catch (e) {}
function showTab(name) {
  document.querySelectorAll(".tabs button[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === name));
  $("#quest").hidden = name !== "quest"; $("#assets").hidden = name !== "assets"; $("#growth").hidden = name !== "growth"; $("#timer").hidden = name !== "timer"; $("#camp").hidden = name !== "camp";
  store.set("tab", name);
  if (name === "quest") loadQuest(); else if (!DATA) loadAssets(); else if (name === "growth") renderGrowth(); else if (name === "timer") renderTimer(); else if (name === "camp") renderCamp();
}
let questAt = 0;
async function loadQuest() {
  if (Date.now() - questAt < 60000) return;
  questAt = Date.now();
  try {
    const html = await api("getQuestBoard");
    const f = $("#qframe");
    if (!html) { f.hidden = true; $("#qmsg").hidden = false; $("#qmsg").innerHTML = '<p class="empty">아직 집 PC가 퀘스트 보드를 올리지 않았습니다.</p>'; return; }
    f.hidden = false; $("#qmsg").hidden = true;
    f.onload = () => fit(f);
    f.srcdoc = html.replace("<head>", '<head><base target="_blank">');
  } catch (e) { toast("퀘스트 보드를 불러오지 못했습니다: " + e.message, true); }
}
function fit(f) {
  const go = () => { try { f.style.height = f.contentDocument.documentElement.scrollHeight + "px"; } catch (e) { /* 다른 출처 */ } };
  go(); setTimeout(go, 300); setTimeout(go, 1500);
}

    $("#amain").innerHTML = `<div class="note">자산 데이터를 불러오지 못했습니다: ${esc(e.message)}<br>

  }
}
function stalePrices() {
  const hasPriced = DATA.items.some(it => it.category === "finance" && priced(it.f || {}) && (it.f.ticker || "").trim());
  return hasPriced && (!DATA.pricesAt || Date.now() - Date.parse(DATA.pricesAt) > 30 * 6e4);

  } catch (e) { toast("시세를 받지 못했습니다: " + e.message, true); }
  busy = false;
}

function hero() {
  const t = DATA.totals, h = DATA.history;
  const prev = h.length > 1 ? h[h.length - 2] : null;
  const back = pick30(h);
  const d1 = prev ? t.net - prev.net : null, d30 = back ? t.net - back.net : null;
  const deltas = [d1 != null ? `어제보다 <span class="${tone(d1)}">${won(d1, true)}</span>` : "",
                  d30 != null ? `30일 전보다 <span class="${tone(d30)}">${won(d30, true)}</span>` : ""].filter(Boolean).join(" · ");
  return `<div class="card hero"><div class="row"><span class="label">순자산 (금융 + 부동산 − 대출)</span>
    <button class="btn" type="button" data-act="refresh">시세 새로고침</button></div>
    <div class="big">${won(t.net)}</div><div class="delta">${deltas || "매일 " + DATA.snapshotHour + "시에 기록이 쌓이면 변화가 보입니다"}</div>
    <div class="ranges" role="group" aria-label="기간">${["1M", "3M", "1Y", "ALL"].map(r =>
      `<button type="button" data-range="${r}" aria-pressed="${r === RANGE}">${{"1M": "1개월", "3M": "3개월", "1Y": "1년", "ALL": "전체"}[r]}</button>`).join("")}</div>
    <div class="chart" id="chart"></div>
    <div class="muted">${DATA.pricesAt ? "시세 " + ago(DATA.pricesAt) + " 기준 · " : ""}매일 ${DATA.snapshotHour}시 자동 기록</div></div>`;
}
function pick30(h) {
  if (h.length < 2) return null;
  const want = new Date(today() - 30 * 864e5);
  let best = null;
  h.forEach(p => { const d = parseDay(p.date); if (d && d <= want) best = p; });
  return best;
}

function drawChart() {
  const box = $("#chart"); if (!box) return;
  const days = {"1M": 31, "3M": 92, "1Y": 366, "ALL": 1e6}[RANGE];
  const from = new Date(today() - days * 864e5);
  const pts = DATA.history.filter(p => { const d = parseDay(p.date); return d && d >= from && isFinite(p.net); });
  if (pts.length < 2) { box.innerHTML = '<p class="empty">기록이 이틀 이상 쌓이면 추이 그래프가 나옵니다</p>'; return; }
  const W = 600, H = 150, P = 6;
  const xs = pts.map(p => parseDay(p.date).getTime()), ys = pts.map(p => p.net);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); if (y0 === y1) { y0 -= 1; y1 += 1; }
  const X = x => P + (x - x0) / (x1 - x0 || 1) * (W - 2 * P), Y = y => H - P - (y - y0) / (y1 - y0) * (H - 2 * P - 14);
  const path = pts.map((p, i) => (i ? "L" : "M") + X(xs[i]).toFixed(1) + " " + Y(p.net).toFixed(1)).join(" ");
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="순자산 추이">
    <line x1="${P}" x2="${W - P}" y1="${H - P}" y2="${H - P}" stroke="var(--line)" stroke-width="1"/>
    <path d="${path}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <line id="cx" y1="0" y2="${H}" stroke="var(--mute)" stroke-width="1" vector-effect="non-scaling-stroke" visibility="hidden"/>
    <circle id="cd" r="4" fill="var(--s1)" stroke="var(--card)" stroke-width="2" visibility="hidden"/></svg>
    <div class="tip" id="tip"></div><div class="muted row"><span>${fmtDay(pts[0].date)}</span><span>${fmtDay(pts[pts.length - 1].date)}</span></div>`;
  const svg = box.querySelector("svg"), tip = $("#tip");
  const move = e => {
    const r = svg.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width * W;
    let i = 0; xs.forEach((x, k) => { if (Math.abs(X(x) - fx) < Math.abs(X(xs[i]) - fx)) i = k; });
    const cx = X(xs[i]), cy = Y(pts[i].net);
    ["cx", "cd"].forEach(id => svg.getElementById(id).setAttribute("visibility", "visible"));
    svg.getElementById("cx").setAttribute("x1", cx); svg.getElementById("cx").setAttribute("x2", cx);
    svg.getElementById("cd").setAttribute("cx", cx); svg.getElementById("cd").setAttribute("cy", cy);
    tip.style.display = "block"; tip.style.left = Math.min(Math.max(cx / W * r.width, 60), r.width - 60) + "px";
    tip.textContent = `${fmtDay(pts[i].date)} ${won(pts[i].net)}`;
  };
  svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", () => { tip.style.display = "none"; ["cx", "cd"].forEach(id => svg.getElementById(id).setAttribute("visibility", "hidden")); });
}

function summary() {
  const t = DATA.totals;
  const kinds = KINDS.map(([k, l], i) => ({k, l, v: t.byKind[k] || 0, c: SERIES[i]})).filter(x => x.v > 0);
  const tot = kinds.reduce((a, x) => a + x.v, 0);
  const alloc = tot ? `<h2>금융 자산 구성</h2><div class="card"><div class="alloc" role="img" aria-label="금융 자산 구성">${kinds.map(x =>
      `<i style="width:${(x.v / tot * 100).toFixed(2)}%;background:var(${x.c})" title="${esc(x.l)}"></i>`).join("")}</div>
      <div class="legend">${kinds.map(x => `<span><i style="background:var(${x.c})"></i>${esc(x.l)}<b>${won(x.v)} · ${(x.v / tot * 100).toFixed(0)}%</b></span>`).join("")}</div>
      ${t.realestate ? `<div class="legend" style="margin-top:8px"><span>🏠 부동산<b>${won(t.realestate)}</b></span><span>대출<b>${won(-t.loan)}</b></span></div>` : ""}</div>` : "";
  const stats = ORDER.map(c => {
    const list = byCat(c);
    let n = list.length + "", l = CATS[c].label;
    if (c === "finance") { n = won(t.finance); l = `금융 ${list.length}개`; }
    if (c === "pipeline") { n = won(list.reduce((a, x) => a + monthly(x), 0)) + "/월"; l = `파이프라인 ${list.filter(x => (x.f.status || "on") === "on").length}개 운영`; }
    if (c === "realestate" && list.length) { n = won(t.realestate - t.loan); l = `부동산 ${list.length}곳(순)`; }
    if (c === "people") l = "사람";
    if (c === "positions") { const cur = list.filter(x => !(x.f || {}).end).length; l = `직위 · 지금 ${cur}개`; }
    return `<button type="button" class="stat" data-view="${c}"><div class="l">${CATS[c].icon} ${esc(l)}</div><div class="n">${esc(n)}</div></button>`;
  }).join("");
  const dd = upcoming(60);
  const days = dd.length ? `<h2>다가오는 날</h2><div class="card">${dd.map(x =>
      `<div class="dday"><span>${esc(x.text)}</span><b>${x.days ? "D-" + x.days : "오늘"}</b></div>`).join("")}</div>` : "";
  const now = byCat("positions").filter(x => !(x.f || {}).end).sort((a, b) => a.date < b.date ? 1 : -1);
  const pos = now.length ? `<h2>지금 맡고 있는 일</h2><div class="list">${now.map(itemCard).join("")}</div>` : "";
  const empty = DATA.items.some(it => ORDER.includes(it.category)) ? "" : `<div class="card" style="margin-top:12px"><p class="empty" style="padding:8px 0">아직 기록이 없습니다.<br>
      오른쪽 아래 <b>＋ 추가</b>로 첫 기록을 남겨 보세요. 돈으로 셀 수 있는 것뿐 아니라 사람·저작물·직위·수상도 함께 쌓입니다.</p></div>`;
  return `${empty}<h2>한눈에</h2><div class="grid">${stats}</div>${days}${alloc}${pos}
    <p class="muted" style="margin-top:20px">데이터는 이 구글 계정의 비공개 시트에만 저장됩니다 · <a href="${esc(DATA.sheetUrl)}" target="_blank" rel="noopener">시트 열기</a></p>`;
}
function upcoming(within) {
  const out = [];
  byCat("people").forEach(p => {
    const b = nextDday(p.date);
    if (b && b.days <= within) out.push({days: b.days, text: `🎂 ${p.name}${p.f.relation ? "(" + p.f.relation + ")" : ""} 생일 · ${b.years}번째`});
    const a = nextDday(p.f.anniv_date);
    if (a && a.days <= within) out.push({days: a.days, text: `💐 ${p.name} ${p.f.anniv_label || "기념일"} · ${a.years}주년`});
  });
  return out.sort((x, y) => x.days - y.days);
}

function itemCard(it) {
  const f = it.f || {}, v = it.v || {};
  let sub = [], right = "", rsub = "", badge = "";
  if (it.category === "finance") {
    if (VIEW !== "finance") sub.push(KIND_LABEL[f.kind] || "기타");      // 금융 목록은 종류별 묶음 제목이 있다
    if (priced(f)) {
      if (f.qty) sub.push(`${Number(f.qty).toLocaleString("ko-KR")}${f.kind === "coin" ? "개" : "주"}`);
      if (isFinite(v.price)) sub.push("현재가 " + (f.kind === "us" ? "$" + Number(v.price).toLocaleString("en-US") : Number(v.price).toLocaleString("ko-KR") + "원"));
      if (v.stale) badge = '<span class="badge warn">시세 없음 · 평단가로 계산</span>';
      if (v.manual) badge = '<span class="badge">직접 입력 금액</span>';
    }
    if (f.account) sub.push(f.account);
    right = won(v.value);
    if (isFinite(v.gainPct)) rsub = `<span class="${tone(v.gainPct)}">${pct(v.gainPct)}${isFinite(v.gain) ? " · " + won(v.gain, true) : ""}</span>`;
  } else if (it.category === "realestate") {
    if (f.place) sub.push(f.place);
    if (it.date) sub.push(fmtDay(it.date) + " 매입 · " + span(it.date));
    if (v.loan) sub.push("대출 " + won(v.loan));
    right = won(v.value);
    if (isFinite(v.gainPct)) rsub = `<span class="${tone(v.gain)}">매입가 대비 ${pct(v.gainPct)}</span>`;
  } else if (it.category === "people") {
    if (f.relation) sub.push(f.relation);
    const a = age(it.date); if (a != null) sub.push(`만 ${a}세`);
    const b = nextDday(it.date); if (b) right = b.days ? "생일 D-" + b.days : "오늘 생일";
    if (f.anniv_date) { const n = nextDday(f.anniv_date); rsub = `${esc(f.anniv_label || "기념일")} ${n ? (n.days ? "D-" + n.days : "오늘") : ""}`; }
  } else if (it.category === "works") {
    const kinds = Object.fromEntries(FIELDS.works[0].options); sub.push(kinds[f.kind] || "저작물");
    if (it.date) sub.push(fmtDay(it.date));
    if (num(f.income)) right = won(num(f.income));
  } else if (it.category === "positions") {
    if (f.org) sub.push(f.org);
    if (it.date) sub.push(`${fmtDay(it.date)} ~ ${f.end ? fmtDay(f.end) : "지금"}`);
    if (typeof jobShare === "function" && jobShare(it).full) sub.push("직업 " + fmtTop(jobShare(it).p));
    right = span(it.date, f.end || null);
    if (!f.end) badge = '<span class="badge">지금</span>';
  } else if (it.category === "pipeline") {
    sub.push(PIPE_KIND[f.kind] || "기타");
    if (it.date) sub.push(fmtDay(it.date) + " 시작 · " + span(it.date));
    const st = f.status || "on";
    if (st !== "on") badge = `<span class="badge${st === "prep" ? " warn" : ""}">${esc(PIPE_STAT[st])}</span>`;
    if (num(f.monthly)) { right = won(num(f.monthly)) + "/월"; rsub = st === "on" ? "연 " + won(num(f.monthly) * 12) : ""; }
    const tot = pipeTotal(it.id), n = pipeIncomes(it.id).length;
    if (n) { sub.push(`누적 수익 ${won(tot)}(${n}건)`); if (!right) right = "누적 " + won(tot); }
  } else if (it.category === "awards") {
    const kinds = Object.fromEntries(FIELDS.awards[0].options); sub.push(kinds[f.kind] || "수상");
    if (f.org) sub.push(f.org);
    if (it.date) right = fmtDay(it.date);
  }
  const link = f.link ? ` · <a href="${esc(f.link)}" target="_blank" rel="noopener" data-stop>링크</a>` : "";
  return `<button type="button" class="item" data-edit="${esc(it.id)}"><span class="t">${esc(it.name)}${badge}</span>
    <span class="r">${esc(right)}</span><span class="s">${sub.map(esc).join(" · ")}${link}</span><span class="rs">${rsub}</span></button>`;
}

function category(c) {
  let list = byCat(c).slice();
  const head = `<div class="row"><h2>${CATS[c].icon} ${esc(CATS[c].label)} <span class="muted">${list.length}</span></h2>
    ${c === "finance" ? '<button class="btn" type="button" data-act="refresh">시세 새로고침</button>' : ""}</div>`;
  if (!list.length) return head + `<p class="empty">아직 없습니다. ＋ 추가로 기록해 보세요.</p>`;
  if (c === "finance") {
    list.sort((a, b) => (b.v.value || 0) - (a.v.value || 0));
    return head + KINDS.map(([k, l]) => {
      const g = list.filter(x => (x.f.kind || "etc") === k); if (!g.length) return "";
      const sum = g.reduce((a, x) => a + (x.v.value || 0), 0);
      return `<div class="group row"><span>${esc(l)}</span><span>${won(sum)}</span></div><div class="list">${g.map(itemCard).join("")}</div>`;
    }).join("");
  }
  if (c === "pipeline") {
    const total = list.reduce((a, x) => a + monthly(x), 0);
    const top = `<div class="card" style="margin-bottom:6px"><div class="row"><span class="muted">운영 중인 파이프라인 월 합계</span>
      <b style="font-size:18px">${won(total)}</b></div><div class="muted">연으로 치면 ${won(total * 12)} · 순자산에는 더하지 않습니다</div></div>`;
    return head + top + PIPE_STATUS.map(([k, l]) => {
      const g = list.filter(x => (x.f.status || "on") === k).sort((a, b) => (num(b.f.monthly) || 0) - (num(a.f.monthly) || 0));
      return g.length ? `<div class="group">${esc(l)} · ${g.length}개</div><div class="list">${g.map(itemCard).join("")}</div>` : "";
    }).join("");
  }
  if (c === "people") list.sort((a, b) => (nextDday(a.date) || {days: 999}).days - (nextDday(b.date) || {days: 999}).days);
  else if (c === "positions") list.sort((a, b) => (!!a.f.end - !!b.f.end) || ((a.date || "") < (b.date || "") ? 1 : -1));   // 지금 맡은 일 먼저
  else list.sort((a, b) => (a.date || "") < (b.date || "") ? 1 : -1);
  if (c === "awards" || c === "works") {
    const years = {};
    list.forEach(x => { const y = (x.date || "").slice(0, 4) || "날짜 없음"; (years[y] = years[y] || []).push(x); });
    return head + Object.keys(years).sort().reverse().map(y =>
      `<div class="group">${esc(y)} · ${years[y].length}개</div><div class="list">${years[y].map(itemCard).join("")}</div>`).join("");
  }
  return head + `<div class="list">${list.map(itemCard).join("")}</div>`;
}

// 연표 날짜: 2024-3-1처럼 적힌 것도 2024-03-01로 맞춰 정렬한다(날짜가 아니면 뺀다)
function normDay(v) {
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(v || "").trim());
  return m ? `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}` : "";
}
let TL_NEW = store.get("tlOrder") === "new";      // 기본: 오래된 것부터(연도·날짜 순)
function timeline() {
  const ev = [];
  const add = (d, t, id) => { d = normDay(d); if (d) ev.push({d, t, id}); };
  DATA.items.filter(it => ORDER.includes(it.category)).forEach(it => {      // 성장 기록(log 등)은 연표에서 뺀다
    const f = it.f || {}, c = CATS[it.category] || {icon: "•"};
    if (it.category === "people") {
      if (f.anniv_date) add(f.anniv_date, `💐 ${it.name} · ${f.anniv_label || "기념일"}`, it.id);
      return;
    }
    const what = {finance: "매수", pipeline: "시작", realestate: "매입", works: "발표", positions: "시작", awards: ""}[it.category] || "";
    add(it.date, `${c.icon} ${it.name}${what ? " " + what : ""}${f.org ? " · " + f.org : ""}`, it.id);
    if (it.category === "positions" && f.end) add(f.end, `${c.icon} ${it.name} 마침`, it.id);
  });
  if (!ev.length) return '<h2>📜 인생 연표</h2><p class="empty">날짜가 있는 기록이 쌓이면 연도별로 모아 보여 줍니다.</p>';
  // 날짜(연·월·일) 순, 같은 날은 이름 순. 최신순이면 뒤집는다
  ev.sort((a, b) => a.d.localeCompare(b.d) || a.t.localeCompare(b.t, "ko"));
  if (TL_NEW) ev.reverse();
  const years = [];
  ev.forEach(e => { const y = e.d.slice(0, 4); if (!years.length || years[years.length - 1].y !== y) years.push({y, list: []}); years[years.length - 1].list.push(e); });
  const toggle = `<button class="btn" type="button" data-act="tl-order">${TL_NEW ? "오래된 순으로" : "최신 순으로"}</button>`;
  return `<div class="row"><h2>📜 인생 연표 <span class="muted">${TL_NEW ? "최신 순" : "오래된 순"}</span></h2>${toggle}</div>` +
    years.map(g => `<div class="year">${g.y} <span class="muted">${g.list.length}개</span></div>` +
      g.list.map(e => `<div class="tl" data-edit="${esc(e.id)}"><span class="d">${+e.d.slice(5, 7)}.${+e.d.slice(8)}</span><span>${esc(e.t)}</span></div>`).join("")).join("");
}

  setTimeout(() => { const n = $("#form [name=name]"); if (n && !it && !$("#form").contains(document.activeElement)) n.focus(); }, 50);

function readForm() {
  const fd = new FormData($("#form"));
  EDIT.category = fd.get("category") || EDIT.category;
  EDIT.name = (fd.get("name") || "").trim(); EDIT.date = fd.get("date") || "";
  const f = {};
  for (const [k, v] of fd.entries()) {
    if (!k.startsWith("f_")) continue;
    const key = k.slice(2), def = FIELDS[EDIT.category].find(x => x.k === key);
    if (v === "") continue;
    f[key] = def && def.type === "num" ? num(v) : v.trim();
  }
  EDIT.f = f;
}

async function incomeAct(kind, id) {
  readForm(); const keep = EDIT;                     // 고치던 내용은 그대로 두고 수익 기록만 저장
  try {
    if (kind === "add") {
      const amt = num($("#inc_amt").value), d = $("#inc_date").value || DATA.today;

  // 기능·영감: 가사·돌봄 시간 + 처음·완성 기록(같은 상한 안)
  const craftMin = by("craft", "time").reduce((a, l) => a + (l.f.field === "recycle" ? (num(l.f.count) || 1) * RECYCLE_MIN : (num(l.f.minutes) || 0)), 0);
  // 기타(직접 적은 기능·영감 활동): 하루에 40분마다 1점, 하루 최대 2점(가사·돌봄 시간과 따로)
  const etcDay = {};
  by("craft", "etc").forEach(l => { etcDay[l.date] = (etcDay[l.date] || 0) + (num(l.f.minutes) || 0); });
  const etcMin = Object.values(etcDay).reduce((a, m) => a + m, 0), etcPts = Object.values(etcDay).reduce((a, m) => a + Math.min(ETC_DAY_CAP, Math.floor(m / ETC_UNIT)), 0);
  out.craft = flow(topShareTime(craftMin / 7, BENCH.craft), craftMin, `가사·돌봄 하루 평균 ${Math.round(craftMin / 7)}분${etcMin ? ` · 기타 ${etcMin}분` : ""}`,
    by("craft", "first").length * 5 + by("craft", "project").reduce((a, l) => a + (SIZE_PTS[l.f.size] || 5), 0) + etcPts);
  out.craft.vol = craftMin;
  // 성취 기록(정신·커리어 공통): 같은 종류 반복은 절반 → 0, 큰 돌파는 월 1회, 한 주 최대 CAP
  const rep = {};          // 같은 영역 세 번째부터(0점이던 반복 성취) — 작은 기록 적립용
  const winPts = goal => {
    // 같은 주 같은 영역은 큰 것부터 한 번(전부) → 두 번째(절반) → 세 번째부터 0점(작은 기록 적립으로).
    // 큰 돌파는 한 달에 첫 번째 것만 +40, 나머지는 의미 있는 승리(+15)로 — 기록을 더해 합계가 줄지 않게 큰 순서·달 단위로 센다
    let pts = 0; rep[goal] = 0;
    const wins = by(goal, "win"), subs = {};
    wins.forEach(l => { (subs[l.f.sub || "etc"] = subs[l.f.sub || "etc"] || []).push(l.f.size === "l" ? SIZE_PTS.m : (SIZE_PTS[l.f.size] || 5)); });
    Object.values(subs).forEach(v => { v.sort((a, b) => b - a); pts += (v[0] || 0) + (v[1] || 0) / 2; rep[goal] += Math.max(0, v.length - 2); });
    wins.filter(l => l.f.size === "l").forEach(l => {
      const firstOfMonth = logs.filter(o => o.f.goal === goal && o.f.type === "win" && o.f.size === "l" && o.date.slice(0, 7) === l.date.slice(0, 7))
        .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.id < b.id ? -1 : 1))[0];
      if (firstOfMonth === l) pts += SIZE_PTS.l - SIZE_PTS.m;

  };
  // 커리어: 결과(성취) 기록. 학습 시간 기록은 점수에 넣지 않는다
  const carPts = winPts("career");
  out.career = {p: carPts ? pFromPts(carPts) : 1, pts: carPts, any: carPts > 0, what: `커리어 성취 ${by("career", "win").length}개`, rep: rep.career};
  // 사회: 교류·나눔 시간 + 기부·기념일 챙김(작은 기록, 같은 상한 안)
  // 사회: 가족 관계 행동 횟수(부모님·배우자·가족 식사·기념일)만 상위 %로. 친구·모임 시간은 작은 기록 적립으로만(기부·봉사는 점수에 넣지 않음)
  const famN = by("social").filter(l => FAMILY_TYPES.includes(l.f.type)).reduce((a, l) => a + (num(l.f.count) || 1), 0);
  const socMin = by("social", "together").reduce((a, l) => a + (num(l.f.minutes) || 0), 0);
  out.social = flow(topShareTime(famN / 7, BENCH.social), famN, `가족 관계 ${famN}회${socMin ? ` · 친구·모임 ${socMin}분` : ""}`);
  out.social.vol = socMin; out.social.alwaysSmall = true;
  // 정신: 성취 기록 — 점수를 상위 %로 되돌려 표시(상위 %는 성적표에서 스트레스 점검으로 바꿔 보여 줌)
  const mindPts = winPts("mind");
  out.mind = {p: mindPts ? pFromPts(mindPts) : 1, pts: mindPts, any: mindPts > 0, what: `정신 성취 ${by("mind", "win").length}개`, rep: rep.mind};
  // 경제: 그 주에 적은 월 저축률(한 달 점수를 주 단위로 환산해 그 주에 넣음)
  const sav = by("economy", "saving").map(l => (num(l.f.income) > 0 ? (num(l.f.saving) || 0) / num(l.f.income) : null)).filter(r => r != null);
  if (sav.length) {
    const r = Math.max(...sav), p = topShareNormal(r, BENCH.economy);
    out.economy = {p, pts: Math.min(CAP * MONTH_W, R(p) * MONTH_W), any: true, what: `저축률 ${Math.round(r * 100)}% (월)`, saved: Math.max(...sav) > 0};
  } else out.economy = {p: 1, pts: 0, any: false, what: ""};
  return out;
}
function flow(p, amount, what, extra) {
  const any = amount > 0 || extra > 0;

// 작은 기록 적립: 평균에 못 미쳐 그 주 점수가 0이던 행동을 시작일부터 계속 모아, 정해 둔 양을 채울 때마다 1점(흐름 점수).
// 1점 = 그 영역 '평균 한 주' 양의 약 1/8(작은 행동도 자주 보상받도록). 한 영역 한 주 최대 SMALL_CAP점.
// 평균을 넘긴 주도 계속 모은다 — 기록을 하나 더해 평균을 넘는 순간 적립이 사라져 점수가 줄던 일을 막기 위해(성취는 쌓일수록 좋아야 한다).
const SMALL_CAP = 3;
const SMALL = {
  body: {unit: 30, label: "운동", fmt: v => `${v}분`, why: "30분 = 1점(짧은 운동은 모아서 30분이 되면 1점)"},
  craft: {unit: 60, label: "가사·돌봄", fmt: v => `${v}분`, why: "30대 남성 한 주 평균 ≈ 530분의 약 1/8. 분리수거 1회 = 15분 → 4회 = 1점, 요리·청소 1시간 = 1점"},
  social: {unit: 30, label: "친구·모임", fmt: v => `${v}분`, why: "친구·모임 시간은 상위 %에 넣지 않고 30분마다 1점(한 주 최대 3점)"},
  mind: {unit: 1, label: "반복 성취", fmt: v => `${v}회`, why: "같은 주 같은 영역 세 번째부터(5 → 2.5 → 0점이던 것) 1회 = 1점"},
  career: {unit: 1, label: "반복 성취", fmt: v => `${v}회`, why: "정신과 같은 규칙"},
  check: {unit: 1, label: "점검·측정", fmt: v => `${v}회`, why: "스트레스 점검·체력 측정은 구간·등급이 오르지 않아도 1회(한 달 1회까지) 1점"},
  economy: {unit: 1, label: "저축한 달", fmt: v => `${v}달`, why: "저축률과 상관없이 저축한 달 1점(저축률 상위 % 점수와 별도)"}
};

// 돌파(한 번) 점수 목록: [{date, goal, pts, label, past}]
function milestones(start) {
  const ev = [], add = (date, goal, p, label) => {
    const pts = R(p) * MILE;
    if (pts > 0) ev.push({date: date || "", goal, pts, label: `${label} (${fmtTop(p)})`, past: !date || date < start});
  };
  const items = DATA.items;
  // 자산 탭 항목의 성취 날짜는 적어 둔 날짜. 비어 있으면 과거 업적으로 본다(점수는 같음)
  // (등록·수정 시각을 쓰면 옛 업적을 고치기만 해도 새 성취가 되므로 쓰지 않는다)
  const when = i => i.date || "";
  // 직업(취직·전직·승진): 날짜순으로 보며 '지금까지 가장 높은 직업'을 넘은 만큼만 돌파 점수(같은 급 이직을 되풀이해도 늘지 않음)
  let bestJob = 0;
  items.filter(i => i.category === "positions").sort((a, b) => when(a) < when(b) ? -1 : 1).forEach(i => {
    const p = jobShare(i).p, pts = R(p) * MILE;
    if (pts > bestJob + .05) {
      ev.push({date: when(i), goal: "career", pts: pts - bestJob, past: !when(i) || when(i) < start,
        label: `🎖 ${i.name} (직업 ${fmtTop(p)})${bestJob ? " · 이전 최고보다 오른 만큼" : ""}`});
      bestJob = pts;
    }
  });
  items.filter(i => i.category === "awards").forEach(i => add(when(i), "career",
    i.f.kind === "cert" ? (MILES.cert.p[i.f.cert_level] || .3) : (MILES.award.p[i.f.level] || .3), `🏆 ${i.name}`));
  items.filter(i => i.category === "works").forEach(i => {
    add(when(i), "career", MILES.work.p[i.f.kind] || .2, `✍️ ${i.name}`);
    MILES.income.bands.forEach(([v, p]) => { if ((num(i.f.income) || 0) >= v) add(when(i), "economy", p, `✍️ ${i.name} 수익 ${won(v)} 돌파`); });
  });
  // 파이프라인: 파이프라인마다 수익 기록을 날짜순으로 더해, 누적 수익이 구간을 넘은 날 돌파
  items.filter(i => i.category === "pipeline").forEach(pl => {
    let cum = 0;
    pipeIncomes(pl.id).forEach(e => {
      const before = cum; cum += num(e.f.amount) || 0;
      MILES.pipeIncome.bands.forEach(([v, p]) => { if (before < v && cum >= v) add(e.date, "economy", p, `💵 ${pl.name} 누적 수익 ${won(v)} 돌파`); });
    });
  });
  // 부동산: 첫 내 집 마련(가장 이른 매입)
  const homes = items.filter(i => i.category === "realestate").sort((a, b) => when(a) < when(b) ? -1 : 1);
  if (homes.length) add(when(homes[0]), "economy", MILES.home.p, `🏠 첫 내 집 마련 · ${homes[0].name}`);
  // 사람: 결혼(배우자 + 결혼기념일), 자녀(태어난 순서)
  const people = items.filter(i => i.category === "people");
  people.filter(i => /배우자|아내|남편|부인/.test(i.f.relation || "")).slice(0, 1).forEach(i => {
    const d = /결혼/.test(i.f.anniv_label || "") ? i.f.anniv_date : "";
    add(d || "", "social", MILES.marriage.p, `💍 결혼 · ${i.name}`);
  });
  people.filter(i => /자녀|아들|딸|첫째|둘째|셋째|넷째|막내/.test(i.f.relation || "")).sort((a, b) => (a.date || "9") < (b.date || "9") ? -1 : 1)
    .forEach((i, k) => add(i.date || "", "social", MILES.child.p[Math.min(k + 1, 3)], `👶 ${k + 1}번째 자녀 · ${i.name}`));
  // 순자산: 매일 기록에서 처음 넘은 날. 시작일에 이미 넘어 있던 구간은 과거 업적
  const h = DATA.history.filter(x => isFinite(x.net));
  MILES.networth.bands.forEach(([v, p]) => {
    const first = h.find(x => x.net >= v);
    if (first) add(first.date > start ? first.date : "", "economy", p, `💰 순자산 ${won(v)} 돌파`);
  });
  // 저장된 돌파(파이프라인·스트레스 점검 구간): 기록할 때 확정해 둔 것
  gMiles().forEach(m => ev.push({date: m.f.past ? "" : m.date, goal: m.f.goal, pts: num(m.f.pts) || 0, label: m.name, past: !!m.f.past}));
  // 기록에서 나오는 돌파
  const logs = gLogs();
  logs.filter(l => l.f.type === "race").forEach(l => add(l.date, "body", MILES.race.p[l.f.dist] || .1, `🏃 ${l.name}`));
  // 체력 등급: 지금까지 가장 좋은 등급까지 오른 만큼만(첫 측정 포함) — 기록을 더해도 합계가 줄지 않게(합계 = 최고 등급의 점수)
  let bestFit = 0;
  logs.filter(l => l.f.type === "fitness").sort((a, b) => a.date < b.date ? -1 : 1).forEach(l => {
    const g = num(l.f.grade) || 3, pts = R(MILES.fitness.p[g] || .7) * MILE;
    if (pts > bestFit + .05) { ev.push({date: l.date, goal: "body", pts: pts - bestFit, label: `💪 체력 ${g}등급 (${fmtTop(MILES.fitness.p[g] || .7)})${bestFit ? " · 이전 최고보다 오른 만큼" : ""}`, past: l.date < start}); bestFit = pts; }
  });
  logs.filter(l => l.f.type === "level").forEach(l => add(l.date, "craft", MILES.craftLevel.p[l.f.stage] || .4, `📈 ${l.name}`));
  return ev;
}

// 파이프라인·스트레스 점검처럼 '지금 상태'로 정하는 돌파는 처음 확인한 날 저장해 두면 점수가 줄지 않는다
let persisting = false;
async function persistMiles(start, activating) {
  if (persisting) return 0;
  persisting = true;
  try { return await persistMilesOnce(start, activating); } finally { persisting = false; }
}
async function persistMilesOnce(start, activating) {
  const have = new Set(gMiles().map(m => m.f.key)), todo = [];
  const pipe = byCat("pipeline").reduce((a, x) => a + monthly(x), 0);
  MILES.pipeline.bands.forEach(([v, p]) => { if (pipe >= v && !have.has("pipe:" + v)) todo.push({key: "pipe:" + v, goal: "economy", p, label: `💵 파이프라인 월 ${won(v)} 돌파`}); });
  const pss = gLogs().filter(l => l.f.type === "pss").sort((a, b) => a.date < b.date ? -1 : 1);
  if (pss.length) {
    const base = topShareNormal(num(pss[0].f.score), BENCH.mind, true);
    pss.slice(1).forEach(l => {
      const p = topShareNormal(num(l.f.score), BENCH.mind, true);
      MILES.pss.bands.forEach(b => { if (p <= b && base > b && !have.has("pss:" + b)) { have.add("pss:" + b); todo.push({key: "pss:" + b, goal: "mind", p: b, label: `🧘 스트레스 점검 상위 ${b * 100}% 진입`, date: l.date}); } });
    });
  }
  for (const t of todo) {
    await api("saveItem", {category: "milestone", name: `${t.label} (${fmtTop(t.p)})`, date: t.date || DATA.today,
      f: {goal: t.goal, key: t.key, pts: Math.round(R(t.p) * MILE * 10) / 10, past: activating ? "1" : ""}});
  }
  return todo.length;
}

// 전체 점수 계산
function scoreAll() {
  const st = gSetting(), start = st ? st.date : DATA.today;
  const logs = gLogs(), weeks = [], byGoal = Object.fromEntries(GOALS.map(g => [g.k, 0])), events = [];
  const acc = Object.fromEntries(GOALS.map(g => [g.k, 0])), checkMonth = new Set();
  for (let ws = weekStart(start); ws <= weekStart(DATA.today); ws = addDays(ws, 7)) {
    const w = weekStats(ws, logs, start); weeks.push({ws, w});
    // 작은 기록 적립(평균 아래라 0점이던 것): 모아서 정해 둔 양마다 1점 — 그 주 점수에 더해 '최근 얻은 점수'에도 보인다
    const we = addDays(ws, 6), small = {}, checks = {};      // 점검·측정 1점은 주 상한(3점) 밖에서 따로 — 다른 적립 자리를 빼앗지 않게
    // 기록을 더해 점수가 줄어드는 일이 없게: 평균 위·아래와 상관없이 늘 모은다(예전엔 평균을 넘는 순간 적립이 사라져 점수가 줄 수 있었음)
    ["body", "craft", "social"].forEach(k => { if (w[k].vol > 0) acc[k] += w[k].vol; });
    ["mind", "career"].forEach(k => { acc[k] += w[k].rep || 0; });
    if (w.economy.saved) acc.economy += 1;
    logs.filter(l => l.date >= ws && l.date <= we && l.date >= start && ["pss", "fitness"].includes(l.f.type)).forEach(l => {
      const key = l.f.type + l.date.slice(0, 7); if (!checkMonth.has(key)) { checkMonth.add(key); checks[l.f.goal] = (checks[l.f.goal] || 0) + 1; } });
    GOALS.forEach(g => { const u = SMALL[g.k].unit, n = Math.floor(acc[g.k] / u), room = Math.max(0, SMALL_CAP - (small[g.k] || 0)), give = Math.min(n, room);
      // 한 주 최대 3점. 넘친 양은 버리되 1점이 안 되는 만큼은 다음 주로 넘김(더 많이 해서 다음 주 적립이 줄어드는 일이 없게)
      acc[g.k] = n > room ? Math.min(u * .999, acc[g.k] - give * u) : acc[g.k] - give * u;
      small[g.k] = Math.min(SMALL_CAP, (small[g.k] || 0) + give) + (checks[g.k] || 0); });
    GOALS.forEach(g => { if (small[g.k]) { w[g.k].pts += small[g.k]; w[g.k].what += ` · 작은 기록 적립 +${small[g.k]}`; } });
    GOALS.forEach(g => { if (w[g.k].pts) { byGoal[g.k] += w[g.k].pts; events.push({date: addDays(ws, 6) > DATA.today ? DATA.today : addDays(ws, 6), goal: g.k, pts: w[g.k].pts,
      label: `${ws.slice(5).replace("-", ".")} 주 · ${w[g.k].what}${w[g.k].p < .5 ? ` (${fmtTop(w[g.k].p)})` : ""}`, week: true}); } });
  }
  const flowTotal = Object.values(byGoal).reduce((a, b) => a + b, 0);       // 흐름 점수(매주 쌓은 것)
  milestones(start).forEach(m => {
    byGoal[m.goal] += m.pts; events.push(m.past ? {...m, label: m.label + " · 과거 업적"} : m);
  });
  const total = Object.values(byGoal).reduce((a, b) => a + b, 0);
  return {start, weeks, byGoal, events: events.sort((a, b) => a.date < b.date ? 1 : -1), total, flowTotal, mileTotal: total - flowTotal};
}
// ---------------------------------------------------------------- 비교군(상위 %만 바뀐다)

    <polygon points="${ring(FLOOR)}" fill="var(--chip)" stroke="var(--line)" stroke-width="1"/>

    <polygon points="${poly}" fill="var(${color})" fill-opacity=".22" stroke="var(${color})" stroke-width="2.5" stroke-linejoin="round"/>${rdots}${dots}${labels}</svg>
    ${cmpv ? `<div style="font-size:12px;font-weight:800;margin:2px 0 4px">${GOALS.filter((_, i) => win(i)).length}승 ${GOALS.filter((_, i) => !win(i) && !miss(i)).length}패${GOALS.some((_, i) => miss(i)) ? ` · 기록 없음 ${GOALS.filter((_, i) => miss(i)).length}` : ""}</div>

<script>

  mind: [["meditate", "🧘 명상·호흡", {type: "win", sub: "heart"}], ["journal", "📓 일기·성찰", {type: "win", sub: "heart"}],
    ["calm", "🌊 감정 다스리기", {type: "win", sub: "emotion"}], ["avoid", "🦁 미루던 일 하기", {type: "win", sub: "avoid"}],
    ["focus", "⏰ 집중·루틴 지키기", {type: "win", sub: "discipline"}], ["detox", "🧲 유혹 참기(폰·간식 등)", {type: "win", sub: "impulse"}]],

};

function runningTimers() {

}
const actOf = (goal, act) => (TIMER_ACTS[goal] || []).find(a => a[0] === act);
const hhmm = ms => { const d = new Date(ms); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const clock = ms => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return `${h ? h + ":" : ""}${String(m).padStart(h ? 2 : 1, "0")}:${String(s % 60).padStart(2, "0")}`; };
const goalIcon = g => (GOAL[g] || {}).icon || "⏱";

// 화면 아래 '진행 중' 막대: 어느 탭에 있든, 새로고침해도 보이고 여기서 바로 끝낼 수 있다
function renderRunBar() {
  const list = runningTimers(), bar = $("#runbar");

    return `<div class="rb-row"><span class="rb-dot"></span><span class="rb-name">${goalIcon(t.f.goal)} ${esc(t.f.act === "etc" ? (t.f.memo || "기타") : a ? a[1].replace(/^\S+\s/, "") : t.name)}<small>진행 중 · ${hhmm(num(t.f.start))} 시작</small></span>

}

function renderTimer() {

  const run = runningTimers();
  let html = "";
  if (!gSetting()) html += `<div class="note">🏅 성장 탭에서 '오늘부터 시작하기'를 한 번 눌러야 기록이 점수에 들어가요.</div>`;
  if (TSEL.goal) {

      <div class="tm-acts">${acts.map(([k, l]) => `<button type="button" class="tm-act" data-t="act" data-k="${k}" aria-pressed="${k === TSEL.act}">${esc(l)}</button>`).join("")}</div>

      <button class="btn primary tm-big" type="button" data-t="${rec ? "once" : "start"}" ${TSEL.act ? "" : "disabled"}>${rec ? "♻️ 1회 기록" : "▶ 시작"}</button>
      <p class="muted" style="font-size:12px">${rec ? "분리수거는 시간 대신 횟수로 기록해요(1회 = 15분으로 계산)." : esc(TIMER_HINT[TSEL.goal])}</p>`;
  } else {
    html += habitBar();
    html += `<h2 style="margin-top:4px">무엇을 시작할까요?</h2><div class="tm-goals">${TIMER_GOALS.map(k => `<button type="button" class="tm-goal" data-t="goal" data-goal="${k}">
      <span class="ic">${GOAL[k].icon}</span><span>${GOAL[k].label}<small>${esc(TIMER_ACTS[k].slice(0, 4).map(a => a[1].replace(/^\S+\s/, "")).join(" · "))} …</small></span></button>`).join("")}</div>
      ${run.length ? `<p class="muted" style="font-size:12px">진행 중인 일은 화면 아래에 있어요. 다른 일을 함께 시작할 수도 있어요. 화면을 끄거나 앱을 닫아도 시간은 계속 흘러요.</p>` : ""}`;
  }
  // 최근 기록 10개: 시간 변경·삭제
  const recent = gLogs().filter(l => TIMER_GOALS.includes(l.f.goal)).sort((a, b) => (b.date + b.updated) < (a.date + a.updated) ? -1 : 1).slice(0, 10);
  const mins = gLogs().filter(l => TIMER_GOALS.includes(l.f.goal) && l.date === DATA.today).reduce((a, l) => a + (num(l.f.minutes) || 0), 0);
  html += `<h2>최근 기록 <span class="muted" style="font-size:13px;font-weight:400">오늘 ${mins}분</span></h2>`;
  html += recent.length ? `<div class="list">${recent.map(l => { const m = num(l.f.minutes), c = num(l.f.count);
    return `<div class="item tm-rec" style="cursor:default"><span class="t">${goalIcon(l.f.goal)} ${esc(l.name)}</span>
      <span class="r">${esc(l.date === DATA.today ? "오늘" : l.date === addDays(DATA.today, -1) ? "어제" : fmtDay(l.date))}</span>
      <span class="s">${esc(l.f.text || "")}</span>
      <span class="rs"><button class="btn" type="button" data-t="edit" data-id="${esc(l.id)}">${m != null ? "시간 변경" : c != null ? "횟수 변경" : "고치기"}</button>
        <button class="btn danger" type="button" data-t="del" data-id="${esc(l.id)}">삭제</button></span></div>`; }).join("")}</div>`
    : `<p class="muted">아직 기록이 없어요. 위에서 하나를 골라 시작해 보세요.</p>`;
  $("#tmain").innerHTML = html;
}
// 하루 습관: 한 번 누르면 1회 기록(오늘 몇 번 했는지 / 권장 횟수)
function habitBar() {
  const today = gLogs().filter(l => l.f.type === "habit" && l.date === DATA.today);
  const cnt = k => today.filter(l => l.f.field === k).reduce((a, l) => a + (num(l.f.count) || 1), 0) + (HAB_PENDING[k] || 0);
  return `<h2 style="margin-top:4px">💪 하루 습관 <span class="muted" style="font-size:12px;font-weight:400">누르면 1회 기록</span></h2>
    <div class="tm-acts" style="grid-template-columns:repeat(3,1fr)">${HABITS.map(([k, l, rec]) => { const c = cnt(k);
      return `<button type="button" class="tm-act" data-t="habit" data-k="${k}" aria-pressed="${c >= rec}">${esc(l)}<br><b style="font-size:13px">${c}/${rec}${c >= rec ? " ✓" : ""}</b></button>`; }).join("")}</div>`;
}
// 습관 버튼: 눌린 즉시 화면 숫자를 올리고(저장 대기), 여러 번·여러 버튼을 연달아 눌러도 차례로 모두 저장한다
//   (예전엔 저장·새로 불러오기(2~4초) 동안 다른 버튼을 누르면 말없이 무시돼 '안 눌린다'고 느껴졌음)
const HAB_PENDING = {}, HAB_QUEUE = [];
let habRunning = false;
function habitLog(k) {
  const h = HABIT[k]; if (!h) return;
  HAB_PENDING[k] = (HAB_PENDING[k] || 0) + 1; HAB_QUEUE.push(k);
  const c = gLogs().filter(l => l.f.type === "habit" && l.f.field === k && l.date === DATA.today).reduce((a, l) => a + (num(l.f.count) || 1), 0) + HAB_PENDING[k];
  toast(`${h[1]} 오늘 ${c}/${h[2]}${c >= h[2] ? " · 오늘 목표 달성!" : ""}`);
  try { navigator.vibrate && navigator.vibrate(20); } catch (e) {}
  renderTimer(); drainHabits();
}
async function drainHabits() {
  if (habRunning) return; habRunning = true;
  try {
    while (HAB_QUEUE.length) {
      const k = HAB_QUEUE.shift(), h = HABIT[k];
      try { await api("saveItem", {category: "log", name: `${h[1]} 1회`, date: DATA.today, f: {goal: "body", type: "habit", field: k, count: 1, text: "하루 습관"}}); }
      catch (e) { toast(`${h[1]} 저장하지 못했습니다: ${e.message}`, true); }
      HAB_PENDING[k] = Math.max(0, (HAB_PENDING[k] || 0) - 1);
      if (DATA) DATA.items.push({id: "hab-" + Date.now() + Math.random(), category: "log", name: `${h[1]} 1회`, date: DATA.today, updated: "", f: {goal: "body", type: "habit", field: k, count: 1, text: "하루 습관"}});
    }
    await loadAssets(true);           // 다 저장한 뒤 한 번만 새로 불러온다
  } finally { habRunning = false; if (HAB_QUEUE.length) drainHabits(); }
}
// 끝낸 시간을 성장 기록(log) 한 건으로 바꾼다 — 날짜는 시작한 날
function timerLog(goal, act, minutes, memo) {
  const a = actOf(goal, act), spec = a[2], label = a[1], text = [label.replace(/^\S+\s/, ""), memo].filter(Boolean).join(" · ") + " (⏱)";
  if (spec.type === "exercise") return {name: `운동 ${minutes}분 · ${label.replace(/^\S+\s/, "")}`, f: {goal, type: "exercise", kind: spec.kind, minutes, text}};
  if (spec.type === "win") return {name: `${Object.fromEntries(MIND_SUBS)[spec.sub]} · ${SIZE_LABEL.s}`, f: {goal, type: "win", sub: spec.sub, size: "s", minutes, text: `${text} ${minutes}분`}};
  if (spec.type === "etc") return {name: `✏️ ${memo || "기타"} ${minutes}분`, f: {goal, type: "etc", minutes, text: `${memo || "기타"} (⏱)`}};
  if (spec.field === "recycle") return {name: `${label} 1회`, f: {goal, type: "time", field: "recycle", count: 1, text}};
  return {name: `${label} ${minutes}분`, f: {goal, type: "time", field: spec.field, minutes, text}};
}
// 기록 고치기(시간·횟수·날짜)
let TEDIT = null;
function openTimeEdit(id) {
  const l = gLogs().find(x => x.id === id); if (!l) return;
  TEDIT = l; const rec = l.f.count != null;
  $("#form").innerHTML = `<h3>${goalIcon(l.f.goal)} ${esc(l.name)}</h3>
    <div class="f"><label for="te_val">${rec ? "횟수" : "시간(분)"}</label><input id="te_val" name="val" inputmode="numeric" required value="${esc(String(rec ? (num(l.f.count) || 1) : (num(l.f.minutes) || 0)))}"></div>
    <div class="f"><label for="te_date">날짜</label><input id="te_date" name="date" type="date" value="${esc(l.date)}" max="${esc(DATA.today)}" min="${esc(l.date < addDays(DATA.today, -1) ? l.date : addDays(DATA.today, -1))}">
      <small>오늘·어제(또는 원래 날짜)만 고를 수 있어요</small></div>
    <div class="row"><button class="btn danger" type="button" data-t="del" data-id="${esc(l.id)}">삭제</button>
      <div class="row"><button class="btn" type="button" data-act="close">취소</button><button class="btn primary" type="submit">저장</button></div></div>`;
  $("#form").dataset.mode = "tedit"; $("#sheet").hidden = false;
}
async function saveTimeEdit() {
  const l = TEDIT; if (!l || tbusy) return;
  const v = Math.round(num($("#te_val").value) || 0), d = $("#te_date").value || l.date;
  if (!(v > 0)) return toast("1 이상으로 적어 주세요");
  const f = {...l.f}; let name = l.name;
  if (f.count != null) { f.count = v; name = name.replace(/\d+회/, v + "회"); }
  else { f.minutes = v; name = name.replace(/\d+분/, v + "분"); if (f.text) f.text = f.text.replace(/\d+분/, v + "분"); }
  tbusy = true;
  try { await api("saveItem", {id: l.id, category: "log", name, date: d, f}); $("#sheet").hidden = true; await loadAssets(true); toast("고쳤어요"); }
  catch (e) { toast("저장하지 못했습니다: " + e.message, true); }
  finally { tbusy = false; }
}
async function timerAct(kind, id) {
  if (tbusy) return toast("저장하는 중이에요 — 잠시 뒤에 다시 눌러 주세요");
  tbusy = true;
  try {
    if (!DATA && (kind === "end" || kind === "del")) { toast("불러오는 중…"); await loadAssets(true); }
    const run = runningTimers().find(t => t.id === id);
    if (kind === "start" || kind === "once") {
      if (!TSEL.act) return;
      const memo = (($("#tmemo") || {}).value || "").trim();
      if (kind === "once") {
        const x = timerLog(TSEL.goal, TSEL.act, 0, memo);
        toast("기록하는 중…"); await api("saveItem", {category: "log", name: x.name, date: DATA.today, f: x.f});
        TSEL = {goal: "", act: ""}; await loadAssets(true); toast("♻️ 기록했어요"); return;
      }
      if (TSEL.act === "etc" && !memo) { toast("무엇을 하는지 적어 주세요"); $("#tmemo").focus(); return; }
      const a = actOf(TSEL.goal, TSEL.act), f = {goal: TSEL.goal, act: TSEL.act, start: Date.now(), memo};
      TSEL = {goal: "", act: ""};
      // 저장을 기다리지 않고 바로 '진행 중'을 보여 준다
      const tname = f.act === "etc" ? "✏️ " + memo : a[1];
      const tmp = {id: "tmp-" + f.start, name: tname, f};
      store.set("timers", JSON.stringify([...runningTimers().map(t => ({id: t.id, name: t.name, f: t.f})), tmp]));
      DATA.items.push({...tmp, category: "timer", date: DATA.today, updated: ""});
      renderTimer(); toast("시작! 끝나면 아래 ■ 끝을 눌러요");
      const realId = await api("saveItem", {category: "timer", name: tname, date: DATA.today, f});
      const it = DATA.items.find(x => x.id === tmp.id); if (it) it.id = realId;
      await loadAssets(true);
    } else if (kind === "end" && run) {
      if (String(run.id).startsWith("tmp-")) return toast("아직 저장 중이에요. 잠시 뒤에 눌러 주세요");
      let minutes = Math.max(1, Math.round((Date.now() - num(run.f.start)) / 6e4));
      if (minutes > 300) {          // 끝 누르기를 잊은 경우
        const v = prompt(`${Math.floor(minutes / 60)}시간 넘게 켜져 있었어요. 실제로 한 시간은 몇 분인가요?`, "60");
        if (v == null) return;
        minutes = Math.max(1, Math.round(num(v) || 0)); if (!minutes) return;
      }
      const x = timerLog(run.f.goal, run.f.act, minutes, run.f.memo || "");
      const day = new Date(num(run.f.start) + 9 * 3600e3).toISOString().slice(0, 10);   // 시작한 날(한국 시간, 서버의 오늘과 같은 기준)
      toast("기록하는 중…");
      await api("saveItem", {category: "log", name: x.name, date: day >= addDays(DATA.today, -1) ? day : DATA.today, f: x.f});
      await api("deleteItem", run.id).catch(() => {});
      await loadAssets(true); toast(`${goalIcon(run.f.goal)} ${minutes}분 기록했어요 · 성장에 반영됨`);
    } else if (kind === "del") {
      const l = gLogs().find(x => x.id === id); if (!l) return;
      if (!confirm(`'${l.name}' 기록을 지울까요?`)) return;
      await api("deleteItem", id); $("#sheet").hidden = true; await loadAssets(true); toast("지웠어요");
    }
  } catch (e) { toast("저장하지 못했습니다: " + e.message, true); }
  finally { tbusy = false; }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-t]"); if (!b || !(b.closest("#tmain") || b.closest("#runbar") || b.closest("#form"))) return;
  const t = b.dataset.t;
  if (t === "goal") { TSEL = {goal: b.dataset.goal, act: ""}; renderTimer(); }
  else if (t === "back") { TSEL = {goal: "", act: ""}; renderTimer(); }
  else if (t === "act") { TSEL.act = b.dataset.k; TSEL.memo = ($("#tmemo") || {}).value || ""; renderTimer(); }
  else if (t === "edit") openTimeEdit(b.dataset.id);
  else if (t === "habit") habitLog(b.dataset.k);
  else timerAct(t, b.dataset.id);
});
$("#form").addEventListener("submit", e => {
  if ($("#form").dataset.mode !== "tedit") return;
  e.preventDefault(); e.stopImmediatePropagation(); saveTimeEdit();
}, true);
// 다른 앱을 쓰다 돌아오면 시계를 바로 맞춘다
document.addEventListener("visibilitychange", () => { if (!document.hidden) renderRunBar(); });
renderTimer();
</script>
<script>
"use strict";
// ================================================================ 🏕 베이스캠프: 내가 만든 사이트·웹앱을 한곳에(시트 'tool' 분류, 비공개)
const CAMP_CATS = ["블로그", "투자", "교육", "가족", "업무", "기타"];
const CAMP_COLORS = ["#6366f1", "#22d3ee", "#22c55e", "#f59e0b", "#ef4444", "#ec4899", "#a855f7", "#64748b"];
const CAMP_BUILTIN = [["timer", "⏱", "기록", "시작·끝으로 시간 기록"], ["growth", "🏅", "성장", "점수·대결·티어"], ["quest", "📋", "퀘스트", "자동 발행 확인"], ["assets", "💰", "내 자산", "자산·인생 연표"]];
let CAMP_CAT = "전체", CAMP_Q = "", CEDIT = null;
const tools = () => DATA ? byCat("tool") : [];
const isUrl = u => /^https?:\/\/[^\s]+$/i.test((u || "").trim());
function campChecks() { try { return JSON.parse(store.get("campCheck") || "{}"); } catch (e) { return {}; } }
function renderCamp() {
  if (!DATA || $("#camp").hidden) return;
  const all = tools(), cats = [...new Set([...CAMP_CATS, ...all.map(t => t.f.cat).filter(Boolean)])];
  const q = CAMP_Q.trim().toLowerCase(), chk = campChecks().r || {};
  const list = all.filter(t => (CAMP_CAT === "전체" || t.f.cat === CAMP_CAT || (CAMP_CAT === "📌" && t.f.pin)) &&
      (!q || [t.name, t.f.desc, t.f.cat, t.f.url].join(" ").toLowerCase().includes(q)))
    .sort((a, b) => (!!b.f.pin - !!a.f.pin) || ((num(b.f.opens) || 0) - (num(a.f.opens) || 0)) || (a.name < b.name ? -1 : 1));
  const tile = t => { const st = chk[t.f.url];
    return `<a class="tile" href="${esc(t.f.url)}" target="_blank" rel="noopener noreferrer" data-tool="${esc(t.id)}" style="--tc:${esc(t.f.color || "#6366f1")}">
      ${t.f.pin ? '<span class="tpin">📌</span>' : ""}${st ? `<span class="tst ${esc(st.state)}" title="${esc(st.state === "ok" ? "열림" : st.state === "login" ? "로그인 필요(살아 있음)" : "응답 없음")} · ${esc(String(st.code))}"></span>` : ""}
      <button type="button" class="tm" data-c="menu" data-id="${esc(t.id)}" aria-label="${esc(t.name)} 메뉴">⋯</button>
      <span class="ti">${esc(t.f.icon || "🔗")}</span><b>${esc(t.name)}</b><small>${esc(t.f.desc || t.f.url.replace(/^https?:\/\//, ""))}</small>
      <small style="margin-top:auto;font-size:10.5px">${t.f.cat ? esc(t.f.cat) + " · " : ""}${num(t.f.opens) ? `${num(t.f.opens)}번 열었음` : "아직 안 열어 봄"}</small></a>`; };
  const down = Object.values(chk).filter(x => x.state === "down").length;
  $("#cmain").innerHTML = `<div class="card vs" style="margin-bottom:6px"><div class="row"><b style="font-size:18px">🏕 베이스캠프</b><button type="button" class="vbtn" data-c="add">＋ 도구 등록</button></div>
      <div style="font-size:13px;opacity:.9;margin-top:4px">내가 만든 사이트·웹앱 ${all.length}개 · ${DATA.api >= 3 ? (campChecks().d ? `점검 ${esc(campChecks().d.slice(5).replace("-", "."))}${down ? ` · 🔴 ${down}개 응답 없음` : " · 모두 정상"}` : "점검 전") : "주소 점검은 Code.gs 업데이트(2-B) 뒤에"}</div></div>
    <input id="campq" placeholder="🔍 도구 검색" value="${esc(CAMP_Q)}" style="width:100%;margin-top:8px">
    <div class="chips2">${["전체", "📌", ...cats].map(c => `<button type="button" data-c="cat" data-cat="${esc(c)}" aria-pressed="${c === CAMP_CAT}">${esc(c === "📌" ? "📌 고정" : c)}</button>`).join("")}</div>
    ${list.length ? `<div class="camp">${list.map(tile).join("")}</div>` : `<div class="card" style="margin-top:10px;text-align:center"><p class="muted">${all.length ? "조건에 맞는 도구가 없어요." : "아직 등록한 도구가 없어요. 내가 만든 사이트나 웹앱 주소를 등록해 보세요."}</p><button class="btn primary" type="button" data-c="add">＋ 첫 도구 등록</button></div>`}
    <h2>이 앱 안의 도구</h2><div class="camp">${CAMP_BUILTIN.map(([k, ic, nm, ds]) => `<button type="button" class="tile builtin" data-c="tab" data-tab2="${k}" style="text-align:left;cursor:pointer"><span class="ti">${ic}</span><b>${nm}</b><small>${ds}</small></button>`).join("")}</div>
    ${DATA.api >= 3 && all.length ? `<p class="muted" style="font-size:12px;text-align:center;margin-top:12px">🟢 열림 · 🟡 로그인 필요(살아 있음) · 🔴 응답 없음 — 하루 한 번 자동 점검 <a href="#" data-c="check">지금 점검</a></p>` : ""}`;
  autoCheck();
}
// 하루 한 번 주소 점검(이 기기에 결과를 기억)
let checking = false;
async function autoCheck(force) {
  const urls = tools().map(t => t.f.url).filter(isUrl);
  if (checking || !DATA || DATA.api < 3 || !urls.length) return;
  const c = campChecks(); if (!force && c.d === DATA.today) return;
  checking = true;
  try { const res = await api("checkLinks", urls), r = {}; res.forEach(x => { r[x.url] = {state: x.state, code: x.code}; });
    store.set("campCheck", JSON.stringify({d: DATA.today, r})); if (force) toast("점검 끝"); renderCamp(); }
  catch (e) { if (force) toast("점검하지 못했습니다: " + e.message, true); }
  finally { checking = false; }
}
function openTool(id) {       // 연 횟수·마지막으로 연 날 기록(자주 쓰는 순 정렬)
  const t = tools().find(x => x.id === id); if (!t) return;
  t.f = {...t.f, opens: (num(t.f.opens) || 0) + 1, last: DATA.today};
  api("saveItem", {id: t.id, category: "tool", name: t.name, date: t.date || DATA.today, f: t.f}).catch(() => {});
}
function toolForm(t) {
  CEDIT = t ? JSON.parse(JSON.stringify(t)) : {id: "", category: "tool", name: "", date: DATA.today, f: {icon: "🔗", cat: CAMP_CAT !== "전체" && CAMP_CAT !== "📌" ? CAMP_CAT : "", color: CAMP_COLORS[0]}};
  const f = CEDIT.f, cats = [...new Set([...CAMP_CATS, ...tools().map(x => x.f.cat).filter(Boolean)])];
  $("#form").innerHTML = `<h3>${CEDIT.id ? "도구 수정" : "도구 등록"}</h3>
    <div class="f"><label for="t_name">이름</label><input id="t_name" required maxlength="60" value="${esc(CEDIT.name)}" placeholder="예: 투자 대시보드"></div>
    <div class="f"><label for="t_url">주소</label><input id="t_url" required type="url" inputmode="url" value="${esc(f.url || "")}" placeholder="https://"></div>
    <div class="row" style="gap:8px;flex-wrap:nowrap"><div class="f" style="flex:0 0 90px"><label for="t_icon">아이콘</label><input id="t_icon" maxlength="4" value="${esc(f.icon || "🔗")}"></div>
      <div class="f" style="flex:1"><label for="t_cat">분류</label><input id="t_cat" list="t_cats" maxlength="20" value="${esc(f.cat || "")}" placeholder="골라도, 새로 적어도 돼요"><datalist id="t_cats">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist></div></div>
    <div class="f"><label for="t_desc">한 줄 설명(선택)</label><input id="t_desc" maxlength="80" value="${esc(f.desc || "")}"></div>
    <div class="f"><label>카드 색</label><div class="swatch">${CAMP_COLORS.map(c => `<label><input type="radio" name="t_color" value="${c}"${(f.color || CAMP_COLORS[0]) === c ? " checked" : ""}><span style="background:${c}"></span></label>`).join("")}</div></div>
    <div class="f"><label for="t_memo">메모(선택)</label><textarea id="t_memo" maxlength="500" placeholder="사용법, 로그인 계정 힌트 등 — 비밀번호는 적지 마세요">${esc(f.memo || "")}</textarea></div>
    <label style="display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" id="t_pin"${f.pin ? " checked" : ""}> 📌 맨 위에 고정</label>
    <label style="display:flex;gap:8px;align-items:center;margin:6px 0 12px"><input type="checkbox" id="t_embed"${f.embed ? " checked" : ""}> 앱 안에서 열기(허용하는 사이트만 — 안 열리면 새 탭으로)</label>
    <div class="row">${CEDIT.id ? '<button class="btn danger" type="button" data-c="del">삭제</button>' : "<span></span>"}<div class="row"><button class="btn" type="button" data-act="close">취소</button><button class="btn primary" type="submit">저장</button></div></div>`;
  $("#form").dataset.mode = "tool"; $("#sheet").hidden = false;
}
async function saveTool() {
  const name = $("#t_name").value.trim(), url = $("#t_url").value.trim();
  if (!name) return toast("이름을 적어 주세요");
  if (!isUrl(url)) return toast("주소는 http:// 또는 https://로 시작해야 해요");
  const c = document.querySelector("[name=t_color]:checked");
  const f = {...CEDIT.f, url, icon: $("#t_icon").value.trim() || "🔗", cat: $("#t_cat").value.trim(), desc: $("#t_desc").value.trim(),
    memo: $("#t_memo").value.trim(), color: c ? c.value : CAMP_COLORS[0], pin: $("#t_pin").checked ? "1" : "", embed: $("#t_embed").checked ? "1" : ""};
  Object.keys(f).forEach(k => { if (f[k] === "") delete f[k]; });
  busy = true;
  try { await api("saveItem", {id: CEDIT.id, category: "tool", name, date: CEDIT.date || DATA.today, f}); $("#sheet").hidden = true; busy = false; await loadAssets(true); toast(CEDIT.id ? "고쳤어요" : "등록했어요"); }
  catch (e) { toast("저장하지 못했습니다: " + e.message, true); }
  busy = false;
}
function toolMenu(id) {
  const t = tools().find(x => x.id === id); if (!t) return;
  $("#form").innerHTML = `<h3>${esc(t.f.icon || "🔗")} ${esc(t.name)}</h3>
    <p class="muted" style="word-break:break-all;font-size:13px">${esc(t.f.url)}</p>${t.f.memo ? `<div class="note" style="white-space:pre-wrap">${esc(t.f.memo)}</div>` : ""}
    <div class="grid" style="margin-top:10px">
      <button class="stat" type="button" data-c="open" data-id="${esc(id)}"><div class="l">🔗 새 탭으로 열기</div></button>
      ${t.f.embed ? `<button class="stat" type="button" data-c="embed" data-id="${esc(id)}"><div class="l">🪟 앱 안에서 열기</div></button>` : ""}
      <button class="stat" type="button" data-c="copy" data-id="${esc(id)}"><div class="l">📋 주소 복사</div></button>
      <button class="stat" type="button" data-c="qr" data-id="${esc(id)}"><div class="l">🔳 QR 코드</div></button>
      <button class="stat" type="button" data-c="pin" data-id="${esc(id)}"><div class="l">${t.f.pin ? "📌 고정 풀기" : "📌 맨 위 고정"}</div></button>
      <button class="stat" type="button" data-c="edit" data-id="${esc(id)}"><div class="l">✏️ 수정·삭제</div></button></div>
    <div id="qrbox" style="text-align:center;margin-top:10px"></div>
    <div class="row" style="margin-top:10px"><span></span><button class="btn" type="button" data-act="close">닫기</button></div>`;
  $("#form").dataset.mode = "toolmenu"; $("#sheet").hidden = false;
}
function loadQrLib() {
  return new Promise((ok, fail) => { if (window.qrcode) return ok();
    const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"; sc.onload = ok; sc.onerror = () => fail(new Error("QR 도구를 불러오지 못했어요")); document.head.appendChild(sc); });
}
async function showQr(id) {
  const t = tools().find(x => x.id === id); if (!t) return;
  try { await loadQrLib(); const q = qrcode(0, "M"); q.addData(t.f.url); q.make();
    $("#qrbox").innerHTML = `<div style="display:inline-block;background:#fff;padding:10px;border-radius:12px">${q.createSvgTag(5, 0)}</div><div class="muted" style="font-size:12px">다른 기기 카메라로 찍으면 바로 열려요</div>`; }
  catch (e) { toast(e.message, true); }
}
function embedTool(id) {
  const t = tools().find(x => x.id === id); if (!t) return; openTool(id);
  $("#form").innerHTML = `<div class="row"><b>${esc(t.f.icon || "🔗")} ${esc(t.name)}</b><span class="row"><a class="btn" href="${esc(t.f.url)}" target="_blank" rel="noopener noreferrer">새 탭</a><button class="btn" type="button" data-act="close">닫기</button></span></div>
    <iframe src="${esc(t.f.url)}" style="width:100%;height:70vh;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:#fff" title="${esc(t.name)}"></iframe>
    <p class="muted" style="font-size:12px">빈 화면이면 그 사이트가 다른 앱 안에서 열리는 걸 막은 거예요 — '새 탭'을 눌러 주세요.</p>`;
  $("#form").dataset.mode = "toolembed"; $("#sheet").hidden = false;
}
document.addEventListener("click", async e => {
  const tileA = e.target.closest("a.tile[data-tool]");
  if (tileA && !e.target.closest("[data-c]")) { openTool(tileA.dataset.tool); return; }       // 링크는 그대로 새 탭으로 열린다
  const b = e.target.closest("[data-c]"); if (!b || !(b.closest("#cmain") || b.closest("#form"))) return;
  const c = b.dataset.c, id = b.dataset.id; e.preventDefault();
  if (c === "add") toolForm(null);
  else if (c === "cat") { CAMP_CAT = b.dataset.cat; renderCamp(); }
  else if (c === "tab") showTab(b.dataset.tab2);
  else if (c === "check") autoCheck(true);
  else if (c === "menu") toolMenu(id);
  else if (c === "edit") toolForm(tools().find(x => x.id === id));
  else if (c === "open") { const t = tools().find(x => x.id === id); if (t) { openTool(id); window.open(t.f.url, "_blank", "noopener"); } }
  else if (c === "embed") embedTool(id);
  else if (c === "qr") showQr(id);
  else if (c === "copy") { const t = tools().find(x => x.id === id); try { await navigator.clipboard.writeText(t.f.url); toast("주소를 복사했어요"); } catch (err) { prompt("주소를 복사하세요", t.f.url); } }
  else if (c === "pin") { const t = tools().find(x => x.id === id); busy = true;
    try { await api("saveItem", {id, category: "tool", name: t.name, date: t.date, f: {...t.f, pin: t.f.pin ? "" : "1"}}); $("#sheet").hidden = true; busy = false; await loadAssets(true); } catch (err) { toast(err.message, true); } busy = false; }
  else if (c === "del") { if (!confirm(`'${CEDIT.name}' 도구를 지울까요?`)) return; busy = true;
    try { await api("deleteItem", CEDIT.id); $("#sheet").hidden = true; busy = false; await loadAssets(true); toast("지웠어요"); } catch (err) { toast(err.message, true); } busy = false; }
});
document.addEventListener("input", e => { if (e.target.id === "campq") { CAMP_Q = e.target.value; const pos = e.target.selectionStart; renderCamp(); const q = $("#campq"); q.focus(); try { q.setSelectionRange(pos, pos); } catch (err) {} } });
$("#form").addEventListener("submit", e => {
  if ($("#form").dataset.mode !== "tool") return;
  e.preventDefault(); e.stopImmediatePropagation(); saveTool();
}, true);
renderCamp();
</script>
