<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>인생 대시보드</title>
<!-- 인생 대시보드 화면(구글 Apps Script 웹앱). 집 PC가 이 파일을 드라이브의 life_dashboard_app.html로 올리고,
     webapp/Code.gs의 doGet이 그 파일을 보여 준다. 데이터는 google.script.run으로 Code.gs의 함수를 불러 주고받는다. -->
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--sub:#6b6b70;--mute:#9a9aa0;--line:#e4e2dd;--accent:#2a78d6;
--up:#c62f2f;--down:#2361c4;--warn:#a86400;--warn-bg:#fdf0d8;--chip:#efeeea;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e21;--ink:#f1f1f3;--sub:#a1a1a8;--mute:#77777e;
--line:#2e2e33;--accent:#3987e5;--up:#ff7a6e;--down:#7aa8ff;--warn:#f0b04d;--warn-bg:#3a2c12;--chip:#26262a;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:700;color:var(--sub);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
main{max-width:860px;margin:0 auto;padding:16px 16px 96px}
#qframe{width:100%;border:0;display:block;min-height:70vh;background:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.hero .label{color:var(--sub);font-size:13px}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin:2px 0}
.delta{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
.ranges{display:flex;gap:4px;margin:10px 0 2px}
.ranges button{border:1px solid var(--line);background:none;border-radius:6px;padding:2px 10px;font-size:12px;color:var(--sub);cursor:pointer}
.ranges button[aria-pressed=true]{background:var(--chip);color:var(--ink);font-weight:700}
.chart{position:relative;margin-top:6px}
.chart svg{display:block;width:100%;height:150px;touch-action:pan-y}
.tip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:3px 8px;
border-radius:6px;white-space:nowrap;transform:translateX(-50%);display:none}
.empty{color:var(--sub);font-size:13px;padding:24px 0;text-align:center}
.alloc{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:12px 0 8px;background:var(--card)}
.alloc i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px;color:var(--sub)}
.legend b{margin-left:auto;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font-size:15px;margin:22px 0 8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left}
.stat .n{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--sub)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;
grid-template-columns:1fr auto;gap:2px 12px;cursor:pointer;text-align:left;width:100%}
.item .t{font-weight:700;overflow-wrap:anywhere}.item .s{color:var(--sub);font-size:13px;overflow-wrap:anywhere}
.item .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.item .rs{text-align:right;font-size:12px;color:var(--sub);white-space:nowrap}
.item a{color:var(--accent)}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;margin-left:6px;background:var(--chip);color:var(--sub)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.group{font-size:12px;color:var(--sub);font-weight:700;margin:14px 0 6px}
.dday{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.dday:last-child{border-bottom:0}.dday b{font-variant-numeric:tabular-nums;white-space:nowrap}
.year{font-weight:800;font-size:15px;margin:18px 0 6px}
.tl{display:flex;gap:10px;padding:6px 0;border-left:2px solid var(--line);margin-left:6px;padding-left:12px;font-size:14px}
.tl .d{color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.danger{color:var(--up)}
.fab{position:fixed;right:16px;bottom:20px;z-index:6;border:0;border-radius:999px;padding:12px 18px;background:var(--accent);
color:#fff;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet form{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px 24px}
.sheet h3{margin:0 0 12px;font-size:17px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f label{font-size:13px;font-weight:700}
.f small{color:var(--sub);font-size:12px}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);width:100%}
.f textarea{min-height:70px;resize:vertical}
.sheet .row{margin-top:8px}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);
padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);display:none}
.muted{color:var(--sub);font-size:12px}
.mini{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 2px 0;font-size:13px;color:var(--sub)}
.mini b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.grow-row{display:grid;grid-template-columns:28px 1fr auto 64px;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);
border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.grow-row .gi{font-size:18px}.grow-row .gn{font-weight:700}.grow-row .gn small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.grow-row .gt{font-variant-numeric:tabular-nums;font-weight:700;color:var(--sub);white-space:nowrap}.grow-row .gt.up{color:var(--up)}
.grow-row .gp{text-align:right;font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px}
.hex2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.hex{margin:0;padding:10px}.hex figcaption{font-size:13px;font-weight:700}
.hex svg{width:100%;height:auto;display:block}.hexv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px 6px;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.track{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 2px}.track span{background:var(--chip);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--sub)}
.track b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}.track small{font-size:11px;color:var(--mute)}
.bar1{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin:8px 0 6px}.bar1 i{display:block;height:100%;background:var(--s1);border-radius:4px}
.pss{display:flex;gap:6px}.pss label{flex:1;display:flex;gap:4px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;padding:6px 0;font-weight:400}
.tm-goals{display:grid;gap:12px}.tm-goal{display:flex;align-items:center;gap:14px;padding:22px 18px;font-size:20px;font-weight:800;border-radius:14px;
border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:left}.tm-goal small{display:block;font-size:12px;font-weight:400;color:var(--mute);margin-top:3px}
.tm-goal .ic{font-size:32px}.tm-acts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.tm-act{padding:14px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;cursor:pointer}
.tm-act[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;font-weight:700}
.tm-big{width:100%;padding:18px;font-size:20px;border-radius:14px}.tm-clock{font-size:52px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-1px;margin:8px 0}
#runbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:2px solid var(--accent);box-shadow:0 -4px 14px rgba(0,0,0,.12);
padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:grid;gap:6px}
.rb-row{display:grid;grid-template-columns:10px 1fr auto auto;gap:10px;align-items:center;max-width:720px;margin:0 auto;width:100%}
.rb-dot{width:10px;height:10px;border-radius:50%;background:var(--up);animation:rbp 1.4s infinite}@keyframes rbp{50%{opacity:.25}}
.rb-name{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rb-name small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.rb-clock{font-size:20px;font-variant-numeric:tabular-nums}
body.has-run #toast{bottom:auto;top:64px}body.has-run{padding-bottom:calc(76px + env(safe-area-inset-bottom))}body.has-run .fab{bottom:calc(84px + env(safe-area-inset-bottom))}
.tm-rec .rs{display:flex;gap:6px;justify-content:flex-end}.tm-rec .rs .btn{padding:4px 10px;font-size:12px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}.hero .big{font-size:26px}.legend{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="tabs" role="tablist">
  <button role="tab" data-tab="timer" aria-selected="false">⏱ 기록</button>
  <button role="tab" data-tab="growth" aria-selected="false">🏅 성장</button>
  <button role="tab" data-tab="quest" aria-selected="false">퀘스트</button>
  <button role="tab" data-tab="assets" aria-selected="false">내 자산</button>
</div>
<section id="timer" hidden><main id="tmain"><p class="empty">불러오는 중…</p></main></section>
<section id="growth" hidden><main id="gmain"><p class="empty">불러오는 중…</p></main></section>
<section id="quest" hidden><iframe id="qframe" title="퀘스트 보드"></iframe><main id="qmsg" hidden></main></section>
<section id="assets" hidden><main id="amain"><p class="empty">불러오는 중…</p></main>
  <button class="fab" type="button" id="add">＋ 추가</button></section>
<div id="runbar" hidden></div>
<div class="sheet" id="sheet" hidden><form id="form" autocomplete="off"></form></div>
<div id="toast" role="status"></div>
<script>
"use strict";
const NEED_API = 2;
const CATS = {
  finance: {icon: "💰", label: "금융", name: "이름", nameHint: "예: 삼성전자, 비상금 통장", date: "매수일(선택)"},
  pipeline: {icon: "💵", label: "파이프라인", name: "이름", nameHint: "예: 교육 블로그 애드포스트", date: "시작일"},
  realestate: {icon: "🏠", label: "부동산", name: "이름", nameHint: "예: 우리 집", date: "매입일"},
  people: {icon: "👨‍👩‍👧", label: "사람", name: "이름", nameHint: "", date: "생일(양력)"},
  works: {icon: "✍️", label: "저작물", name: "제목", nameHint: "", date: "발표일"},
  positions: {icon: "🎖", label: "직위", name: "직위·역할", nameHint: "예: 6학년 부장", date: "시작일"},
  awards: {icon: "🏆", label: "수상·자격", name: "이름", nameHint: "예: 교육감 표창", date: "받은 날"}
};
const KINDS = [["kr", "국내 주식·ETF"], ["us", "미국 주식·ETF"], ["coin", "코인"], ["cash", "예적금·현금"], ["pension", "연금"], ["etc", "기타"]];
const KIND_LABEL = Object.fromEntries(KINDS);
const PRICED = ["kr", "us", "coin"];
const priced = f => PRICED.includes(f.kind);
const PIPE_KINDS = [["ads", "광고 수익(애드센스·애드포스트)"], ["affiliate", "제휴 마케팅(쿠팡파트너스 등)"], ["royalty", "인세·저작권료"],
  ["teach", "강의·강연"], ["freelance", "외주·프리랜스"], ["product", "콘텐츠 판매(전자책·템플릿)"], ["dividend", "배당·이자"],
  ["rent", "임대"], ["etc", "기타"]];
const PIPE_STATUS = [["on", "운영 중"], ["prep", "준비 중"], ["pause", "쉬는 중"], ["off", "접음"]];
const PIPE_KIND = Object.fromEntries(PIPE_KINDS), PIPE_STAT = Object.fromEntries(PIPE_STATUS);
// 파이프라인 수익 기록(분류 pipeincome, f.pipe = 파이프라인 id, f.amount = 원)
const pipeIncomes = id => (DATA ? DATA.items : []).filter(i => i.category === "pipeincome" && i.f && i.f.pipe === id)
  .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
const pipeTotal = id => pipeIncomes(id).reduce((a, i) => a + (num(i.f.amount) || 0), 0);
const monthly = it => (it.f.status || "on") === "on" ? (num(it.f.monthly) || 0) : 0;
const FIELDS = {
  finance: [
    {k: "kind", label: "종류", type: "select", options: KINDS},
    {k: "ticker", label: "종목코드", hint: "국내 6자리(005930) · 미국 티커(AAPL) · 코인(BTC)", show: priced},
    {k: "qty", label: "수량", type: "num", show: priced},
    {k: "avg", label: "평단가", hint: "국내·코인은 원, 미국은 달러", type: "num", show: priced},
    {k: "amount", label: "금액(원)", type: "num", show: f => !priced(f)},
    {k: "cost", label: "넣은 원금(선택, 수익률 계산용)", type: "num", show: f => !priced(f)},
    {k: "amount", label: "평가금액 직접 입력(선택)", hint: "시세를 못 받는 종목만. 비우면 시세로 계산", type: "num", show: priced, alt: true},
    {k: "account", label: "계좌·기관(선택)"},
    {k: "link", label: "링크(선택)", hint: "관련 페이지·계좌·문서 주소", type: "url"},
    {k: "memo", label: "메모", type: "area"}],
  pipeline: [
    {k: "kind", label: "종류", type: "select", options: PIPE_KINDS},
    {k: "status", label: "상태", type: "select", options: PIPE_STATUS},
    {k: "monthly", label: "월 수입(원)", hint: "최근 몇 달 평균. 바뀌면 고쳐 주세요", type: "num"},
    {k: "link", label: "링크(선택)", hint: "관련 페이지·계좌·문서 주소", type: "url"},
    {k: "memo", label: "메모", type: "area"}],
  realestate: [
    {k: "buy", label: "매입가(원)", type: "num"},
    {k: "price", label: "현재 시세(원)", hint: "가끔 직접 고쳐 주세요(실거래가·호가 참고)", type: "num"},
    {k: "loan", label: "대출 잔액(원, 선택)", type: "num"},
    {k: "place", label: "위치(선택)"},
    {k: "link", label: "링크(선택)", hint: "관련 페이지·계좌·문서 주소", type: "url"},
    {k: "memo", label: "메모", type: "area"}],
  people: [
    {k: "relation", label: "관계", hint: "예: 배우자, 첫째, 어머니"},
    {k: "anniv_label", label: "기념일 이름(선택)", hint: "예: 결혼기념일"},
    {k: "anniv_date", label: "기념일 날짜(선택)", type: "date"},
    {k: "link", label: "링크(선택)", hint: "관련 페이지·계좌·문서 주소", type: "url"},
    {k: "memo", label: "메모", type: "area"}],
  works: [
    {k: "kind", label: "종류", type: "select", options: [["book", "책"], ["paper", "논문"], ["research", "연구"], ["workbook", "워크북·교재"], ["writing", "글·칼럼"], ["talk", "강연·발표"], ["etc", "기타"]]},
    {k: "link", label: "링크(선택)", type: "url"},
    {k: "income", label: "수익(원, 선택)", type: "num"},
    {k: "memo", label: "메모", type: "area"}],
  positions: [
    {k: "org", label: "기관·소속"},
    {k: "job", label: "직업군(성장 점수용)", hint: "그 일의 분야. 교사는 '전문가'예요(교감·교장이 되어도 그대로 두고 아래 직위 수준만 바꿔요)", type: "select",
      options: [["", "고르지 않음"], ["manager", "관리자(임원·관리직 자체가 직업)"], ["pro", "전문가 및 관련(교사·의료·연구·IT·법률·금융 등)"],
        ["office", "사무"], ["machine", "장치·기계 조작·조립"], ["craft", "기능원·기능직"], ["sales", "판매"], ["service", "서비스"],
        ["farm", "농림어업 숙련"], ["labor", "단순 노무"]]},
    {k: "level", label: "직위 수준(성장 점수용)", hint: "같은 직업 안에서의 위치", type: "select", options: [["staff", "일반(담임·팀원)"], ["lead", "보직(부장·팀장)"],
      ["mid", "중간관리(교감·차장)"], ["head", "기관장(교장·부서장)"], ["top", "그 이상"]]},
    {k: "employ", label: "고용 형태(성장 점수용)", type: "select", options: [["", "고르지 않음"], ["public", "공무원·교원·공공기관(정년 보장)"],
      ["regular", "민간 정규직"], ["self", "자영업·고용주·프리랜서"], ["temp", "계약직·비정규직"]]},

      ["local", "지역(교육지원청·시군구)"], ["region", "광역(교육감·시도지사)"], ["nation", "국가(장관급)"], ["top", "대통령급 이상"]]},

      ["mid", "산업기사·중급"], ["high", "기사·상급"], ["pro", "기술사·전문자격"]]},

const ORDER = ["finance", "pipeline", "realestate", "people", "works", "positions", "awards"];
const VIEWS = [["summary", "요약"], ...ORDER.map(c => [c, CATS[c].icon + " " + CATS[c].label]), ["timeline", "📜 연표"]];
const SERIES = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6"];

let DATA = null, VIEW = "summary", RANGE = "3M", busy = false;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const store = {get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
               set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 저장 못 해도 동작 */ } }};

function api(fn, ...args) {
  return new Promise((ok, fail) => {
    if (!window.google || !google.script) return fail(new Error("구글 웹앱 안에서 열어 주세요"));
    google.script.run.withSuccessHandler(ok).withFailureHandler(e => fail(e instanceof Error ? e : new Error(String(e && e.message || e))))[fn](...args);
  });
}
function toast(msg, long) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", long ? 6000 : 2500);
}

// ---------------------------------------------------------------- 숫자·날짜
function won(n, sign) {
  if (n == null || !isFinite(n)) return "-";
  const s = n < 0 ? "−" : (sign && n > 0 ? "+" : "");
  n = Math.abs(Math.round(n));
  const eok = Math.floor(n / 1e8), man = Math.floor((n % 1e8) / 1e4);
  if (eok) return s + eok.toLocaleString("ko-KR") + "억" + (man ? " " + man.toLocaleString("ko-KR") + "만" : "") + "원";
  const rest = n % 1e4;                          // 천만 원 아래는 끝자리까지(월 수입 등)
  if (man) return s + man.toLocaleString("ko-KR") + "만" + (rest && n < 1e7 ? " " + rest.toLocaleString("ko-KR") + "원" : "원");
  return s + n.toLocaleString("ko-KR") + "원";
}
const pct = n => n == null || !isFinite(n) ? "" : (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(1) + "%";
const tone = n => n > 0 ? "up" : n < 0 ? "down" : "";
const num = v => { const n = Number(String(v == null ? "" : v).replace(/[,\s원$₩]/g, "")); return v === "" || v == null || !isFinite(n) ? null : n; };
function parseDay(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; }
function today() { return parseDay(DATA && DATA.today) || new Date(new Date().toDateString()); }
const fmtDay = s => { const d = parseDay(s); return d ? `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}` : ""; };
function age(s) {
  const b = parseDay(s), t = today(); if (!b) return null;
  let a = t.getFullYear() - b.getFullYear();
  if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--;
  return a;
}
function nextDday(s) {
  const d = parseDay(s), t = today(); if (!d) return null;
  let n = new Date(t.getFullYear(), d.getMonth(), d.getDate());
  if (n < t) n = new Date(t.getFullYear() + 1, d.getMonth(), d.getDate());
  return {days: Math.round((n - t) / 864e5), years: n.getFullYear() - d.getFullYear()};
}
function span(from, to) {
  const a = parseDay(from), b = to ? parseDay(to) : today(); if (!a || !b) return "";
  let m = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
  if (b.getDate() < a.getDate()) m--;
  if (m < 1) return "1개월 미만";
  return (m >= 12 ? Math.floor(m / 12) + "년 " : "") + (m % 12 ? m % 12 + "개월" : "").trim();
}
function ago(iso) {
  const t = Date.parse(iso); if (!t) return "";
  const m = Math.round((Date.now() - t) / 6e4);
  return m < 1 ? "방금" : m < 60 ? m + "분 전" : m < 1440 ? Math.round(m / 60) + "시간 전" : Math.round(m / 1440) + "일 전";
}

// ---------------------------------------------------------------- 탭
function showTab(name) {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === name));
  $("#quest").hidden = name !== "quest"; $("#assets").hidden = name !== "assets"; $("#growth").hidden = name !== "growth"; $("#timer").hidden = name !== "timer";
  store.set("tab", name);
  if (name === "quest") loadQuest(); else if (!DATA) loadAssets(); else if (name === "growth") renderGrowth(); else if (name === "timer") renderTimer();
}
let questAt = 0;
async function loadQuest() {
  if (Date.now() - questAt < 60000) return;
  questAt = Date.now();
  try {
    const html = await api("getQuestBoard");
    const f = $("#qframe");
    if (!html) { f.hidden = true; $("#qmsg").hidden = false; $("#qmsg").innerHTML = '<p class="empty">아직 집 PC가 퀘스트 보드를 올리지 않았습니다.</p>'; return; }
    f.hidden = false; $("#qmsg").hidden = true;
    f.onload = () => fit(f);
    f.srcdoc = html.replace("<head>", '<head><base target="_blank">');
  } catch (e) { toast("퀘스트 보드를 불러오지 못했습니다: " + e.message, true); }
}
function fit(f) {
  const go = () => { try { f.style.height = f.contentDocument.documentElement.scrollHeight + "px"; } catch (e) { /* 다른 출처 */ } };
  go(); setTimeout(go, 300); setTimeout(go, 1500);
}

// ---------------------------------------------------------------- 자산 데이터
async function loadAssets(quiet) {
  try {
    const ver = await api("apiVersion");
    DATA = await api("getData");
    DATA.oldApi = ver < NEED_API;
    render();
    if (typeof renderGrowth === "function") renderGrowth();
    if (typeof renderTimer === "function") renderTimer();
    if (!quiet && stalePrices()) refresh(true);
  } catch (e) {
    $("#amain").innerHTML = `<div class="note">자산 데이터를 불러오지 못했습니다: ${esc(e.message)}<br>
      웹앱 코드(Code.gs)를 새 버전으로 붙여 넣고 '새 버전'으로 다시 배포했는지 확인해 주세요.</div>`;
  }
}
function stalePrices() {
  const hasPriced = DATA.items.some(it => it.category === "finance" && priced(it.f || {}) && (it.f.ticker || "").trim());
  return hasPriced && (!DATA.pricesAt || Date.now() - Date.parse(DATA.pricesAt) > 30 * 6e4);
}
async function refresh(auto) {
  if (busy) return; busy = true;
  if (!auto) toast("시세를 받는 중…");
  try {
    const r = await api("refreshPrices");
    await loadAssets(true);
    if (!auto || r.missing.length) toast(r.missing.length ? `시세를 못 받은 종목: ${r.missing.join(", ")} (지난 값·평단가로 계산)` : "시세를 새로 받았습니다", r.missing.length);
  } catch (e) { toast("시세를 받지 못했습니다: " + e.message, true); }
  busy = false;
}
const byCat = c => DATA.items.filter(it => it.category === c);

// ---------------------------------------------------------------- 그리기
function render() {
  const old = DATA.oldApi ? '<div class="note">웹앱 코드(Code.gs)가 예전 버전입니다(새 분류 저장이 안 될 수 있어요). 저장소의 webapp/Code.gs를 붙여 넣고 배포 관리에서 새 버전으로 배포해 주세요.</div>' : "";
  const chips = `<nav class="chips" aria-label="분류">${VIEWS.map(([k, l]) =>
    `<button type="button" data-view="${k}" aria-pressed="${k === VIEW}">${esc(l)}</button>`).join("")}</nav>`;
  const body = VIEW === "summary" ? summary() : VIEW === "timeline" ? timeline() : category(VIEW);
  const top = VIEW === "summary" ? hero() : `<div class="mini"><span>순자산</span><b>${won(DATA.totals.net)}</b></div>`;   // 그래프는 요약에서만
  $("#amain").innerHTML = old + top + chips + body;
  drawChart();
}

function hero() {
  const t = DATA.totals, h = DATA.history;
  const prev = h.length > 1 ? h[h.length - 2] : null;
  const back = pick30(h);
  const d1 = prev ? t.net - prev.net : null, d30 = back ? t.net - back.net : null;
  const deltas = [d1 != null ? `어제보다 <span class="${tone(d1)}">${won(d1, true)}</span>` : "",
                  d30 != null ? `30일 전보다 <span class="${tone(d30)}">${won(d30, true)}</span>` : ""].filter(Boolean).join(" · ");
  return `<div class="card hero"><div class="row"><span class="label">순자산 (금융 + 부동산 − 대출)</span>
    <button class="btn" type="button" data-act="refresh">시세 새로고침</button></div>
    <div class="big">${won(t.net)}</div><div class="delta">${deltas || "매일 " + DATA.snapshotHour + "시에 기록이 쌓이면 변화가 보입니다"}</div>
    <div class="ranges" role="group" aria-label="기간">${["1M", "3M", "1Y", "ALL"].map(r =>
      `<button type="button" data-range="${r}" aria-pressed="${r === RANGE}">${{"1M": "1개월", "3M": "3개월", "1Y": "1년", "ALL": "전체"}[r]}</button>`).join("")}</div>
    <div class="chart" id="chart"></div>
    <div class="muted">${DATA.pricesAt ? "시세 " + ago(DATA.pricesAt) + " 기준 · " : ""}매일 ${DATA.snapshotHour}시 자동 기록</div></div>`;
}
function pick30(h) {
  if (h.length < 2) return null;
  const want = new Date(today() - 30 * 864e5);
  let best = null;
  h.forEach(p => { const d = parseDay(p.date); if (d && d <= want) best = p; });
  return best;
}

function drawChart() {
  const box = $("#chart"); if (!box) return;
  const days = {"1M": 31, "3M": 92, "1Y": 366, "ALL": 1e6}[RANGE];
  const from = new Date(today() - days * 864e5);
  const pts = DATA.history.filter(p => { const d = parseDay(p.date); return d && d >= from && isFinite(p.net); });
  if (pts.length < 2) { box.innerHTML = '<p class="empty">기록이 이틀 이상 쌓이면 추이 그래프가 나옵니다</p>'; return; }
  const W = 600, H = 150, P = 6;
  const xs = pts.map(p => parseDay(p.date).getTime()), ys = pts.map(p => p.net);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); if (y0 === y1) { y0 -= 1; y1 += 1; }
  const X = x => P + (x - x0) / (x1 - x0 || 1) * (W - 2 * P), Y = y => H - P - (y - y0) / (y1 - y0) * (H - 2 * P - 14);
  const path = pts.map((p, i) => (i ? "L" : "M") + X(xs[i]).toFixed(1) + " " + Y(p.net).toFixed(1)).join(" ");
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="순자산 추이">
    <line x1="${P}" x2="${W - P}" y1="${H - P}" y2="${H - P}" stroke="var(--line)" stroke-width="1"/>
    <path d="${path}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <line id="cx" y1="0" y2="${H}" stroke="var(--mute)" stroke-width="1" vector-effect="non-scaling-stroke" visibility="hidden"/>
    <circle id="cd" r="4" fill="var(--s1)" stroke="var(--card)" stroke-width="2" visibility="hidden"/></svg>
    <div class="tip" id="tip"></div><div class="muted row"><span>${fmtDay(pts[0].date)}</span><span>${fmtDay(pts[pts.length - 1].date)}</span></div>`;
  const svg = box.querySelector("svg"), tip = $("#tip");
  const move = e => {
    const r = svg.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width * W;
    let i = 0; xs.forEach((x, k) => { if (Math.abs(X(x) - fx) < Math.abs(X(xs[i]) - fx)) i = k; });
    const cx = X(xs[i]), cy = Y(pts[i].net);
    ["cx", "cd"].forEach(id => svg.getElementById(id).setAttribute("visibility", "visible"));
    svg.getElementById("cx").setAttribute("x1", cx); svg.getElementById("cx").setAttribute("x2", cx);
    svg.getElementById("cd").setAttribute("cx", cx); svg.getElementById("cd").setAttribute("cy", cy);
    tip.style.display = "block"; tip.style.left = Math.min(Math.max(cx / W * r.width, 60), r.width - 60) + "px";
    tip.textContent = `${fmtDay(pts[i].date)} ${won(pts[i].net)}`;
  };
  svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", () => { tip.style.display = "none"; ["cx", "cd"].forEach(id => svg.getElementById(id).setAttribute("visibility", "hidden")); });
}

function summary() {
  const t = DATA.totals;
  const kinds = KINDS.map(([k, l], i) => ({k, l, v: t.byKind[k] || 0, c: SERIES[i]})).filter(x => x.v > 0);
  const tot = kinds.reduce((a, x) => a + x.v, 0);
  const alloc = tot ? `<h2>금융 자산 구성</h2><div class="card"><div class="alloc" role="img" aria-label="금융 자산 구성">${kinds.map(x =>
      `<i style="width:${(x.v / tot * 100).toFixed(2)}%;background:var(${x.c})" title="${esc(x.l)}"></i>`).join("")}</div>
      <div class="legend">${kinds.map(x => `<span><i style="background:var(${x.c})"></i>${esc(x.l)}<b>${won(x.v)} · ${(x.v / tot * 100).toFixed(0)}%</b></span>`).join("")}</div>
      ${t.realestate ? `<div class="legend" style="margin-top:8px"><span>🏠 부동산<b>${won(t.realestate)}</b></span><span>대출<b>${won(-t.loan)}</b></span></div>` : ""}</div>` : "";
  const stats = ORDER.map(c => {
    const list = byCat(c);
    let n = list.length + "", l = CATS[c].label;
    if (c === "finance") { n = won(t.finance); l = `금융 ${list.length}개`; }
    if (c === "pipeline") { n = won(list.reduce((a, x) => a + monthly(x), 0)) + "/월"; l = `파이프라인 ${list.filter(x => (x.f.status || "on") === "on").length}개 운영`; }
    if (c === "realestate" && list.length) { n = won(t.realestate - t.loan); l = `부동산 ${list.length}곳(순)`; }
    if (c === "people") l = "사람";
    if (c === "positions") { const cur = list.filter(x => !(x.f || {}).end).length; l = `직위 · 지금 ${cur}개`; }
    return `<button type="button" class="stat" data-view="${c}"><div class="l">${CATS[c].icon} ${esc(l)}</div><div class="n">${esc(n)}</div></button>`;
  }).join("");
  const dd = upcoming(60);
  const days = dd.length ? `<h2>다가오는 날</h2><div class="card">${dd.map(x =>
      `<div class="dday"><span>${esc(x.text)}</span><b>${x.days ? "D-" + x.days : "오늘"}</b></div>`).join("")}</div>` : "";
  const now = byCat("positions").filter(x => !(x.f || {}).end).sort((a, b) => a.date < b.date ? 1 : -1);
  const pos = now.length ? `<h2>지금 맡고 있는 일</h2><div class="list">${now.map(itemCard).join("")}</div>` : "";
  const empty = DATA.items.some(it => ORDER.includes(it.category)) ? "" : `<div class="card" style="margin-top:12px"><p class="empty" style="padding:8px 0">아직 기록이 없습니다.<br>
      오른쪽 아래 <b>＋ 추가</b>로 첫 기록을 남겨 보세요. 돈으로 셀 수 있는 것뿐 아니라 사람·저작물·직위·수상도 함께 쌓입니다.</p></div>`;
  return `${empty}<h2>한눈에</h2><div class="grid">${stats}</div>${days}${alloc}${pos}
    <p class="muted" style="margin-top:20px">데이터는 이 구글 계정의 비공개 시트에만 저장됩니다 · <a href="${esc(DATA.sheetUrl)}" target="_blank" rel="noopener">시트 열기</a></p>`;
}
function upcoming(within) {
  const out = [];
  byCat("people").forEach(p => {
    const b = nextDday(p.date);
    if (b && b.days <= within) out.push({days: b.days, text: `🎂 ${p.name}${p.f.relation ? "(" + p.f.relation + ")" : ""} 생일 · ${b.years}번째`});
    const a = nextDday(p.f.anniv_date);
    if (a && a.days <= within) out.push({days: a.days, text: `💐 ${p.name} ${p.f.anniv_label || "기념일"} · ${a.years}주년`});
  });
  return out.sort((x, y) => x.days - y.days);
}

function itemCard(it) {
  const f = it.f || {}, v = it.v || {};
  let sub = [], right = "", rsub = "", badge = "";
  if (it.category === "finance") {
    if (VIEW !== "finance") sub.push(KIND_LABEL[f.kind] || "기타");      // 금융 목록은 종류별 묶음 제목이 있다
    if (priced(f)) {
      if (f.qty) sub.push(`${Number(f.qty).toLocaleString("ko-KR")}${f.kind === "coin" ? "개" : "주"}`);
      if (isFinite(v.price)) sub.push("현재가 " + (f.kind === "us" ? "$" + Number(v.price).toLocaleString("en-US") : Number(v.price).toLocaleString("ko-KR") + "원"));
      if (v.stale) badge = '<span class="badge warn">시세 없음 · 평단가로 계산</span>';
      if (v.manual) badge = '<span class="badge">직접 입력 금액</span>';
    }
    if (f.account) sub.push(f.account);
    right = won(v.value);
    if (isFinite(v.gainPct)) rsub = `<span class="${tone(v.gainPct)}">${pct(v.gainPct)}${isFinite(v.gain) ? " · " + won(v.gain, true) : ""}</span>`;
  } else if (it.category === "realestate") {
    if (f.place) sub.push(f.place);
    if (it.date) sub.push(fmtDay(it.date) + " 매입 · " + span(it.date));
    if (v.loan) sub.push("대출 " + won(v.loan));
    right = won(v.value);
    if (isFinite(v.gainPct)) rsub = `<span class="${tone(v.gain)}">매입가 대비 ${pct(v.gainPct)}</span>`;
  } else if (it.category === "people") {
    if (f.relation) sub.push(f.relation);
    const a = age(it.date); if (a != null) sub.push(`만 ${a}세`);
    const b = nextDday(it.date); if (b) right = b.days ? "생일 D-" + b.days : "오늘 생일";
    if (f.anniv_date) { const n = nextDday(f.anniv_date); rsub = `${esc(f.anniv_label || "기념일")} ${n ? (n.days ? "D-" + n.days : "오늘") : ""}`; }
  } else if (it.category === "works") {
    const kinds = Object.fromEntries(FIELDS.works[0].options); sub.push(kinds[f.kind] || "저작물");
    if (it.date) sub.push(fmtDay(it.date));
    if (num(f.income)) right = won(num(f.income));
  } else if (it.category === "positions") {
    if (f.org) sub.push(f.org);
    if (it.date) sub.push(`${fmtDay(it.date)} ~ ${f.end ? fmtDay(f.end) : "지금"}`);
    if (typeof jobShare === "function" && jobShare(it).full) sub.push("직업 " + fmtTop(jobShare(it).p));
    right = span(it.date, f.end || null);
    if (!f.end) badge = '<span class="badge">지금</span>';
  } else if (it.category === "pipeline") {
    sub.push(PIPE_KIND[f.kind] || "기타");
    if (it.date) sub.push(fmtDay(it.date) + " 시작 · " + span(it.date));
    const st = f.status || "on";
    if (st !== "on") badge = `<span class="badge${st === "prep" ? " warn" : ""}">${esc(PIPE_STAT[st])}</span>`;
    if (num(f.monthly)) { right = won(num(f.monthly)) + "/월"; rsub = st === "on" ? "연 " + won(num(f.monthly) * 12) : ""; }
    const tot = pipeTotal(it.id), n = pipeIncomes(it.id).length;
    if (n) { sub.push(`누적 수익 ${won(tot)}(${n}건)`); if (!right) right = "누적 " + won(tot); }
  } else if (it.category === "awards") {
    const kinds = Object.fromEntries(FIELDS.awards[0].options); sub.push(kinds[f.kind] || "수상");
    if (f.org) sub.push(f.org);
    if (it.date) right = fmtDay(it.date);
  }
  const link = f.link ? ` · <a href="${esc(f.link)}" target="_blank" rel="noopener" data-stop>링크</a>` : "";
  return `<button type="button" class="item" data-edit="${esc(it.id)}"><span class="t">${esc(it.name)}${badge}</span>
    <span class="r">${esc(right)}</span><span class="s">${sub.map(esc).join(" · ")}${link}</span><span class="rs">${rsub}</span></button>`;
}

function category(c) {
  let list = byCat(c).slice();
  const head = `<div class="row"><h2>${CATS[c].icon} ${esc(CATS[c].label)} <span class="muted">${list.length}</span></h2>
    ${c === "finance" ? '<button class="btn" type="button" data-act="refresh">시세 새로고침</button>' : ""}</div>`;
  if (!list.length) return head + `<p class="empty">아직 없습니다. ＋ 추가로 기록해 보세요.</p>`;
  if (c === "finance") {
    list.sort((a, b) => (b.v.value || 0) - (a.v.value || 0));
    return head + KINDS.map(([k, l]) => {
      const g = list.filter(x => (x.f.kind || "etc") === k); if (!g.length) return "";
      const sum = g.reduce((a, x) => a + (x.v.value || 0), 0);
      return `<div class="group row"><span>${esc(l)}</span><span>${won(sum)}</span></div><div class="list">${g.map(itemCard).join("")}</div>`;
    }).join("");
  }
  if (c === "pipeline") {
    const total = list.reduce((a, x) => a + monthly(x), 0);
    const top = `<div class="card" style="margin-bottom:6px"><div class="row"><span class="muted">운영 중인 파이프라인 월 합계</span>
      <b style="font-size:18px">${won(total)}</b></div><div class="muted">연으로 치면 ${won(total * 12)} · 순자산에는 더하지 않습니다</div></div>`;
    return head + top + PIPE_STATUS.map(([k, l]) => {
      const g = list.filter(x => (x.f.status || "on") === k).sort((a, b) => (num(b.f.monthly) || 0) - (num(a.f.monthly) || 0));
      return g.length ? `<div class="group">${esc(l)} · ${g.length}개</div><div class="list">${g.map(itemCard).join("")}</div>` : "";
    }).join("");
  }
  if (c === "people") list.sort((a, b) => (nextDday(a.date) || {days: 999}).days - (nextDday(b.date) || {days: 999}).days);
  else if (c === "positions") list.sort((a, b) => (!!a.f.end - !!b.f.end) || ((a.date || "") < (b.date || "") ? 1 : -1));   // 지금 맡은 일 먼저
  else list.sort((a, b) => (a.date || "") < (b.date || "") ? 1 : -1);
  if (c === "awards" || c === "works") {
    const years = {};
    list.forEach(x => { const y = (x.date || "").slice(0, 4) || "날짜 없음"; (years[y] = years[y] || []).push(x); });
    return head + Object.keys(years).sort().reverse().map(y =>
      `<div class="group">${esc(y)} · ${years[y].length}개</div><div class="list">${years[y].map(itemCard).join("")}</div>`).join("");
  }
  return head + `<div class="list">${list.map(itemCard).join("")}</div>`;
}

// 연표 날짜: 2024-3-1처럼 적힌 것도 2024-03-01로 맞춰 정렬한다(날짜가 아니면 뺀다)
function normDay(v) {
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(v || "").trim());
  return m ? `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}` : "";
}
let TL_NEW = store.get("tlOrder") === "new";      // 기본: 오래된 것부터(연도·날짜 순)
function timeline() {
  const ev = [];
  const add = (d, t, id) => { d = normDay(d); if (d) ev.push({d, t, id}); };
  DATA.items.filter(it => ORDER.includes(it.category)).forEach(it => {      // 성장 기록(log 등)은 연표에서 뺀다
    const f = it.f || {}, c = CATS[it.category] || {icon: "•"};
    if (it.category === "people") {
      if (f.anniv_date) add(f.anniv_date, `💐 ${it.name} · ${f.anniv_label || "기념일"}`, it.id);
      return;
    }
    const what = {finance: "매수", pipeline: "시작", realestate: "매입", works: "발표", positions: "시작", awards: ""}[it.category] || "";
    add(it.date, `${c.icon} ${it.name}${what ? " " + what : ""}${f.org ? " · " + f.org : ""}`, it.id);
    if (it.category === "positions" && f.end) add(f.end, `${c.icon} ${it.name} 마침`, it.id);
  });
  if (!ev.length) return '<h2>📜 인생 연표</h2><p class="empty">날짜가 있는 기록이 쌓이면 연도별로 모아 보여 줍니다.</p>';
  // 날짜(연·월·일) 순, 같은 날은 이름 순. 최신순이면 뒤집는다
  ev.sort((a, b) => a.d.localeCompare(b.d) || a.t.localeCompare(b.t, "ko"));
  if (TL_NEW) ev.reverse();
  const years = [];
  ev.forEach(e => { const y = e.d.slice(0, 4); if (!years.length || years[years.length - 1].y !== y) years.push({y, list: []}); years[years.length - 1].list.push(e); });
  const toggle = `<button class="btn" type="button" data-act="tl-order">${TL_NEW ? "오래된 순으로" : "최신 순으로"}</button>`;
  return `<div class="row"><h2>📜 인생 연표 <span class="muted">${TL_NEW ? "최신 순" : "오래된 순"}</span></h2>${toggle}</div>` +
    years.map(g => `<div class="year">${g.y} <span class="muted">${g.list.length}개</span></div>` +
      g.list.map(e => `<div class="tl" data-edit="${esc(e.id)}"><span class="d">${+e.d.slice(5, 7)}.${+e.d.slice(8)}</span><span>${esc(e.t)}</span></div>`).join("")).join("");
}

let EDIT = null;

function incomeBox() {
  if (!EDIT.id) return '<p class="muted">💰 수익 기록은 이 파이프라인을 저장한 뒤 다시 열면 넣을 수 있어요.</p>';

  return `<div class="card" style="margin:4px 0 14px"><div class="row"><b>💰 수익 기록</b><span class="muted">누적 ${won(tot)} · ${list.length}건</span></div>
    ${list.slice().reverse().map(e => `<div class="dday"><span>${esc(fmtDay(e.date))}${e.f.memo ? " · " + esc(e.f.memo) : ""}</span>
      <b>${won(num(e.f.amount))} <button class="btn" type="button" data-act="delincome" data-id="${esc(e.id)}" aria-label="이 수익 기록 지우기">✕</button></b></div>`).join("")}
    <div class="row" style="margin-top:8px;flex-wrap:nowrap"><input id="inc_date" type="date" value="${esc(DATA.today)}" max="${esc(DATA.today)}" style="flex:1;min-width:0" aria-label="입금일">
      <input id="inc_amt" inputmode="decimal" placeholder="금액(원)" style="flex:1;min-width:0" aria-label="수익 금액">
      <button class="btn" type="button" data-act="addincome">＋ 추가</button></div>
    <small class="muted">들어온 날과 금액을 적어 두면, 이 파이프라인의 누적 수익이 1만·10만·100만·1,000만·1억 원을 넘는 날 🏅 성장에 돌파 점수가 생겨요.</small></div>`;
}
async function incomeAct(kind, id) {
  readForm(); const keep = EDIT;                     // 고치던 내용은 그대로 두고 수익 기록만 저장
  try {
    if (kind === "add") {
      const amt = num($("#inc_amt").value), d = $("#inc_date").value || DATA.today;
      if (!(amt > 0)) return toast("금액을 적어 주세요");
      if (d > DATA.today) return toast("앞으로의 날짜는 적을 수 없어요");
      busy = true; await api("saveItem", {category: "pipeincome", name: `${keep.name || "파이프라인"} 수익`, date: d, f: {pipe: keep.id, amount: amt}});
    } else {
      if (!confirm("이 수익 기록을 지울까요?")) return;
      busy = true; await api("deleteItem", id);
    }
    busy = false; await loadAssets(true); EDIT = keep; drawForm(); toast(kind === "add" ? "수익을 기록했어요" : "지웠어요");
  } catch (e) { toast("저장하지 못했습니다: " + e.message, true); }
  busy = false;
}
function drawForm() {
  $("#form").dataset.mode = "item";          // 성장 기록 화면과 같은 틀을 쓰므로 어느 쪽인지 표시
  const c = EDIT.category, meta = CATS[c], f = EDIT.f || {};
  const seen = new Set();
  const fields = FIELDS[c].filter(d => !d.show || d.show(f)).filter(d => !seen.has(d.k) && seen.add(d.k)).map(d => {
    const v = f[d.k] == null ? "" : f[d.k], id = "f_" + d.k;
    let input;
    if (d.type === "select") input = `<select id="${id}" name="${id}">${d.options.map(([k, l]) => `<option value="${k}"${k === (v || d.options[0][0]) ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
    else if (d.type === "area") input = `<textarea id="${id}" name="${id}">${esc(v)}</textarea>`;
    else input = `<input id="${id}" name="${id}" value="${esc(d.type === "num" && v !== "" ? Number(v).toLocaleString("ko-KR", {maximumFractionDigits: 8}) : v)}"
      ${d.type === "num" ? 'inputmode="decimal"' : d.type === "date" ? 'type="date"' : d.type === "url" ? 'type="url" inputmode="url"' : ""}>`;
    return `<div class="f"><label for="${id}">${esc(d.label)}</label>${input}${d.hint ? `<small>${esc(d.hint)}</small>` : ""}</div>`;
  }).join("");
  $("#form").innerHTML = `<h3>${EDIT.id ? "수정" : "추가"}</h3>
    <div class="f"><label for="category">분류</label><select id="category" name="category"${EDIT.id ? " disabled" : ""}>${ORDER.map(k =>
      `<option value="${k}"${k === c ? " selected" : ""}>${CATS[k].icon} ${esc(CATS[k].label)}</option>`).join("")}</select></div>
    <div class="f"><label for="name">${esc(meta.name)}</label><input id="name" name="name" required maxlength="200" value="${esc(EDIT.name)}" placeholder="${esc(meta.nameHint)}"></div>
    <div class="f"><label for="date">${esc(meta.date)}</label><input id="date" name="date" type="date" value="${esc(EDIT.date)}">
      ${["positions", "awards", "works", "realestate", "people"].includes(c) ? '<small>🏅 성장 점수는 이 날짜로 계산돼요. 시작일 이전이거나 비워 두면 과거 업적으로 표시되고, 점수는 똑같이 100% 들어가요</small>' : ""}</div>
    ${fields}
    ${c === "positions" ? `<p class="muted" id="jobprev">${jobPreview(EDIT)}</p>` : ""}
    ${c === "pipeline" ? incomeBox() : ""}
    <div class="row"><div>${EDIT.id ? '<button class="btn danger" type="button" data-act="delete">삭제</button>' : ""}</div>
      <div class="row"><button class="btn" type="button" data-act="close">취소</button><button class="btn primary" type="submit">저장</button></div></div>`;
}
async function save(e) {
  e.preventDefault(); if (busy) return;
  readForm();
  if (!EDIT.name) return toast("이름을 적어 주세요");
  busy = true; toast("저장 중…");
  try {
    await api("saveItem", EDIT);
    $("#sheet").hidden = true;
    const needPrice = EDIT.category === "finance" && priced(EDIT.f) && EDIT.f.ticker;
    busy = false;
    if (needPrice) await refresh(true); else await loadAssets(true);
    toast("저장했습니다");
  } catch (err) { toast("저장하지 못했습니다: " + err.message, true); }
  busy = false;
}
async function remove() {
  if (!confirm(`'${EDIT.name}'을(를) 지울까요? 되돌릴 수 없습니다.`)) return;
  busy = true;
  try { await api("deleteItem", EDIT.id); $("#sheet").hidden = true; busy = false; await loadAssets(true); toast("지웠습니다"); }
  catch (err) { toast("지우지 못했습니다: " + err.message, true); }
  busy = false;
}

document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-stop]")) return;
  const tab = t.closest(".tabs button"); if (tab) return showTab(tab.dataset.tab);
  const v = t.closest("[data-view]"); if (v) { VIEW = v.dataset.view; store.set("view", VIEW); render(); window.scrollTo(0, 0); return; }
  const r = t.closest("[data-range]"); if (r) { RANGE = r.dataset.range; render(); return; }
  const ed = t.closest("[data-edit]"); if (ed) { const it = DATA.items.find(x => x.id === ed.dataset.edit); if (it) openEditor(it); return; }
  const a = t.closest("[data-act]"); if (!a) return;
  if (a.dataset.act === "refresh") refresh(false);
  if (a.dataset.act === "tl-order") { TL_NEW = !TL_NEW; store.set("tlOrder", TL_NEW ? "new" : "old"); render(); }
  if (a.dataset.act === "close") $("#sheet").hidden = true;
  if (a.dataset.act === "delete") remove();
  if (a.dataset.act === "addincome") incomeAct("add");
  if (a.dataset.act === "delincome") incomeAct("del", a.dataset.id);
});
$("#add").addEventListener("click", () => DATA ? openEditor(null) : toast("불러오는 중입니다"));
$("#form").addEventListener("submit", save);
$("#form").addEventListener("change", e => {

  if ($("#form").dataset.mode !== "item") return;
  if (e.target.name === "category" || e.target.name === "f_kind") { readForm(); if (e.target.name === "category") EDIT.f = EDIT.category === "finance" ? {kind: "kr"} : {}; drawForm(); }
});
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") $("#sheet").hidden = true; });
VIEW = VIEWS.some(([k]) => k === store.get("view")) ? store.get("view") : "summary";
showTab(["assets", "growth", "timer"].includes(store.get("tab")) ? store.get("tab") : "quest");
// 주소 끝에 ?tab=timer 를 붙여 홈 화면에 두면 바로 ⏱ 기록 화면으로 열린다
try { google.script.url.getLocation(loc => { const t = loc && loc.parameter && loc.parameter.tab; if (["timer", "growth", "assets", "quest"].includes(t)) showTab(t); }); } catch (e) {}
</script>
<script>
"use strict";
// ================================================================ 🏅 성장: 6대 목표 점수
// 모든 기록을 '30대 후반 남성 중 상위 몇 %인가'로 바꾸고, 같은 공식(R)으로 점수를 매긴다(영역 사이 형평성).
//   흐름 점수: 매주 그 주의 기록이 상위 몇 %인지 → R(p), 한 영역 한 주 최대 CAP(상위 1%)
//   돌파 점수: 처음 그 구간을 넘었을 때 한 번 → R(p) × MILE
//   시작일 이전 업적도 그대로 100%(과거의 성취도 나다) — '과거 업적' 표시만 붙음
// 기준 숫자는 BENCH에 출처·근거 수준과 함께 모아 둔다(화면의 '점수 기준'에 그대로 보인다).
const GOALS = [
  {k: "body", icon: "💪", label: "신체", short: "신체"}, {k: "mind", icon: "🧘", label: "정신", short: "정신"},
  {k: "craft", icon: "🎨", label: "기능·영감", short: "기능"}, {k: "social", icon: "🤝", label: "사회", short: "사회"},
  {k: "career", icon: "🎖", label: "커리어", short: "커리어"}, {k: "economy", icon: "💰", label: "경제", short: "경제"}];

const CAP = 56, MILE = 4, MONTH_W = 52 / 12, ETC_UNIT = 40, ETC_DAY_CAP = 2;
const R = p => p >= 0.5 ? 0 : 10 * Math.log2(0.5 / Math.max(p, 0.001));      // 상위 50% = 0, 10% = 23, 1% = 56, 0.1% = 90
const pFromPts = pts => 0.5 / Math.pow(2, pts / 10);
const LV = n => 25 * n * n;                                                     // 레벨 n에 필요한 누적 점수
const levelOf = pts => { let n = 0; while (LV(n + 1) <= pts) n++; return n; };

const BENCH = {

    mean: 76, pd: .70, cv: .8,
    src: "생활시간조사 2024(국가데이터처) 통계표 2-1: 30~39세 남자 가정관리 49분 + 가족 및 가구원 돌보기 27분 = 하루 76분(요일 평균). 참고: 25~39세 기혼·유자녀 남성은 134분. 하루 참여율 70%·분포(로그정규, 변동계수 0.8)는 추정",

// 돌파(한 번) 점수 목록: [{date, goal, pts, label, past}]

  // (등록·수정 시각을 쓰면 옛 업적을 고치기만 해도 새 성취가 되므로 쓰지 않는다)

  // 직업(취직·전직·승진): 날짜순으로 보며 '지금까지 가장 높은 직업'을 넘은 만큼만 돌파 점수(같은 급 이직을 되풀이해도 늘지 않음)

  items.filter(i => i.category === "positions").sort((a, b) => when(a) < when(b) ? -1 : 1).forEach(i => {

    if (pts > bestJob + .05) {

      bestJob = pts;

    i.f.kind === "cert" ? (MILES.cert.p[i.f.cert_level] || .3) : (MILES.award.p[i.f.level] || .3), `🏆 ${i.name}`));

    pss.slice(1).forEach(l => {
      const p = topShareNormal(num(l.f.score), BENCH.mind, true);
      MILES.pss.bands.forEach(b => { if (p <= b && base > b && !have.has("pss:" + b)) { have.add("pss:" + b); todo.push({key: "pss:" + b, goal: "mind", p: b, label: `🧘 스트레스 점검 상위 ${b * 100}% 진입`, date: l.date}); } });
    });
  }
  for (const t of todo) {
    await api("saveItem", {category: "milestone", name: `${t.label} (${fmtTop(t.p)})`, date: t.date || DATA.today,
      f: {goal: t.goal, key: t.key, pts: Math.round(R(t.p) * MILE * 10) / 10, past: activating ? "1" : ""}});
  }
  return todo.length;
}

// 전체 점수 계산
function scoreAll() {
  const st = gSetting(), start = st ? st.date : DATA.today;
  const logs = gLogs(), weeks = [], byGoal = Object.fromEntries(GOALS.map(g => [g.k, 0])), events = [];
  const acc = Object.fromEntries(GOALS.map(g => [g.k, 0])), checkMonth = new Set();
  for (let ws = weekStart(start); ws <= weekStart(DATA.today); ws = addDays(ws, 7)) {
    const w = weekStats(ws, logs, start); weeks.push({ws, w});
    // 작은 기록 적립(평균 아래라 0점이던 것): 모아서 정해 둔 양마다 1점 — 그 주 점수에 더해 '최근 얻은 점수'에도 보인다
    const we = addDays(ws, 6), small = {};
    ["body", "craft", "social"].forEach(k => { if (!w[k].rp && w[k].vol > 0) acc[k] += w[k].vol; });     // 상위 % 점수가 0인 주만
    ["mind", "career"].forEach(k => { acc[k] += w[k].rep || 0; });
    if (w.economy.low) acc.economy += 1;
    logs.filter(l => l.date >= ws && l.date <= we && l.date >= start && ["pss", "fitness"].includes(l.f.type)).forEach(l => {
      const key = l.f.type + l.date.slice(0, 7); if (!checkMonth.has(key)) { checkMonth.add(key); small[l.f.goal] = (small[l.f.goal] || 0) + 1; } });
    GOALS.forEach(g => { const u = SMALL[g.k].unit, n = Math.floor(acc[g.k] / u);
      if (n > 0) { acc[g.k] -= n * u; small[g.k] = (small[g.k] || 0) + n; }
      if (small[g.k] > SMALL_CAP) small[g.k] = SMALL_CAP; });                 // 한 주 최대 3점(넘친 양은 버림, 1점이 안 된 나머지만 이월)
    GOALS.forEach(g => { if (small[g.k]) { w[g.k].pts += small[g.k]; w[g.k].what += ` · 작은 기록 적립 +${small[g.k]}`; } });
    GOALS.forEach(g => { if (w[g.k].pts) { byGoal[g.k] += w[g.k].pts; events.push({date: addDays(ws, 6) > DATA.today ? DATA.today : addDays(ws, 6), goal: g.k, pts: w[g.k].pts,
      label: `${ws.slice(5).replace("-", ".")} 주 · ${w[g.k].what}${w[g.k].p < .5 ? ` (${fmtTop(w[g.k].p)})` : ""}`, week: true}); } });
  }
  const flowTotal = Object.values(byGoal).reduce((a, b) => a + b, 0);       // 흐름 점수(매주 쌓은 것)
  milestones(start).forEach(m => {
    byGoal[m.goal] += m.pts; events.push(m.past ? {...m, label: m.label + " · 과거 업적"} : m);
  });
  const total = Object.values(byGoal).reduce((a, b) => a + b, 0);
  return {start, weeks, byGoal, events: events.sort((a, b) => a.date < b.date ? 1 : -1), total, flowTotal, mileTotal: total - flowTotal};
}
// 기간(이번 주 / 이번 달)의 상위 %(실제 기록 기준)와 그 기간에 얻은 점수
function periodTop(S, mode) {
  const logs = gLogs(), ws = weekStart(DATA.today), m = DATA.today.slice(0, 7);
  // 누적(all): 시작일부터 오늘까지의 평균 페이스를 같은 통계와 비교(운동은 주당 횟수, 시간은 하루 평균, 저축률·스트레스는 평균)
  const from = mode === "week" ? ws : mode === "month" ? m + "-01" : S.start, to = DATA.today;
  const shares = rangeShare(from < S.start ? S.start : from, to, logs);
  shares.mind = mindShare(logs, mode === "all" ? S.start : "");
  shares.career = positionShare();
  if (mode === "all") Object.assign(shares, cumulativeShares(shares));
  const out = {};
  GOALS.forEach(g => {
    const pts = mode === "all" ? S.byGoal[g.k]
      : S.weeks.filter(x => mode === "week" ? x.ws === ws : (x.ws.slice(0, 7) === m)).reduce((a, x) => a + x.w[g.k].pts, 0);
    out[g.k] = {...shares[g.k], pts};
  });
  return out;
}

// 누적 상위 %: 시작일부터의 평균 페이스에, 지금까지 이룬 '상태' 지표(체력 등급·숙련·결혼·자녀·봉사·직업·수상·저작물·순자산·내 집·파이프라인)를
// 더해 영역마다 평균한다(영역 공통 규칙: 지표는 평균, 적어 둔 지표만). 이번 주·이번 달은 그 기간의 기록만 본다.
const PACE_LABEL = {body: "운동 페이스", mind: "스트레스 점검 평균", craft: "가사·돌봄 시간", social: "교류·나눔 시간", career: "지금 하는 일", economy: "저축률 평균"};
// 구간 표 [[값, 상위 비율], ...]에서 x의 상위 비율(구간 사이는 로그 보간, 첫 구간 아래는 평균 쪽으로 직선)
function bandShare(x, bands) {
  if (!(x > 0)) return 1;
  const [v0, p0] = bands[0];
  if (x < v0) return 1 - (1 - p0) * x / v0;
  for (let k = 1; k < bands.length; k++) {
    const [va, pa] = bands[k - 1], [vb, pb] = bands[k];
    if (x < vb) { const t = Math.log(x / va) / Math.log(vb / va); return Math.exp(Math.log(pa) * (1 - t) + Math.log(pb) * t); }
  }
  return bands[bands.length - 1][1];
}
function cumulativeShares(pace) {
  const items = DATA.items, logs = gLogs(), out = {};
  GOALS.forEach(g => {
    const parts = [];
    const put = (p, label) => { if (p < 1) parts.push({p, label}); };
    if (pace[g.k] && pace[g.k].any) put(pace[g.k].p, PACE_LABEL[g.k]);
    const best = (list, fn) => list.length ? Math.min(...list.map(fn)) : 1;
    if (g.k === "body") {
      const fit = logs.filter(l => l.f.type === "fitness").sort((a, b) => a.date < b.date ? 1 : -1)[0];
      if (fit) put(MILES.fitness.p[num(fit.f.grade) || 3] || .7, `체력 ${num(fit.f.grade) || 3}등급`);
      put(best(logs.filter(l => l.f.type === "race"), l => MILES.race.p[l.f.dist] || .1), "대회 완주(최고)");
    }
    if (g.k === "craft") put(best(logs.filter(l => l.f.type === "level"), l => MILES.craftLevel.p[l.f.stage] || .4), "숙련 단계(최고)");
    if (g.k === "social") {
      const people = items.filter(i => i.category === "people");
      if (people.some(i => /배우자|아내|남편|부인/.test(i.f.relation || ""))) put(MILES.marriage.p, "결혼");
      const kids = people.filter(i => /자녀|아들|딸|첫째|둘째|셋째|넷째|막내/.test(i.f.relation || "")).length;
      if (kids) put(MILES.child.p[Math.min(kids, 3)], `자녀 ${kids}명`);
      const vol = logs.filter(l => l.f.type === "volunteer").reduce((a, l) => a + (num(l.f.minutes) || 0), 0) / 60;
      if (vol > 0) put(bandShare(vol, MILES.volunteer.bands), `누적 봉사 ${Math.round(vol)}시간`);
    }
    if (g.k === "career") {
      put(best(items.filter(i => i.category === "awards"), i => i.f.kind === "cert" ? (MILES.cert.p[i.f.cert_level] || .3) : (MILES.award.p[i.f.level] || .3)), "수상·자격(최고)");
      put(best(items.filter(i => i.category === "works"), i => MILES.work.p[i.f.kind] || .2), "저작물(최고)");
    }
    if (g.k === "economy") {
      const net = DATA.totals && DATA.totals.net;
      if (isFinite(net) && net > 0) put(bandShare(net, MILES.networth.bands), "순자산");
      if (items.some(i => i.category === "realestate")) put(MILES.home.p, "내 집");
      const pipe = byCat("pipeline").reduce((a, x) => a + monthly(x), 0);
      if (pipe > 0) put(bandShare(pipe, MILES.pipeline.bands), "파이프라인 월수입");
    }
    out[g.k] = parts.length ? {p: parts.reduce((a, x) => a + x.p, 0) / parts.length, any: true, parts} : {p: 1, any: false, parts};
  });
  return out;
}

}

// 육각형 그래프: 또렷한 바깥 테두리 + 꼭짓점까지 축선 + 여섯 점을 잇는 닫힌 도형.
// 0인 영역도 가운데로 빨려 들지 않게 가장 안쪽(FLOOR)에 둔다. opts.sqrt면 넓이가 값에 비례하는 눈금(√)
function hexagon(title, vals, color, fmt, fixedMax, opts) {
  opts = opts || {};
  const W = 220, C = 110, Rr = 78, FLOOR = .1, max = fixedMax || Math.max(50, ...vals) * 1.05;
  const frac = v => { const f = Math.min(1, Math.max(0, v) / max); return FLOOR + (1 - FLOOR) * (opts.sqrt ? Math.sqrt(f) : f); };
  const pt = (i, r) => { const a = -Math.PI / 2 + i * Math.PI / 3; return [C + r * Math.cos(a), C + r * Math.sin(a)]; };
  const ring = f => GOALS.map((_, i) => pt(i, Rr * f).map(n => n.toFixed(1)).join(",")).join(" ");
  const poly = vals.map((v, i) => pt(i, Rr * frac(v)).map(n => n.toFixed(1)).join(",")).join(" ");

};
const TIMER_HINT = {body: "운동은 30분 이상이면 1회로 셉니다", mind: "끝내면 그 영역의 '작은 승리'로 기록돼요(같은 주 같은 영역은 반씩 줄어요)",
  craft: "가사·돌봄 시간은 하루 평균 분으로 30대 남성과 비교해요"};
let TSEL = {goal: "", act: ""}, tickId = 0, tbusy = false;
// 진행 중인 타이머: 시트의 'timer' 항목. 새로고침·재실행 직후(데이터를 받기 전)에도 바로 보이게 이 기기에 사본을 둔다
function runningTimers() {
  if (DATA) {
    const list = byCat("timer").filter(t => num(t.f.start) > 0).sort((a, b) => num(a.f.start) - num(b.f.start));
    store.set("timers", JSON.stringify(list.map(t => ({id: t.id, name: t.name, f: t.f}))));
    return list;
  }
  try { return JSON.parse(store.get("timers") || "[]"); } catch (e) { return []; }
}
const actOf = (goal, act) => (TIMER_ACTS[goal] || []).find(a => a[0] === act);
const hhmm = ms => { const d = new Date(ms); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const clock = ms => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return `${h ? h + ":" : ""}${String(m).padStart(h ? 2 : 1, "0")}:${String(s % 60).padStart(2, "0")}`; };
const goalIcon = g => (GOAL[g] || {}).icon || "⏱";

// 화면 아래 '진행 중' 막대: 어느 탭에 있든, 새로고침해도 보이고 여기서 바로 끝낼 수 있다
function renderRunBar() {
  const list = runningTimers(), bar = $("#runbar");
  bar.hidden = !list.length; document.body.classList.toggle("has-run", !!list.length);
  bar.innerHTML = list.map(t => { const a = actOf(t.f.goal, t.f.act);
    return `<div class="rb-row"><span class="rb-dot"></span><span class="rb-name">${goalIcon(t.f.goal)} ${esc(t.f.act === "etc" ? (t.f.memo || "기타") : a ? a[1].replace(/^\S+\s/, "") : t.name)}<small>진행 중 · ${hhmm(num(t.f.start))} 시작</small></span>
      <b class="rb-clock" data-start="${num(t.f.start)}">${clock(Date.now() - num(t.f.start))}</b>
      <button type="button" class="btn primary" data-t="end" data-id="${esc(t.id)}">■ 끝</button></div>`; }).join("");
  clearInterval(tickId);
  if (list.length) tickId = setInterval(() => document.querySelectorAll("#runbar .rb-clock").forEach(c => { c.textContent = clock(Date.now() - num(c.dataset.start)); }), 1000);
}

function renderTimer() {
  renderRunBar();
  if (!DATA || $("#timer").hidden) return;
  const run = runningTimers();
  let html = "";
  if (!gSetting()) html += `<div class="note">🏅 성장 탭에서 '오늘부터 시작하기'를 한 번 눌러야 기록이 점수에 들어가요.</div>`;
  if (TSEL.goal) {
    const g = GOAL[TSEL.goal], acts = TIMER_ACTS[TSEL.goal], rec = TSEL.act === "recycle";
    html += `<div class="row"><h2 style="margin:0">${g.icon} ${g.label} · 무엇을 하나요?</h2><button class="btn" type="button" data-t="back">← 뒤로</button></div>
      <div class="tm-acts">${acts.map(([k, l]) => `<button type="button" class="tm-act" data-t="act" data-k="${k}" aria-pressed="${k === TSEL.act}">${esc(l)}</button>`).join("")}</div>
      ${TSEL.act === "etc" ? `<div class="f"><label for="tmemo">무엇을 하나요? (꼭 적기)</label><input id="tmemo" maxlength="100" placeholder="예: 기타 연습, 그림, 목공" value="${esc(TSEL.memo || "")}"><small>40분마다 1점, 하루 최대 2점</small></div>`
        : `<div class="f"><label for="tmemo">메모(선택)</label><input id="tmemo" maxlength="100" placeholder="예: 아이와 블록 놀이" value="${esc(TSEL.memo || "")}"></div>`}
      <button class="btn primary tm-big" type="button" data-t="${rec ? "once" : "start"}" ${TSEL.act ? "" : "disabled"}>${rec ? "♻️ 1회 기록" : "▶ 시작"}</button>
      <p class="muted" style="font-size:12px">${rec ? "분리수거는 시간 대신 횟수로 기록해요(1회 = 15분으로 계산)." : esc(TIMER_HINT[TSEL.goal])}</p>`;
  } else {
    html += `<h2 style="margin-top:4px">무엇을 시작할까요?</h2><div class="tm-goals">${TIMER_GOALS.map(k => `<button type="button" class="tm-goal" data-t="goal" data-goal="${k}">
      <span class="ic">${GOAL[k].icon}</span><span>${GOAL[k].label}<small>${esc(TIMER_ACTS[k].slice(0, 4).map(a => a[1].replace(/^\S+\s/, "")).join(" · "))} …</small></span></button>`).join("")}</div>
      ${run.length ? `<p class="muted" style="font-size:12px">진행 중인 일은 화면 아래에 있어요. 다른 일을 함께 시작할 수도 있어요. 화면을 끄거나 앱을 닫아도 시간은 계속 흘러요.</p>` : ""}`;
  }
  // 최근 기록 10개: 시간 변경·삭제
  const recent = gLogs().filter(l => TIMER_GOALS.includes(l.f.goal)).sort((a, b) => (b.date + b.updated) < (a.date + a.updated) ? -1 : 1).slice(0, 10);
  const mins = gLogs().filter(l => TIMER_GOALS.includes(l.f.goal) && l.date === DATA.today).reduce((a, l) => a + (num(l.f.minutes) || 0), 0);
  html += `<h2>최근 기록 <span class="muted" style="font-size:13px;font-weight:400">오늘 ${mins}분</span></h2>`;
  html += recent.length ? `<div class="list">${recent.map(l => { const m = num(l.f.minutes), c = num(l.f.count);
    return `<div class="item tm-rec" style="cursor:default"><span class="t">${goalIcon(l.f.goal)} ${esc(l.name)}</span>
      <span class="r">${esc(l.date === DATA.today ? "오늘" : l.date === addDays(DATA.today, -1) ? "어제" : fmtDay(l.date))}</span>
      <span class="s">${esc(l.f.text || "")}</span>
      <span class="rs"><button class="btn" type="button" data-t="edit" data-id="${esc(l.id)}">${m != null || c != null ? "시간 변경" : "고치기"}</button>
        <button class="btn danger" type="button" data-t="del" data-id="${esc(l.id)}">삭제</button></span></div>`; }).join("")}</div>`
    : `<p class="muted">아직 기록이 없어요. 위에서 하나를 골라 시작해 보세요.</p>`;
  $("#tmain").innerHTML = html;
}
// 끝낸 시간을 성장 기록(log) 한 건으로 바꾼다 — 날짜는 시작한 날
function timerLog(goal, act, minutes, memo) {
  const a = actOf(goal, act), spec = a[2], label = a[1], text = [label.replace(/^\S+\s/, ""), memo].filter(Boolean).join(" · ") + " (⏱)";
  if (spec.type === "exercise") return {name: `운동 ${minutes}분 · ${label.replace(/^\S+\s/, "")}`, f: {goal, type: "exercise", kind: spec.kind, minutes, text}};
  if (spec.type === "win") return {name: `${Object.fromEntries(MIND_SUBS)[spec.sub]} · ${SIZE_LABEL.s}`, f: {goal, type: "win", sub: spec.sub, size: "s", minutes, text: `${text} ${minutes}분`}};
  if (spec.type === "etc") return {name: `✏️ ${memo || "기타"} ${minutes}분`, f: {goal, type: "etc", minutes, text: `${memo || "기타"} (⏱)`}};
  if (spec.field === "recycle") return {name: `${label} 1회`, f: {goal, type: "time", field: "recycle", count: 1, text}};
  return {name: `${label} ${minutes}분`, f: {goal, type: "time", field: spec.field, minutes, text}};
}
// 기록 고치기(시간·횟수·날짜)
let TEDIT = null;
function openTimeEdit(id) {
  const l = gLogs().find(x => x.id === id); if (!l) return;
  TEDIT = l; const rec = l.f.field === "recycle";
  $("#form").innerHTML = `<h3>${goalIcon(l.f.goal)} ${esc(l.name)}</h3>
    <div class="f"><label for="te_val">${rec ? "횟수" : "시간(분)"}</label><input id="te_val" name="val" inputmode="numeric" required value="${esc(String(rec ? (num(l.f.count) || 1) : (num(l.f.minutes) || 0)))}"></div>
    <div class="f"><label for="te_date">날짜</label><input id="te_date" name="date" type="date" value="${esc(l.date)}" max="${esc(DATA.today)}" min="${esc(l.date < addDays(DATA.today, -1) ? l.date : addDays(DATA.today, -1))}">
      <small>오늘·어제(또는 원래 날짜)만 고를 수 있어요</small></div>
    <div class="row"><button class="btn danger" type="button" data-t="del" data-id="${esc(l.id)}">삭제</button>
      <div class="row"><button class="btn" type="button" data-act="close">취소</button><button class="btn primary" type="submit">저장</button></div></div>`;
  $("#form").dataset.mode = "tedit"; $("#sheet").hidden = false;
}
async function saveTimeEdit() {
  const l = TEDIT; if (!l || tbusy) return;
  const v = Math.round(num($("#te_val").value) || 0), d = $("#te_date").value || l.date;
  if (!(v > 0)) return toast("1 이상으로 적어 주세요");
  const f = {...l.f}; let name = l.name;
  if (f.field === "recycle") { f.count = v; name = name.replace(/\d+회/, v + "회"); }
  else { f.minutes = v; name = name.replace(/\d+분/, v + "분"); if (f.text) f.text = f.text.replace(/\d+분/, v + "분"); }
  tbusy = true;
  try { await api("saveItem", {id: l.id, category: "log", name, date: d, f}); $("#sheet").hidden = true; await loadAssets(true); toast("고쳤어요"); }
  catch (e) { toast("저장하지 못했습니다: " + e.message, true); }
  finally { tbusy = false; }
}
async function timerAct(kind, id) {
  if (tbusy) return;
  tbusy = true;
  try {
    if (!DATA && (kind === "end" || kind === "del")) { toast("불러오는 중…"); await loadAssets(true); }
    const run = runningTimers().find(t => t.id === id);
    if (kind === "start" || kind === "once") {
      if (!TSEL.act) return;
      const memo = (($("#tmemo") || {}).value || "").trim();
      if (kind === "once") {
        const x = timerLog(TSEL.goal, TSEL.act, 0, memo);
        toast("기록하는 중…"); await api("saveItem", {category: "log", name: x.name, date: DATA.today, f: x.f});
        TSEL = {goal: "", act: ""}; await loadAssets(true); toast("♻️ 기록했어요"); return;
      }
      if (TSEL.act === "etc" && !memo) { toast("무엇을 하는지 적어 주세요"); $("#tmemo").focus(); return; }
      const a = actOf(TSEL.goal, TSEL.act), f = {goal: TSEL.goal, act: TSEL.act, start: Date.now(), memo};
      TSEL = {goal: "", act: ""};
      // 저장을 기다리지 않고 바로 '진행 중'을 보여 준다
      const tname = f.act === "etc" ? "✏️ " + memo : a[1];
      const tmp = {id: "tmp-" + f.start, name: tname, f};
      store.set("timers", JSON.stringify([...runningTimers().map(t => ({id: t.id, name: t.name, f: t.f})), tmp]));
      DATA.items.push({...tmp, category: "timer", date: DATA.today, updated: ""});
      renderTimer(); toast("시작! 끝나면 아래 ■ 끝을 눌러요");
      const realId = await api("saveItem", {category: "timer", name: tname, date: DATA.today, f});
      const it = DATA.items.find(x => x.id === tmp.id); if (it) it.id = realId;
      await loadAssets(true);
    } else if (kind === "end" && run) {
      if (String(run.id).startsWith("tmp-")) return toast("아직 저장 중이에요. 잠시 뒤에 눌러 주세요");
      let minutes = Math.max(1, Math.round((Date.now() - num(run.f.start)) / 6e4));
      if (minutes > 300) {          // 끝 누르기를 잊은 경우
        const v = prompt(`${Math.floor(minutes / 60)}시간 넘게 켜져 있었어요. 실제로 한 시간은 몇 분인가요?`, "60");
        if (v == null) return;
        minutes = Math.max(1, Math.round(num(v) || 0)); if (!minutes) return;
      }
      const x = timerLog(run.f.goal, run.f.act, minutes, run.f.memo || "");
      const day = new Date(num(run.f.start) + 9 * 3600e3).toISOString().slice(0, 10);   // 시작한 날(한국 시간, 서버의 오늘과 같은 기준)
      toast("기록하는 중…");
      await api("saveItem", {category: "log", name: x.name, date: day >= addDays(DATA.today, -1) ? day : DATA.today, f: x.f});
      await api("deleteItem", run.id).catch(() => {});
      await loadAssets(true); toast(`${goalIcon(run.f.goal)} ${minutes}분 기록했어요 · 성장에 반영됨`);
    } else if (kind === "del") {
      const l = gLogs().find(x => x.id === id); if (!l) return;
      if (!confirm(`'${l.name}' 기록을 지울까요?`)) return;
      await api("deleteItem", id); $("#sheet").hidden = true; await loadAssets(true); toast("지웠어요");
    }
  } catch (e) { toast("저장하지 못했습니다: " + e.message, true); }
  finally { tbusy = false; }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-t]"); if (!b || !(b.closest("#tmain") || b.closest("#runbar") || b.closest("#form"))) return;
  const t = b.dataset.t;
  if (t === "goal") { TSEL = {goal: b.dataset.goal, act: ""}; renderTimer(); }
  else if (t === "back") { TSEL = {goal: "", act: ""}; renderTimer(); }
  else if (t === "act") { TSEL.act = b.dataset.k; TSEL.memo = ($("#tmemo") || {}).value || ""; renderTimer(); }
  else if (t === "edit") openTimeEdit(b.dataset.id);
  else timerAct(t, b.dataset.id);
});
$("#form").addEventListener("submit", e => {
  if ($("#form").dataset.mode !== "tedit") return;
  e.preventDefault(); e.stopImmediatePropagation(); saveTimeEdit();
}, true);
// 다른 앱을 쓰다 돌아오면 시계를 바로 맞춘다
document.addEventListener("visibilitychange", () => { if (!document.hidden) renderRunBar(); });
renderTimer();
</script>
</body>
</html>
