<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행발 기록 도우미</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f3f4f7;--card:#fff;--line:#e5e7ec;--line2:#eef0f3;--ink:#18212f;--sub:#5d6778;--faint:#8a93a3;
  --acc:#4f46e5;--acc-ink:#3730a3;--acc-soft:#eef0ff;--ok:#12a150;--ok-soft:#e6f6ec;--warn:#c27803;--warn-soft:#fff4dc;--bad:#d92d20;--bad-soft:#fdecea;
  --r:12px;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06)
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.6 "Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;color:var(--ink);font-weight:500;transition:background .12s,border-color .12s,color .12s}
button:hover{background:#f7f8fa;border-color:#cfd4dc}
button:focus-visible,input:focus-visible,select:focus-visible,.it:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri:hover{background:var(--acc-ink)}
button.ghost{border-color:transparent;background:transparent;color:var(--sub)}
button.ghost:hover{background:#eef0f3;color:var(--ink)}
button.sm{padding:3px 9px;font-size:12.5px;border-radius:7px;white-space:nowrap}
button.icon{width:28px;height:28px;padding:0;display:inline-grid;place-items:center;font-size:13px;color:var(--sub)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;color:var(--ink)}
input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px;vertical-align:-2px;margin:0 4px 0 0}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.muted{color:var(--sub);font-size:13px}
.sp{flex:1}
/* 머리 */
header{background:#fff;border-bottom:1px solid var(--line)}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 18px}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#4338ca);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;box-shadow:0 2px 6px rgba(79,70,229,.35)}
.brand h1{font-size:17px;margin:0;letter-spacing:-.2px}
.brand small{display:block;font-size:12px;color:var(--faint);font-weight:400;margin-top:-2px}
.yearbox{display:flex;align-items:center;gap:4px;background:#f3f4f7;border-radius:10px;padding:3px 3px 3px 10px}
.yearbox select{border:0;background:#fff;font-weight:700;padding:4px 8px;box-shadow:var(--shadow)}
.grp{display:flex;gap:6px;align-items:center}
.div{width:1px;height:22px;background:var(--line);margin:0 4px}
#sync{font-size:12.5px;padding:4px 10px;border-radius:999px;background:#f3f4f7}
#sync.fail{color:var(--bad);background:var(--bad-soft);font-weight:600;cursor:pointer}
#sync a{color:var(--ok);text-decoration:none;font-weight:600}
.tabs{display:flex;gap:2px;padding:0 14px;overflow-x:auto}
.tabs button{border:0;border-radius:0;background:none;padding:9px 14px 10px;color:var(--sub);font-weight:600;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink);background:none}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
#banner{display:none;padding:9px 18px;background:var(--warn-soft);border-bottom:1px solid #f3dfae;color:#7a4b00;font-size:14px}
#banner button{margin-left:6px}
/* 3단 */
main{flex:1;display:grid;grid-template-columns:250px minmax(0,1.15fr) minmax(0,1fr);gap:14px;padding:14px 18px 18px;min-height:0}
.col{background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow);overflow:hidden}
.colhead{padding:12px 14px;border-bottom:1px solid var(--line2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ttl{font-size:15px;font-weight:700}
.scroll{overflow:auto;flex:1;min-height:0}
.scroll::-webkit-scrollbar{width:10px}.scroll::-webkit-scrollbar-thumb{background:#d6dae1;border-radius:9px;border:3px solid #fff}
.empty{padding:36px 18px;text-align:center;color:var(--faint);line-height:1.8}
.empty b{display:block;color:var(--sub);font-size:15px;margin-bottom:4px}
/* 학생 */
.sumrow{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.chip{border-radius:999px;padding:1px 9px;background:#f3f4f7;color:var(--sub);font-weight:600}
.chip.ok{background:var(--ok-soft);color:#0b7a3b}.chip.part{background:var(--warn-soft);color:#8a5600}
.bar{height:6px;background:#eef0f3;border-radius:9px;overflow:hidden;flex:1;min-width:40px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .25s}
.tgt{display:flex;align-items:center;gap:4px}
.tgt input{width:46px;padding:3px 6px;text-align:center}
#stu .s{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;border-left:3px solid transparent}
#stu .s:hover{background:#f7f8fb}
#stu .s.on{background:var(--acc-soft);border-left-color:var(--acc)}
#stu .no{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:#eef0f3;color:var(--sub);font-variant-numeric:tabular-nums;flex:none}
#stu .s.part .no{background:var(--warn-soft);color:#8a5600}
#stu .s.done .no{background:var(--ok);color:#fff}
#stu .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stu .mini{width:54px;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
#stu .mini span{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
#stu .mini .bar{width:54px;height:4px;flex:none}
#stu .s.part .mini .bar i{background:var(--warn)}
/* 문장 은행 */
.search{position:relative;flex:1;min-width:180px}
.search input{width:100%;padding-left:32px}
.search::before{content:"";position:absolute;left:11px;top:50%;width:11px;height:11px;border:2px solid var(--faint);border-radius:50%;transform:translateY(-62%)}
.search::after{content:"";position:absolute;left:21px;top:58%;width:6px;height:2px;background:var(--faint);transform:rotate(45deg)}
.filters{display:flex;gap:12px;width:100%;font-size:13px;color:var(--sub)}
.filters label{cursor:pointer;user-select:none}
#cats{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line2);max-height:104px;overflow:auto;background:#fafbfc}
#cats button{font-size:13px;padding:3px 11px;border-radius:999px;font-weight:500}
#cats button span{color:var(--faint);font-size:11.5px;margin-left:2px}
#cats button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#cats button.on span{color:#c7cbd3}
.cat-h{position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(4px);padding:8px 14px 6px;font-size:12.5px;font-weight:700;color:var(--acc-ink);border-bottom:1px solid var(--line2);z-index:1;letter-spacing:.2px}
.it{display:flex;gap:11px;padding:10px 14px;border-bottom:1px solid var(--line2);cursor:pointer;align-items:flex-start;position:relative}
.it:hover{background:#f7f8fb}
.it .ck{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid #c9ced8;margin-top:2px;display:grid;place-items:center;font-size:11px;color:transparent;transition:all .12s}
.it:hover .ck{border-color:var(--acc);color:var(--acc)}
.it:hover .ck::after{content:"+"}
.it.mine{background:var(--ok-soft)}
.it.mine .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.it.mine .ck::after,.it.mine:hover .ck::after{content:"✓"}
.it.hid{opacity:.45}
.it .tx{flex:1;line-height:1.65}
.it .use{font-size:11.5px;color:var(--sub);white-space:nowrap;margin-top:3px;background:#f0f1f4;border-radius:999px;padding:0 8px;font-weight:600}
.it .use.many{color:#8a5600;background:var(--warn-soft)}
.it .ops{display:none;gap:4px;position:absolute;right:12px;top:8px;background:#fff;border-radius:8px;box-shadow:var(--shadow);padding:3px}
.it:hover .ops{display:flex}
.tag{font-size:11px;background:#ede9fe;color:#5b21b6;border-radius:5px;padding:0 6px;margin-left:6px;font-weight:600;vertical-align:1px}
mark{background:#fff0a8;padding:0 1px;border-radius:3px}
/* 현재 학생 */
.cur{display:flex;align-items:center;gap:12px;width:100%}
.avatar{width:44px;height:44px;border-radius:12px;background:var(--acc-soft);color:var(--acc-ink);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
#curName{font-size:17px;font-weight:700;line-height:1.3}
#curSub{font-size:12.5px;color:var(--sub)}
.opt{font-size:12.5px;color:var(--sub);cursor:pointer;user-select:none;white-space:nowrap}
#items .row{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);align-items:flex-start}
#items .row:hover{background:#fafbfc}
#items .row .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--acc-soft);color:var(--acc-ink);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
#items .row .t{flex:1;outline:none;border-radius:6px;padding:0 4px;line-height:1.65}
#items .row .t:hover{background:#f3f4f7}
#items .row .t:focus{background:#fffbea;box-shadow:0 0 0 1.5px #f2d48a}
#items .row .b{display:flex;gap:2px;opacity:.25;transition:opacity .12s}
#items .row:hover .b{opacity:1}
#items .row .b button{border-color:transparent;background:transparent}
#items .row .b button:hover{background:#eef0f3}
#items .row .b button[data-m=x]:hover{background:var(--bad-soft);color:var(--bad)}
.free{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line2);align-items:center;flex-wrap:wrap}
.free input[type=text],.free #addFree{flex:1;min-width:150px}
#final{border-top:1px solid var(--line);padding:12px 14px 14px;background:#fafbfc}
.fhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.meter{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.meter .bar{height:7px}
#meterBar.warn{background:var(--warn)}#meterBar.over{background:var(--bad)}
.cnt{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--sub);white-space:nowrap}
.over{color:var(--bad);font-weight:700}
#finalText{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;max-height:30vh;overflow:auto;line-height:1.85;font-size:15px}
#finalText.muted{color:var(--faint)}
/* 모달 */
.modal{position:fixed;inset:0;background:rgba(15,20,30,.45);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.dlg{background:#fff;border-radius:16px;max-width:1000px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(16,24,40,.25)}
.dlg h2{margin:0;font-size:17px;padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.dlg .bd{padding:16px 20px;overflow:auto}
.dlg .ft{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg textarea{width:100%;line-height:1.7}
.dlg label{font-size:14px}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line2);padding:10px 12px;vertical-align:top;text-align:left;font-size:14px;line-height:1.7}
th{background:#f7f8fa;position:sticky;top:0;font-size:12.5px;color:var(--sub);font-weight:700}
tbody tr:hover{background:#fafbfc}
td.nm{font-weight:700;white-space:nowrap}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,8px);background:#18212f;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:all .2s;pointer-events:none;z-index:60;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.on{opacity:.96;transform:translate(-50%,0)}
.lock main .it,.lock #items .b button,.lock #addFree{pointer-events:none}
.lock .it .ck{display:none}
@media (max-width:1100px){main{grid-template-columns:220px minmax(0,1fr)}main>section:last-child{grid-column:1/-1;min-height:420px}}
@media (max-width:760px){main{grid-template-columns:1fr;padding:10px}html,body{height:auto}main>section{min-height:360px}.brand small{display:none}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><div class="logo">행</div><h1>행발 기록 도우미<small>클릭해서 학생에게 문장 넣기</small></h1></div>
    <div class="yearbox"><span class="muted">학년도</span><select id="yearSel" aria-label="학년도"></select><button id="newYear" class="ghost sm">+ 새 학년도</button></div>
    <div class="sp"></div>
    <span id="sync" style="display:none"></span>
    <div class="grp">
      <button id="btnRoster">명단</button>
      <button id="btnAdd">문장 추가</button>
      <button id="btnAll">학급 전체 보기</button>
    </div>
    <div class="div"></div>
    <div class="grp">
      <button id="btnExport" class="ghost" title="모든 학년도·추가 문장을 파일로 저장">백업 저장</button>
      <button id="btnImport" class="ghost">백업 불러오기</button>
    </div>
    <button id="btnLock" class="pri">올해 확정 저장</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>
  <nav class="tabs" id="areaTabs"></nav>
</header>
<div id="banner"></div>
<main>
  <section class="col">
    <div class="colhead"><span class="ttl">학생</span><span class="sp"></span><label class="opt"><input type="checkbox" id="onlyTodo">미완료만</label></div>
    <div class="colhead" style="flex-direction:column;align-items:stretch;gap:8px">
      <div class="sumrow" id="progTxt"></div>
      <div style="display:flex;align-items:center;gap:10px"><div class="bar"><i id="progBar" style="width:0"></i></div>
        <label class="tgt muted" title="학생마다 넣을 문장 개수">목표<input id="target" type="number" min="1" max="20">개</label></div>
    </div>
    <div class="scroll" id="stu"></div>
  </section>
  <section class="col">
    <div class="colhead">
      <span class="ttl">문장 은행</span><span class="muted" id="bankCount"></span><span class="sp"></span>
      <div class="search" style="flex-basis:100%"><input id="q" placeholder="모든 묶음에서 검색 (단축키 /)" aria-label="문장 검색"></div>
      <div class="filters"><label><input type="checkbox" id="hideUsed">다른 학생이 쓴 문장 숨기기</label><label><input type="checkbox" id="showHidden">숨긴 문장 보기</label></div>
    </div>
    <div id="cats"></div>
    <div class="scroll" id="bank"></div>
  </section>
  <section class="col">
    <div class="colhead">
      <div class="cur"><div class="avatar" id="curAv">?</div>
        <div style="flex:1;min-width:0"><div id="curName">학생을 고르세요</div><div id="curSub"></div></div>
        <label class="opt" title="목표 개수를 채우면 다음 번호 학생으로 넘어갑니다"><input type="checkbox" id="autoNext">다 채우면 다음 학생</label></div>
    </div>
    <div class="scroll" id="items"></div>
    <div class="free">
      <input id="addFree" placeholder="직접 쓴 문장 넣기 (Enter)">
      <label class="opt" title="이 문장을 문장 은행에도 넣습니다"><input type="checkbox" id="freeToBank">은행에도 저장</label>
    </div>
    <div id="final">
      <div class="fhead">
        <span class="ttl">최종 문장</span>
        <div class="meter"><div class="bar"><i id="meterBar" style="width:0"></i></div><span class="cnt" id="cnt"></span></div>
        <button id="copyOne" class="pri sm">복사</button>
      </div>
      <div id="finalText" class="muted">학생을 고르면 여기에 완성된 문장이 보입니다.</div>
    </div>
  </section>
</main>

<div class="modal" id="mRoster"><div class="dlg" style="max-width:520px">
  <h2>학생 명단 <span class="muted" id="rosterYear"></span></h2>
  <div class="bd">
    <p class="muted" style="margin-top:0">한 줄에 한 명. <b>번호 이름</b> 또는 이름만(번호 자동). 엑셀·나이스에서 두 열을 복사해 붙여 넣어도 됩니다.
      번호가 같으면 이미 넣은 문장은 그대로 남습니다.</p>
    <textarea id="rosterTxt" rows="16" placeholder="1 홍길동&#10;2 김철수"></textarea>
  </div>
  <div class="ft"><button data-close>취소</button><button class="pri" id="rosterSave">저장</button></div>
</div></div>

<div class="modal" id="mAdd"><div class="dlg" style="max-width:640px">
  <h2>새 문장 추가</h2>
  <div class="bd">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <label>영역 <select id="addArea"></select></label>
      <label>묶음 <select id="addCat"></select></label>
      <input id="addNewCat" placeholder="새 묶음 이름" style="display:none">
    </div>
    <textarea id="addTxt" rows="9" placeholder="한 줄에 한 문장. 여러 줄을 한꺼번에 붙여 넣으면 모두 추가됩니다."></textarea>
    <p class="muted">추가한 문장은 모든 학년도에서 쓸 수 있고, 백업 파일에 함께 저장됩니다. 문장 은행에서 마우스를 올리면 고치기·지우기가 나옵니다.</p>
  </div>
  <div class="ft"><button data-close>닫기</button><button class="pri" id="addSave">추가</button></div>
</div></div>

<div class="modal" id="mAll"><div class="dlg">
  <h2>학급 전체 — <span id="allTitle"></span><span class="sp"></span>
    <button class="sm" id="allCopy" title="번호·이름·문장을 엑셀에 붙여 넣을 수 있게 복사">표 복사(엑셀용)</button>
    <button class="sm" id="allCsv">CSV 저장</button></h2>
  <div class="bd" style="padding:0"><table><thead><tr><th style="width:56px;white-space:nowrap">번호</th><th style="width:70px">이름</th><th>최종 문장</th><th style="width:90px">분량</th><th style="width:64px"></th></tr></thead><tbody id="allBody"></tbody></table></div>
  <div class="ft"><button data-close>닫기</button></div>
</div></div>

<div id="toast"></div>

<script>

/*BANK-START*/

 내어 완성도 있는 결과물을 만들어내기 위해 노력하는 모습이 인상적임."]},{"cat":"학습면-중","items":["학습 과제를 성실하게 수행하며 바른 학습 태도로 수업에 임하는 학생으로 미래의 성장이 더욱 기대되는 학생임.","성실한 학습태도에 비해 학업향상폭이 다소 아쉬우나 본인에게 맞는 공부법을 찾는다면 특유의 성실함으로 많은 발전이 있으리라 기대됨.","공부하고자하는 열정이 있으므로 발전이 기대되고 수업 중 과제를 끝까지 완수하려고 노력하는 점이 바람직함.","수업 중 과제를 끝까지 완수하려고 노력하는 점이 바람직하며 긍정적이고 적극적인 태도로 수업에 참여함.","기본 학습이 잘 되어 있어 교과 문제 해결력이 뛰어나나, 수업 중에 자기 생각을 적극적으로 표현하는 학습을 보완한다면 더욱 발전하리라 예상됨.","기본 학습이 잘 되어 있어 교과 문제 해결력이 뛰어나니, 학업에 대한 내적동기를 발견한다면 더욱 발전하리라 예상됨.","꾸준한 반복 학습을 통해 수학과 이해력이 많이 향상하였으니 다른 교과도 할 수 있다는 자신감을 갖고 노력한다면 더 큰 향상을 보일 것임.","성실한 학습태도에 비해 학업향상이 아쉬워 본인에게 맞는 공부법을 찾는다면 특유의 성실함으로 많은 발전이 있으리라 기대됨.","기본적 문제 해결 방법을 잘 이해하고 차근차근 생각하여 풀어내나 집중할 때와 집중하지 않을 때의 수업 태도의 차이가 크니 학업에 대한 내적동기를 찾는 것이 중요함.","무슨 일이든 끝까지 최선을 다하여 기한 내에 마무리하는 태도를 가지고 있으며 긍정적이고 차분하여 친구들과의 교우관계가 원만함.","기본 학습 능력 및 교과 문제 해결력이 준수하여 학업에 대한 내적동기를 발견한다면 더욱 발전하리라 예상됨.","구체적인 자료를 학습에 활용할 줄 알고, 학습 문제에 대한 토의를 잘 하며 학습과제를 성실하게 하고 바른 학습 태도로 수업에 임하는 모습이 인상적임.","자신이 좋아하는 부분에 있어서는 집중력과 몰입을 통해 충분한 능력을 보여주는 학생으로, 잘 가꿔나간다면 미래의 성장이 기대되는 학생임.","언어적 이해력, 수학적 사고력 등의 기본학습수준이 준수하여 전과목 성취도가 훨씬 더 나아질 수 있는 높은 잠재력을 가지고 있음.","자신이 좋아하는 분야에 있어서는 집중력과 몰입이 훌륭한 학생으로, 학업에 대한 내적동기를 찾아 잘 가꿔나간다면 미래의 성장이 기대되는 학생임.","학기 초에 비해 공부하는 태도가 좋아지고 있으므로 꾸준히 노력한다면 더욱 발전한 것으로 생각됨.","종합적 사고력 및 이해력이 준수하여 부족한 부분만 약간 보완한다면, 훨씬 더 성장할 수 있는 높은 잠재력을 가지고 있음."]},{"cat":"국어","items":["언어적 이해력과 표현력이 준수하여 자신의 생각이나 느낌을 글로 구체적이고 논리적으로 표현할 수 있음.","언어적 이해력과 표현력이 뛰어나 자신의 생각과 느낌을 시나 짧은 글로 구체적이고 생생하게 표현해 냄.","한글을 읽고 이해하는 문해력이 눈에 띄게 향상되었고, 말하는 능력도 발전하는 중임. 습득력이 뛰어난 학생이라 앞으로의 성장이 기대됨.","글을 읽고 이해하는 문해력과 문제 상황을 빠르게 파악하는 이해력이 높으며, 도움이 필요한 친구들에게 자신의 능력을 나눠줄 줄 아는 멋있는 어린이임.","한글을 읽고 이해하는 문해력이 눈에 띄게 향상되었고, 글을 쓰는 능력도 발전하는 중임. 습득력이 뛰어난 학생이라 앞으로의 성장이 기대됨."]},{"cat":"리더쉽 / 학급회장","items":["주변 친구들을 아우르는 리더쉽을 갖춘 학생으로, 1학기 학급 부회장으로 솔선수범하여 타에 모범이 됨.","주변 친구들을 아우르는 리더쉽을 갖춘 학생으로, 2학기 학급 회장으로 솔선수범하여 타에 모범이 됨.","따뜻한 품성을 지니고 있어 먼저 친구에게 도움을 주고자 노력하고, 배려하고 양보하며 모둠활동을 원만히 이끌어가려고 노력함.","1학기 학급 회장으로 학급을 위해 성실히 책임을 다하였으며, 리더쉽을 발휘해 주변 친구들을 잘 아우름.","항상 긍정적인 생각을 가지고 생활하며 리더십이 있어 모둠 활동에서 친구들을 배려하고 존중하며 활동을 이끄는 모습이 인상적임.","모든 수업 시간에 차분히 집중하여 참여하고, 모둠 활동에서 친구들의 의견을 수용하고 타협할 줄 아는 협력적인 태도를 가지고 있어 모둠 활동을 원만히 이끌어감.","따뜻한 마음으로 자신보다 어린 동생들을 잘 챙기고 세심하게 배려하는 리더쉽을 발휘하여 동생들이 믿고 따르는 학생임.","6학년 학급 회장으로 학급을 위해 성실히 책임을 다하였으며, 주변 친구들의 의견을 포용력있게 수용함.","모둠 활동에서도 협력적인 태도로 친구들의 의견을 잘 받아주는 포용력이 있으며 모둠 과제를 앞장서서 해결해나가는 리더쉽도 있음.","친구들의 의견을 적극적으로 수용할 줄 아는 협력적인 태도로 모둠 및 학급 활동 시 학생들을 잘 이끌어나가는 리더쉽있는 학생임.","항상 긍정적인 생각을 가지고 2학기 학급 부회장으로 리더십을 발휘하여 솔선수범하고 친구들을 도와줌.","친구의 의견을 수용할 줄 아는 협력적인 태도를 바탕으로 2학기 학급 부회장으로서 리더십을 발휘하여 솔선수범하고 친구들을 도와줌."]},{"cat":"학습태도","items":["책을 즐겨 읽으며 다양한 독서로 상식이 풍부함.","독서 습관이 잘 형성되어 꾸준히 독서하며, 특히 책을 몰입해서 읽는 능력이 뛰어남.","독서 습관이 잘 형성되어 있고 다양한 독서로 상식이 풍부함.","평소 학습 태도가 바르며 사회과 조사학습과 자신의 생각과 느낌을 글로 표현하는 자기 주도적 학습력이 뛰어남.","수업에 적극성을 가지고 성실히 참여하며, 자신의 생각을 조리있게 정리해 발표하는 능력이 뛰어남.","자기 의견을 정당하게 주장하고 학습 활동에도 적극적인 자세로 수업에 임하여 지속적인 발전이 기대됨.","수업에 임하는 태도가 매우 진지하고 발표를 잘 하며 자신의 의견을 꾸준히 제시할 줄 아는 야무진 학생임.","학습에 대한 관심이나 호기심과 같은 내적동기가 높고 바른 학습 태도로 수업에 임하므로 앞으로 많은 발전 가능성이 있음.","학습활동에 대한 호기심과 열의가 있어 자신의 생각을 잘 정리하여 적극적으로 발표함.","뛰어난 상상력으로 기발한 아이디어를 제시함으로서 다른 친구들에게 신선한 자극을 줄 때가 많음.","독서하는 습관이 바르게 형성되어 있고 사회현상에 대한 관심이 많음.","구체적인 자료를 학습에 활용할 줄 알고, 학습 문제에 대한 토의를 잘 함.","수업 시간에 활발하게 참여하여 학습 분위기를 즐겁게 이끌어 감.","수업 중 과제를 끝까지 완수하려고 노력하는 점이 바람직하며 긍정적인 태도로 수업에 참여함.","자신이 좋아하는 부분에 있어서는 강한 집중력과 몰입을 통해 특출난 능력을 보여주는 학생으로, 잘 가꿔나간다면 미래의 성장이 기대되는 학생임.","어렵고 복잡한 문제를 접하였을 때 쉽게 포기하지 않고 끝까지 탐구하려는 노력과 자세를 가졌기에 앞으로 큰 발전이 기대되는 학생임.","모든 일에서 쉽게 포기하지않고 끝까지 최선을 다하여 노력하며 모든 교과활동에 적극적으로 참여함.","꼼꼼한 성격으로 맡겨진 일은 사소한 일이라도 완벽하게 처리하기 위해 노력하는 모습이 좋음.","자기 관리 능력이 뛰어나 자신의 일을 스스로 찾아 해결하고 기회가 주어졌을 때 생각이나 의견을 조리 있게 표현하고자 노력하려는 의지와 자세를 가지고 있어 충분한 격려를 통해 앞으로의 발전이 기대됨.","밝고 적극적인 태도로 수업 시간에 집중하는 능력이 크게 향상 되었으며 규칙을 잘 지키고 자신이 맡은 일을 꼼꼼하고 성실하게 완수하기 위해 노력함.","1학기에 비해 학습태도가 훨씬 더 우수해졌으며 수업에 대한 집중력과 책임감도 향상되어 앞으로의 발전이 더욱 기대되는 학생임.","차분하게 자신에게 주어진 역할을 잘 수행하고 수업 중 집중을 잘하며 문제이해력이 뛰어나 과제를 시간안에 성실하게 수행함.","학년 초에 비해 수업에 임하는 태도가 종합적으로 크게 개선되었으며, 책임감을 가지고 자신에게 주어진 과제를 해결하려는 의지를 보이는 학생이라 앞으로 발전할 모습이 기대됨.","학습태도가 바르고 수업에 적극적으로 참여하여 높은 집중도를 보이고, 친구들을 잘 도와주는 이타적인 마음이 돋보임.","항상 최선을 다하고자 하는 자세를 가지고 있으며 어떤 어려움에도 굴하지 않고 해결해 나가는 능력을 보여줌.","자신의 성장과 발전을 위해 노력하고 꾸준한 학습태도를 유지하여 학업 성취도가 높음.","동기부여가 잘 되어 있어 어떤 과제든 열심히 참여하고, 모둠활동에 주도적으로 나서며 항상 최선을 다함.","학업적인 성취도 뿐 아니라 사회성과 인간관계에서도 모범적인 모습을 보여주어 친구들과의 관계가 좋고, 학교 내에서도 신뢰받는 존재임.","학습태도가 바르며 끊임없이 발전하고 성장하려는 자세를 가지고 있어 학교에서 인정받고 있는 학생임.","모둠 활동 시 친구들의 입장을 배려하며 맡은 바에 책임을 다하며 여분의 시간을 내어 완성도 있는 결과물을 만들어내기 위해 노력하는 모습이 인상적임.","학년 초에 비해 학습 태도가 더 우수해졌으며, 책임감을 가지고 자신에게 주어진 일은 해내려는 의지가 있는 학생이라 앞으로 더 성장할 것으로 기대됨.","공부 시간에 누구보다도 가장 수업에 집중하며, 모든 질문에 대해 자신의 생각을 적극적으로 발표하는 명석한 학생임.","스스로 공부하는 습관이 잘 잡혀있어 누가 시키지 않아도 자기가 맡은 역할과 책임을 다하는 학생으로 앞으로의 발전이 더욱 기대되는 학생임."]},{"cat":"수학","items":["수학과 연산 영역에 학기초 어려움을 보였지만 꾸준히 반복함으로써 연산 및 수리 능력이 많이 향상되어 성취수준이 크게 높아짐.","수학에 재능이 많은 학생으로 논리적 사고력과 직관적 추리력이 뛰어나, 자료를 정확하게 분석하고 일반화하는 능력이 탁월함."]},{"cat":"탐구력","items":["하나의 주제에 관심을 가지면, 뛰어난 탐구력을 발휘해 궁금증이 풀릴 때까지 깊게 탐구하는 경향이 있음.","책임감을 가지고 자신에게 주어진 과제를 성실하게 해내려는 의지와 목표의식이 돋보이는 학생임.","자신에게 주어진 일을 끝까지 완성하고자 노력하며 관심 있는 분야에 대해 목표 의식을 가지고 지속적으로 탐구하려는 모습이 인상적임.","때때로 수업과 상관없는 농담으로 수업의 흐름을 끊을 때가 있으므로 수업에 더욱 집중한다면 큰 발전이 기대됨.","수업시간에 바른자세로 앉는 습관을 기를 필요가 있음."]},{"cat":"특히 잘해","items":["특히 계산을 신속 정확하게 할 수 있으며 수학적 개념을 여러 가지 문제유형에 적용하여 문제를 해결하는 능력이 뛰어남.","특히 역사에 깊은 관심을 가지고 수업 시간에 열정적으로 참여하며 시대적 흐름을 잘 파악함.","특히 자신의 생각이나 느낌을 참신한 표현을 사용하여 글로 재미있게 나타냄.","특히 문장 이해력과 표현력이 좋아서 생각과 느낌을 글로 잘 담아냄.","특히 필기의 중요성을 알고 필기를 열심히 함. 스스로에게 도움이 되는 학습 방법을 찾아 노력하는 태도가 훌륭함.","특히 연산의 개념을 정확하게 이해하고 사용하며, 수학적 개념을 여러 가지 문제유형에 적용하여 문제를 해결하는 능력이 뛰어남.","특히 자신이 관심있는 분야에 대하여 늘 관심을 가지고 심화시키기 위해 노력하며 취미로 즐기는 모습이 바람직함."]},{"cat":"1학기 공부독설","items":["수업에 집중할 때와 집중하지 않을 때의 수업 태도의 차이가 크기 때문에, 집중력을 키운다면 큰 발전이 기대됨.","수업 시간에 단체 활동이나 모둠 활동을 방관할 때가 다소 있으므로 적극적으로 참여하려는 자세가 필요함.","때때로 학습에 대한 지나친 자신감이 자만심으로 이어질까 염려되므로 겸손히 익히려는 마음을 가지는 것이 좋겠음.","수업에 집중하지 않을 때가 잦음. 자신에게 공부가 왜 필요한지에 대해 생각해 보고 내재적인 동기를 가질 필요가 있음.","학습 의욕이 높고 사고력이 풍부나 지식에 대한 편식이 있으므로 다방면에 관심을 가지려는 노력이 필요함.","학습 활동에 지장이 생기지 않도록 학습 준비물을 잘 챙기려는 노력이 필요함.","학습 활동에 지장이 생기지 않도록 체력 및 취침과 기상 시간을 스스로 관리하는 것이 좋겠음.","독서를 편식하는 경향이 있으므로 다양한 분야의 책을 골고루 접해 볼 것을 권함."]},{"cat":"공부제안","items":["자기 이해에 대한 노력과 긍정적 태도를 유지하면서 본인에게 맞는 공부법을 찾는다면 특유의 성실함으로 많은 발전이 있으리라 기대됨.","독서를 통해 배경지식을 쌓고 어휘력을 기르면 학습에 큰 도움이 될 것임. 되도록 많은 책을 읽도록 노력하고 단어수첩을 사용해 볼 것을 권함.","생각을 논리정연하게 표현할 수 있으려면 평소에 작은 것들도 기록하는 습관이 필요함. 일기쓰기, 글쓰기 공책 등을 활용하여 떠오르는 생각을 적는 연습을 권함.","수학 교과의 단순계산실수, 순간착각 등을 줄이기 위해 깔끔한 풀이과정을 적는 연습을 권함.","분수의 소수의 연산이 다소 미흡함. 장래 진로와 학업을 대비해 분수, 소수의 사칙연산능력이 반드시 필요하므로 방학동안 숙달할 수 있도록 반복 연습할 것을 권함.","학습 내용에 대해 전반적인 흐름은 잘 파악해내지만 지필평가시 문제를 읽고 아는 것을 적용해 푸는 것이 아쉬움. 여러 유형의 문제를 접하여 개념이나 원리를 문제에 적용하는 연습이 더 필요함.","자기 생각을 보다 더 적극적으로 표현하려는 노력이 필요함.","학습에 대한 자신감을 높이기 위해 먼저 재미있다고 느끼는 과목부터 학업성취를 높여 만족감을 얻으면 다른 과목에도 좋은 영향을 미칠 것임."]},{"cat":"음악","items":["뛰어난 음악적 감각으로 오카리나 운지를 연습해 박자와 음정에 맞는 뛰어난 연주를 선보임.","즐거운 마음과 태도로 노래부르기나 박자표현하기에 임하는 모습이 좋음.","음악적 관심과 흥미가 높으며 수준급의 리코더 연주 실력을 갖고 있음.","뛰어난 음악적 감각과 소질을 가지고 있으며, 학예발표회에 참여해 훌륭한 피아노 연주를 선보임.","뛰어난 음악적 감각과 소질을 가지고 있으며, 악기를 잘 연주하고 즐거운 마음과 태도로 가창 활동에 적극적으로 임함.","고운 목소리와 음악적 감각을 바탕으로 노래를 잘 부름.","음악적 관심과 흥미가 높으며, 악기연주에 소질이 있어 학교 오케스트라 활동에 참여해 멋진 공연을 선보임.","뛰어난 음악적 감각으로 리코더 운지를 연습해 박자와 음정에 맞는 뛰어난 연주를 선보임.","뛰어난 음악적 감각으로 칼림바 운지를 연습해 박자와 음정에 맞는 뛰어난 연주를 선보임.","피아노 연주에 소질이 있으며 음악적 감각이 있음."]},{"cat":"미술","items":["미술에 소질이 있으며 색감과 작품 구상 능력이 뛰어나고 표현력이 돋보임.","주제에 맞게 구상을 잘 하며 끈기있게 미술활동을 하여 작품완성도가 높음.","표현력과 작품 구상 능력이 뛰어나고 구상한 것을 바탕으로 형태로 만들어내는 능력이 특출남.","사물에 대한 깊은 관찰과 생각을 바탕으로 창의성 있게 새로운 작품을 만들고 그리는데 능함.","세심한 그림을 잘 그릴 줄 알고 미술 활동에 자신감을 가지고 적극적으로 참여함.","뛰어난 회화 실력과 꾸준한 노력으로 미술에서 다양하고 훌륭한 작품을 만들어 냄.","성실함을 바탕으로 미술 작품 구상 및 완성도가 높음.","그리기, 꾸미기 등 미술 활동에 소질이 많고 시각적, 공간적 표현을 잘 함.","미적 감각이 뛰어나 각종 꾸미기 활동과 디자인 구성을 잘 함.","세심한 그림을 잘 그릴 줄 알고 디자인 및 편집 활동에 자신감을 가지고 적극적으로 참여함.","표현력과 작품 구상 능력이 뛰어나고 구상한 것을 형태로 표현할 때 세밀하게 표현하는 능력이 발군임.","표현력과 작품 구상 능력이 뛰어나고 구상한 것을 형태로 표현할 때 신선한 색감이 특징적임."]},{"cat":"꿈, 끼, 소질","items":["노래, 연기와 같은 예능 부분에 두각을 나타내어 1학기 연극 활동에서는 '유관순' 역할을, 2학기 뮤지컬 활동에서도 중요 배역을 맡아 자신의 재능을 다하여 멋진 공연을 만들어 줌.","목표 의식이 뚜렷하여 미술 분야에 지속적으로 관심을 갖고 탐구하는 모습이 인상적임.","뚜렷한 목표의식을 가지고 자신이 이루고자 하는 꿈을 향해 꾸준한 노력하는 모습이 인상적임."]},{"cat":"체육","items":["체육에 소질이 있어 피구와 축구활동에 두각을 보임.","체육과의 신체적 기능이 뛰어나 운동하기를 좋아하고 우수한 기록을 세움.","체육과의 표현활동을 비롯하여 놀이, 게임 등 신체 활동에 두각을 나타내며, 각종 예체능 활동에 적극적으로 참여하여 두각을 나타냄.","순발력이 좋고 민첩성이 높아 체육 활동에 적극적으로 참여하며 두각을 나타내며, 스포츠클럽 대회에서 학교 대표로 멋진 모습을 보여줌.","운동을 좋아하고 외향적이기 때문에 체육 활동에 있어 항상 친구들이 함께 하길 원하는 학생이며 본인도 단체 활동에 적극적으로 나서는 편임.","체육 활동에 적극적으로 참여하며 도전 활동과 다양한 체육 활동에 두각을 나타냄.","축구에 관심과 소질이 있고 방과후 축구반에서 활동하여 협동심을 키우고 체력도 증진됨.","다양한 체육활동에 흥미를 가지고 적극적으로 참여하며, 운동신경과 협응력이 뛰어나 도전활동과 경쟁활동에서 두각을 나타냄.","다양한 체육활동에 흥미를 가지고 적극적으로 참여함.","체육 활동에 관심이 많고 활동적으로 참여함."]},{"cat":"교우-외향","items":["늘 밝고 명랑한 생활을 하며 급우 간에 인기가 높고 자기 의사 표시를 분명히 함.","평소 긍정적으로 생활하는 모습이 돋보이며, 자신의 생각이나 의견을 자신감 있는 태도로 발표하고 표현하는 모습이 인상적임.","밝고 유쾌하며 진솔한 성격을 가지고있어 친구들에게 많은 웃음을 줌.","왕성한 의욕으로 항상 자신감이 넘치고 밝은 표정으로 사교적임.","타고난 기지와 재치로 주변 친구들을 즐겁게 만드는 유쾌한 학생으로, 사교성이 좋아 주위 친구들에게 신망이 투터움.","교우 관계가 원만하고 항상 고운 말과 긍정적인 생각으로 친구들을 배려하는 학생임.","밝고 유쾌한 성품으로 주변 친구들에게 웃음을 주고, 주변 친구들을 배려하고 위할줄 아는 학생임.","밝은 성품으로 친구들에게 웃음을 주고 자신도 늘 웃음을 머금고 있어 친구들 사이의 관계가 좋음.","사교성이 좋아 대부분의 친구들과 잘 어울리며, 도움이 필요한 친구에게 먼저 다가가는 따뜻한 마음씨와 배려심을 가져 주위 친구들에게 인기가 많음.","밝고 유쾌한 성품으로 주변 친구들에게 긍정적 에너지를 주고, 주변 친구들을 생각하고 배려할줄 아는 학생임.","친구들과 함께하는 놀이 활동을 즐기며, 주변 친구들을 배려하고 존중하는 태도를 가지고 있음.","활달하여 친구들 간의 어울림이 좋고 자기 의견도 잘 펼치며 역동적임.","교우 관계가 원만하고 항상 긍정적인 생각으로 친구들 사이에 인기가 좋음.","자신의 의견을 분명히 하면서도 친구를 배려하는 의사소통 능력이 뛰어나 모둠활동에서 좋은 결과물을 만들어냄.","자신의 의사 표시를 확실히하며 주장을 잘 펼치는 역동적인 학생이며 완성도 있는 결과물을 수행하는 학생이므로 앞으로의 발전이 기대됨.","밝고 긍정적으로 학교 생활을 하며 사교성이 좋아 대부분의 친구들과 잘 어울림","사교적이며 유쾌한 성정, 재치 있는 입담으로 타고난 친화력을 보여주며 주변 친구들과 잘 어울림.","밝고 따뜻한 품성을 지니고 있으며 특유의 친화력으로 급우들과 원만한 관계를 형성함.","밝고 자신감 있는 태도로 학교생활에 적극적으로 참여하며, 친구들과의 관계도 매우 원만함.","유쾌하고 재치 있는 말과 행동으로 주위 친구들에게 긍정적인 영향을 주며, 활기찬 학급 분위기를 만드는 데 기여함.","사교성이 뛰어나며 다양한 친구들과 잘 어울리고, 활달한 성격으로 친구들 사이에 인기가 많음.","자신의 생각을 명확하게 표현하고, 다른 친구들의 의견도 존중하는 균형 잡힌 의사소통 능력을 지님.","늘 밝은 미소로 주변을 따뜻하게 하고, 유쾌한 말투와 행동으로 친구들에게 웃음을 주는 학생임.","친구들에게 먼저 다가가 배려하는 모습이 인상적이며, 밝고 긍정적인 태도로 모두에게 좋은 영향을 줌.","활발하고 명랑한 성격으로 친구들과 즐겁게 지내며, 협동적인 태도로 공동체 활동에 적극 참여함.","긍정적인 사고방식과 친근한 성격으로 친구들과의 관계가 매우 좋으며, 학급 분위기를 밝게 이끔.","항상 적극적이고 자신감 넘치는 모습으로 모둠 활동에 참여하며, 조화로운 분위기를 만드는 데 기여함.","타인을 배려할 줄 아는 따뜻한 마음과 밝은 성격으로 친구들 사이에서 신뢰받는 학생임.","친구들과의 놀이나 활동에서 주도적으로 참여하며, 긍정적인 에너지를 전달하는 중심적인 역할을 함.","자신의 생각을 적극적으로 표현하고 주변 친구들의 이야기도 경청하며 서로를 존중하는 태도를 지님.","밝고 유쾌한 성격 덕분에 친구들이 많이 따르며, 따뜻한 말과 행동으로 긍정적인 교우 관계를 유지함.","사교성이 뛰어나고 재치 있는 표현으로 친구들과의 관계를 돈독히 하며 모두가 함께 어울리는 분위기를 이끔.","의욕적으로 활동에 참여하고 자신의 역할을 성실히 수행하며, 친구들에게 신뢰와 호감을 얻는 학생임.","밝은 성품으로 늘 웃음을 머금고 있으며, 친구들과 어울리는 것을 좋아하여 긍정적인 교우관계를 형성함."]},{"cat":"교우-내향","items":["다른 사람의 상황이나 감정을 이해할 수 있는 따뜻한 마음을 지녔고 공감 능력이 뛰어남.","마음씨가 착해 다른 친구들을 배려할 줄 알며, 규칙과 질서를 잘 지켜서 친구들 사이에 신뢰가 높고 두루두루 사이가 좋음.","주변 친구들에 대한 관심이 많고 사교성이 풍부해 대부분의 친구들과 잘 어울리며, 항상 웃는 얼굴로 인상이 좋아 반에 활력소가 되어주는 학생임.","이해심이 많고 긍정적이어서 학급 분위기를 즐겁게 만듦.","항상 웃는 얼굴로 생활하여 교우관계가 원만하고,","주변 친구들의 의견을 귀담아 듣고 수용할 수 있는 포용력이 있는 학생으로 친구들과 원만히 생활하는 모습이 인상적임.","친구의 마음을 잘 이해하고 배려하며, 공동체 생활 속에서 갈등을 원만하게 해결해 나가는 모습이 인상적임.","항상 밝고 따뜻한 태도로 친구들을 대하며, 긍정적인 에너지로 학급 분위기를 좋게 이끌어 줌.","타인의 감정을 잘 공감하고 존중하는 자세를 지녀 친구들과 깊은 신뢰를 쌓으며 생활함.","모두에게 친절하게 대하며 배려심 있게 행동하여 친구들 사이에서 신뢰를 받는 학생임.","언제나 웃는 얼굴로 친구들과 어울리며, 학급 내 좋은 분위기를 형성하는 데 기여함.","주변 친구들의 이야기에 귀 기울이고 이해하려는 태도가 돋보이며, 학급 내 조화로운 관계 형성에 도움을 줌.","친구들을 소중히 여기며 좋은 관계를 유지하려는 책임감 있는 모습이 인상적임.","협동심과 포용력이 뛰어나며, 친구들과 함께 할 때 즐거운 분위기를 만들어 주는 학생임.","규칙과 예절을 잘 지키고 타인을 존중하는 태도로 친구들과의 관계에서도 모범이 됨.","학급의 다양한 친구들과 두루 잘 어울리며, 서로 도우며 성장해 나가는 모습이 보기 좋음.","친구들과의 관계를 중요시하며 좋은 우정을 지키려 노력하는 모습이 보임.","친구들의 마음을 잘 이해해 주고 배려하며 친구들 사이의 갈등을 잘 중재하여 친구들 사이의 믿음이 두터움."]},{"cat":"갈등관리","items":["늘 배려하는 태도가 생활 속에서 자연스레 드러나기 때문에 불필요한 갈등 상황을 연출하지 않는 속이 깊은 학생임.","갈등상황 발생 시 원인을 파악하고 본인의 행동을 반성적으로 성찰하여 원만하게 해결함.","갈등이 발생하였을 경우, 본인의 행동을 반성적으로 사고 할 수 있으며 원만한 해결을 위해 노력함.","갈등이 자주 발생하는 편이 아니며, 행여 친구들과 갈등이 발생하였을 경우 자신의 입장만 내세우는 것이 아니고 갈등을 해결하기 위한 최선의 방법과 대안을 모색해 적절히 문제를 처리함.","교우관계에서 발생 가능한 다양한 갈등들의 원인을 비교적 정확하게 파악하고 있으며 본인이 그러한 문제에 봉착하였을 때 원만하게 해결하기 위한 노력을 시도함.","늘 배려하는 태도가 생활 속에서 자연스레 드러나기 때문에 불필요한 갈등 상황을 연출하지 않음.","우선 교우관계에 있어서 특별히 갈등이 발생하는 편이 아니며, 행여 발생하였을 경우 남의 탓만 하는 것이 아니라 본인의 행동을 반성적으로 사고 할 수 있어 원만한 해결이 가능함.","자신의 주장이 강하여 주변 친구들과 관계가 충돌이 있는 편이었으나 모둠활동을 통하여 합리적으로 해결하려는 능력이 향상됨.","친구들과의 갈등이 자주 발생하지만 다른 사람의 입장을 헤아리려 노력하며 화해를 목적으로 하는 취지의 발언을 잘 함.","친구와 문제가 생겼을 때 자기의 잘못을 인정하는 너그러운 마음씨를 가지고 있음.","평소 친구들에게 장난치는 것을 좋아하여 갈등 발생의 원인을 제공하는 경우도 있으나 성품이 좋고 친구들과 화해하기 위한 노력을 잘 하기 때문에 갈등을 원만하게 잘 해결함."]},{"cat":"인지정의","items":["구체적인 자료를 학습에 활용할 줄 알고, 학습 문제에 대한 토의를 잘 하며 학습과제를 성실하게 하고 바른 학습 태도로 수업에 임하므로 전 교과 성취도가 높아 더 큰 발전이 기대됨.","기본 학습태도가 잘 형성되어 학습효과가 우수하며 착실함.","기초 학력 정착을 위한 특별지도로 학습의 흥미를 가지게 되었음.","꾸준한 노력과 성실한 자세로 학습에 임해 많은 향상을 보이고 있음.","꾸준한 노력으로 인해 전 교과에서 높은 향상을 나타냄.","남과 잘 어울리고 매사에 호기심이 많으며 독창적으로 자신 있게 표현하는 태도가 바람직함.","다른 사람들이 하는 행동을 그대로 모방하는 것이 아니라 자기의 생각을 중심으로 새롭게 행동함.","눈이 마주치면 늘 환하게 웃고 있는 믿음직스러운 아이임.","맡은 일을 끝까지 완수하는 끈기가 있으며 어려운 일도 쉽게 포기하지 않음.","문제를 자기 의사에 따라 잘 처리하며 바른 자세로 침착하게 행동함.","밝고 쾌활한 성품으로 친구들과 항상 즐겁게 생활하며 뚜렷한 자기 주관을 가지고 친구들을 지도해 내는 능력이 우수함.","사고가 논리적이고 성실해 여러 과목의 학업 성취가 높으며, 따뜻하고 이해심이 많아 교우 간에 신임이 두터움.","사려 깊게 행동하며 어려운 일을 당해도 서두르지 않음.","생명, 자연과 인간과의 공존, 환경문제, 시민단체 활동 등에 관심이 많은 편이며 도덕적 판단력과 합리적인 가치 선택 능력이 뛰어남.","선뜻 나서기 힘든 환경지킴이 활동 등을 자원하여 성실하게 해내고 있으며 자신의 진로에 대한 진지한 성찰과 노력이 있어 더욱 긍정적인 성장이 기대됨.","솔직 담백하여 의지가 곧은 학생임.","시간 계획을 잘 세워 시간을 유익하게 활용하며 집단 활동에 즐거운 마음으로 참여함.","심성이 곱고 착하며 자기의 의견을 바르고 정확하게 나타냄.","어려운 일이 있을 때 스스로 나서서 해냄.","언제나 경쾌한 발걸음으로 등교하여 하루를 즐겁게 시작함.","언제나 올바른 행동을 하며 자신을 사랑할 줄 아는 아이임.","영어회화에서 폭넓은 어휘력을 통한 다양한 상황 표현에 능숙하며, 실험정신이 뛰어나 표현하고자 하는 것들은 적극적으로 시도해 보려고 노력함.","온순하고 착실하며 급한 일에도 당황하거나 서둘지 않고 차분히 순서를 지켜 처리함.","의욕적으로 일을 처리하며 자기가 할 일을 스스로 찾아서 실천함.","의욕적이고 적극적이며 차분히 일을 계획하고 추진하는 태도가 바람직함.","인내력이 있고 감정을 절제할 줄 알며 책임감이 강하여 선도부 활동 및 기타 활동에 성실한 자세로 적극 참여함.","일에 흥미를 갖고 처리하며 무슨 일이나 잘하기 위해 스스로 노력함.","자기의 생각대로 자율적으로 행동함.","자신에게 득이 될 일과 되지 않을 일을 확실하게 구분하는 습관이 있어 조금은 다른 것도 볼 수 있는 여유를 가졌으면 함.","자신이 목표한 일은 열심히 하려는 굳은 의지가 너무 좋음.","자존심이 강하여 가끔씩 남에게 뒤지지 않으려는 의욕이 앞서 주위 사람과 부딪히는 경향이 있으나 더불어 사는 사회의 덕목을 체득한다면 큰 발전을 거둘 수 있을 것으로 생각됨.","자주적인 태도로 학급 생활에 참여하며 학급활동에 주도적 역할을 함.","적극적이며 어려운 일이 생겼을 때에 빨리 대처하는 침착성이 있음.","적극적인 태도로 일을 처리하며 자율적인 태도가 바람직함.","조용한 성격으로 맡은 일을 잘 하며 점차 학습에 흥미를 갖게 되어 적극적인 학습 태도를 보임.","주변의 강요에 의해서 행동하는 성품이 아니기 때문에 스스로 목표를 세우고 실천함.","차분한 성격으로 언제나 긍정적인 사고를 하는 착한 아이로 항상 노력하는 모습을 보임.","책임감이 강하고 빈틈이 없으며 지적탐구심이 강해 전 교과 성적이 우수하고 스스로 계획을 세우고 실천하는 자기관리 능력이 탁월함.","깊이 생각하고 판단하며 자기의 생각을 꾸밈없이 표현함.","침착하게 주어진 일을 처리하며 모든 일을 계획적으로 추진함.","침착하고 차분한 성품이며 일을 차분히 추진하는 태도가 바람직함.","학급 반장으로서 자기 관리에 능하고, 학업태도가 진지하여 우수한 학업성적을 꾸준히 거두며 책임감과 리더십이 뛰어남.","합리적으로 자신의 역할을 수행하려는 노력을 많이 하며 교우관계도 잘 유지하는 능력이 있음.","환한 미소를 가지고 항상 긍정적인 모습을 보이는 아이임.","힘든 상황에서 의젓하게 행동하는 모습을 보이고 차분한 마음은 큰 장점으로 작용함.","웃어른을 존경할 줄 알며 인사성이 바르고 성품이 너그러워 친구의 잘못이나 아픔을 따뜻하게 이해해 주는 진지한 품성을 지닌 학생임.","웃어른을 존경할 줄 알며 인사성이 바르고 주변 어른들께 예의를 갖추는 학생으로, 교실에서 선생님을 많이 도와주는 고마운 학생임.","경청하는 습관이 몸에 배여 있어 교사의 설명을 잘 듣고 빨리 이해하며, 이로 인해 활동 과정에 실수가 없고 항상 먼저 해결하여 친구들을 도와줌.","매사 부정적이며 장래희망에 대한 생각이 없으므로 뚜렷한 목표의식을 갖도록 힘써야 겠음.","요즘 사춘기가 시작되었는지 대화중에 약간의 욕설이 섞여 있으며 수업시간에 거울을 보며 짝지와 이야기를 하는 등 딴 짓을 종종 함.","인내심이나 집중력, 확실한 목표의식과 실천력, 독서력 등 공부에 필요한 능력이 요망됨.","일기와 과제를 성실하게 해 오는 태도, 지루함을 참고 수업시간에 집중해서 공부하는 인내심 등이 부족함.","일기와 주어진 과제를 잘 해오며 노력을 많이 하는 편이나, 교과 활동에 어려움을 느끼고 있어 좀 더 집중력을 기르고 노력을 하면 더 많은 향상을 보이리라 믿음.","일기와 주어진 과제를 잘 해오며 노력을 많이 하는 편임.","자기의 주장을 근거와 함께 발표하는 능력을 길러야 겠음.","자기의 주장을 논리적으로 말하는 능력이 부족함.","자신의 생각을 적극적으로 표현하는 태도를 기르고 학교생활에 능동적으로 참여하려 노력한다면 모든 면에서 더 큰 향상을 보이리라 기대됨.","전반적인 학습 내용은 잘 이해하나 구체적인 문제를 이해하지 못하여 올바르게 해결하지 못하는 경우가 있으므로 방학을 이용하여 학습지를 많이 접해 볼 수 있도록 도와주시면 많은 발전이 있으리라 생각됨.","조금 서두르는 면이 있기는 하지만 수업에 적극적이며 열심히 공부하고자 하는 열정이 있으므로 발전이 기대됨.","좀 더 집중력을 기르는 노력을 한다면 더 많은 향상을 보이겠음.","주어진 역할을 책임감 있게 해내려는 노력과 학습 집중력이 미흡하여 이점을 신경을 쓴다면 더 많은 향상을 보이겠음.","준비물과 과제의 수행활동을 하지 않아 힘든 점이 보이므로 활동력과 준비성을 키울 수 있도록 하는 힘이 필요함.","준비물을 종종 챙겨오지 않아 학습의 결손이 생기며 끝까지 작품이나 학습을 완성시키려는 태도가 필요함.","지나친 장난기로 인해 다른 사람에게 피해를 줄 때가 간혹 있어 주의가 필요함.","집중력이 부족하여 공부에 대한 자신감이 부족함.","차분하고 조용한 성격을 가지고 있는 아이로 수업태도가 좋고 책을 읽는 습관이 항상 있어 목표의식만 가지다면 학습향상을 가질 수 있음.","타고난 이해력이 좋은 덕분인지 집중력이 부족한 편인데도 교과 성적이 양호함.","토론하고 발표활동시 자신의 의견을 제시할 수 있으나, 친구들과 어울리기를 좋아해서 친구들의 영향을 많이 받는 편임.","하기 싫은 일은 하지 않고 지나려는 경향을 보이므로 스스로 할 수 있는 태도훈련이 필요함."]},{"cat":"감염병 대응 및 안전","items":["안전한 교실 생활을 위한 코로나 예방 수 교성이 좋으며 인간적인 친화력이 뛰어남.","장난을 많이 하는 편에 속하지만 악의가 없으며, 쾌활하고 사교적이며 유쾌한 성정으로 주위 친구들과 잘 어울림.","조용한 편이지만 생각이 깊으며 주변 친구들의 입장을 잘 헤아려 말하고 행동하여 배려를 잘 하는 아이로 교우관계가 준수함.","소극적이고 자기만의 생각이 있어 다른 친구들과 쉽게 어울리지 못하지만 따뜻한 마음씨로 주변 친구들과 점점 좋은 관계를 만들어 가고 있음.","친구들과 사이좋게 지내고 친화력이 좋으며 리더십이 돋보이는 학생임.","사교성이 있어 다른 친구들과 잘 어울리며, 다른 사람의 일을 남일로 여기지 않고 적극적으로 나서서 도와줌.","밝고 쾌활한 성격으로 즐겁게 학교생활을 하는 어린이로 이해심이 많아 친구들과 잘 어울림.","사교성이 있어 다른 친구들과 잘 어울리며, 성품이 온순하고 귀여운 면이 있음.","특유의 친근함으로 교우관계가 비교적 양호하며 가식적이지 않고 말하는 것이 재미있어 학급 내에서 인기가 많은 편임.","밝고 명랑한 성격으로 친구들과 즐겁게 학교 생활에 임하나 다만 수업시간에 웃기는 말이나 행동으로 학습을 방해할 때가 있으므로 조금 차분해질 필요가 있음."]},{"cat":"관용","items":["대가를 바라지 않고 베풀고 나누는 자세가 몸에 배어있으며, 찬구들의 잘못을 너그러이 받아들이는 아량이 있음.","차이를 있는 그대로 받아들이는 태도가 솔직하고 편견을 가지지 않음.","친구가 자신에게 잘못을 저질렀을 때 너그럽게 이해하고 포용하는 대범함이 있음.","자신의 기대에 어긋나는 일이 일어나도 인내심과 유연성을 갖고 받아들임."]},{"cat":"규칙준수","items":["학급 내에서 사소한 규칙도 잘 지키면서 타인과 정정 당당하게 경쟁하는 건전한 정신을 지니고 있음.","함께 정한 규칙을 잘 지키고 생각이 깊고 차분하며, 자주적인 학습 습관 및 생활 태도가 정착되어 있어 준비물을 잘 챙기고 자신의 주변을 스스로 정리할 줄 앎.","단체 생활의 규칙을 바르게 준수하고 주변 친구들과 원만하게 지내며 즐겁게 생활함.","매사 성실한 태도로 맡은 일의 끝맺음을 잘하고 약속을 잘 지키는 믿음직한 어린이임.","자기 자신을 포함하여 모든 사람을 똑같이 존중하고 학급에서 정한 규범을 존중하는 태도가 바람직함.","평소 학급의 규칙을 스스로 지키려는 태도가 바람직하며 올바른 언어 습관이 잘 형성됨.","학교 규칙을 잘 준수하고 맡은 일에 성실히 임함.","평소 웃어른을 공경할 줄 알고 인사성이 바르며, 규칙을 지키려 노력하는 점이 타의 모범이 되는 학생임.","학교 생활을 즐겁게 하지만 가끔 학급의 규칙을 잘 지키지 않는 경우가 있음.","규칙을 준수하는 태도를 함양 한다면 향후에는 모범적인 생활태도를 가진 학생으로의 변화가 기대되는 학생임.","학교의 여러 가지 규칙을 성실히 준수하며 주변 친구들과도 사이좋게 지냄.","학기초 친구들과 함께 정한 언어활동, 친구간에 지켜야 할 학급규칙을 잘 준수하는 성실한 어린이임.","학급 및 학교 규칙을 잘 수행하고 자기 과제를 성실히 함.","학급에서 지켜야 하는 규칙을 준수하기 위해 노력하며 이행하지 못했을 경우 그 책임을 기꺼이 지려는 태도를 가짐.","학급에서 지켜야 하는 규칙을 준수하기 위해 노력하며 이행하지 못했을 경우 발생할 수 있는 불이익을 겸허히 수용함."]},{"cat":"끈기","items":["자신에 대한 굳은 믿음을 바탕으로 어떤 어려움이 와도 잘 헤쳐 나가는 힘이 있음.","하나의 목표를 정하면 끝까지 포기하지 않고 목표한 바를 위해 노력하는 꾸준함이 돋보이는 학생임.","목표한 것을 이루기 위한 선택과 집중을 하는 것이 가능하며 지치고 힘든 순간에도 포기 하지 않음.","어떤 일을 이룰 때까지 자신의 모든 노력을 집중하고 성취하려는 의지를 가지고 있음.","공부 시간에도 적극적으로 손을 들고 발표하며, 하기 싫은 것이 있더라도 마음을 가다듬어 끈기를 가지고 해내려고 노력하는 모습이 향상되었음.","자신이 세운 목표에 전념하여 주위의 상황에 흔들리지 않고 초지일관 꾸준히 나아가는 자세를 지님.","힘에 부치거나 무섭더라도 옳은 일을 선택하여 쉽게 포기하지 않는 자세를 지님.","자신이 세운 목표에 전념하여 초지일관 꾸준히 나아가는 자세를 지님.","한 번 정한 목표를 이루기 위해 부단히 노력하는 모습이 타의 모범이 됨.","힘에 부치거나 장애물이 있더라도 옳은 일을 선택하며 쉽게 포기하지 않는 자세를 지님."]},{"cat":"나눔","items":["대가를 바라지 않고 베풀고 나누는 자세가 몸에 배어있음.","마음이 순수하고 정이 많아 힘이 약한 친구나 소외된 사람들을 도우려는 마음을 갖고 있어 다른 친구들에게 좋은 본보기가 되고 있음.","마음이 순수하고 정이 많아 힘이 약한 친구나 소외된 사람들을 도우려는 마음을 갖고 있으나, 표현하지 못하는 경향이 있음.","친구들을 위한 다양한 봉사활동을 통해 나눔의 소중한 가치를 깨닫고 적극적으로 나눔을 실천함.","친구에게 양보할 줄 알고 약한 친구를 도와주고 어려움을 함께 나누는 마음이 강함.","학습 준비물을 친구들과 잘 나누어 쓰고, 학급의 어려운 일을 솔선수범하여 처리하는 등 나눔의 정신을 실천하는 모범적인 어린이임.","해맑게 웃는 얼굴이 순수한 학생으로 반 친구들에게 친절하고 상냥하며 도와주기를 좋아하고 자신의 환경을 긍정적으로 이겨냄."]},{"cat":"배려","items":["다른 사람의 감정과 상황에 대해 신중히 생각하고 주의를 기울임.","친구를 소중히 여기며 배려할 줄 아는 고운 품성을 지님. 자신에게 주어진 일을 끝까지 해내고자 노력하며 관심 있는 분야에 대해 항상 탐구하는 자세를 가지고 있고 목표 의식이 뚜렷하여 앞으로의 발전이 기대되는 학생임.","다른 사람의 입장에 공감하고 따뜻한 마음을 품어 타인을 배려하는 마음이 있음.","다른 사람의 입장을 생각할 줄 아는 고운 성품을 지녔고 목표 의식을 바탕으로 진지한 모습이 보임.","학습태도가 바르고 언행이 고우며 명랑한 얼굴로 급우들에게 친절하게 대하는 등 타인을 위한 이해와 배려심을 가지고 있음.","다른 사람의 처지를 이해하고 공감할 수 있으며 따뜻한 마음을 바탕으로 타인을 배려하는 마음이 있음.","다른 친구들을 배려하고 생각하주는 따뜻한 마음을 가진다면 더 큰 사람이 될 수 있는 가능성을 지니고 있음.","말과 행동이 사려가 깊어 친구와 사이좋게 지내고 다른 친구를 위해 솔선수범하는 어린이임.","말과 행동이 차분하며 교실에서 생활하는 모습이 사려 깊고 이해심이 많아 친구들에게 인기가 좋음.","말과 행동이 침착하고 사려가 깊으며 다른 친구를 도와주는 등 따뜻한 성품을 지님.","매사에 긍정적이며 힘든 일에 대한 불만보다는 해결 방안을 먼저 생각하고 친구를 챙겨주는 태도가 바람직함.","웃어른을 존경할 줄 알며 인사성이 바르고 성품이 너그러워 친구의 잘못이나 아픔을 따뜻하게 이해해 주는 진지한 품성을 지닌 학생임.","이해심이 있어 친구의 입장에서 행동하고, 자기의 잘못을 인정하고 수정하여 행동하는 곱고 착한 마음씨를 지녔음.","자신의 감정을 절제하지 못하여 다른 사람의 입장을 고려하지 않고 행동할 때가 있으나, 학기 초에 비해 타인을 배려하고 존중하는 태도가 발전함.","자신의 감정을 절제하지 못하여 다른 사람의 입장을 고려하지 않고 행동할 때가 있으나, 모둠 활동을 통해 다른 사람을 배려하려는 노력이 엿보임.","자신의 방식만을 고집하지 않고 다른 사람의 생각과 의견을 존중함.","순수하며 여린 마음을 갖고 있고 친구들이 어려운 일을 당하면 자신의 일처럼 생각해주고, 걱정해주는 의리가 넘치는 학생임.","주위 사람이나 사물에 관심과 애정을 기울이는 자세가 돋보임.","친구가 어려움에 처했을 때 친구의 상황과 아픔을 이해하여 따뜻하게 대해 줌.","친구를 보살펴주고 스스럼없이 친구와 사이좋게 지내면서 학습활동을 잘 도와 줌.","학기 초에 비해 친구들을 배려할 줄 아는 마음과, 책임감을을 가지고 수업에 참여하는 태도가 눈에 띄게 좋아져 칭찬받을 만함.","학기 초에 비해 친구들을 배려할 줄 아는 마음과 학급을 위해 봉사할 줄 아는 태도가 눈에 띄게 좋아져 칭찬받을 만함.","배려심이 있고 귀 기울여 들을 줄 아는 태도를 가지고 있어 원만한 교우관계를 가지고 있으며 솔선수범하여 친구를 도와주려는 모습이 돋보이는 학생임.","친구들을 배려하며 모둠활동에 참여하고자 노력하며 자신에게 주어진 일을 끝까지 완성하려는 의지를 가지고 있어 앞으로 긍정적인 발전이 기대됨.","공감능력이 뛰어나 타인의 감정을 잘 알아채고, 적절한 말과 행동으로 위로하고 힘을 복돋아 줄 수 있는 재능을 갖고 있는 학생임.","사람들에게 상냥하고 부드럽게 대하며, 모둠 활동 시 경어체를 사용하며 상대방을 존중하고 배려하는 태도가 인상적임.","학습 태도가 바르고 언행이 고우며 명랑한 얼굴로 급우들에게 친절하게 대하는 등 타인을 위한 이해와 배려심을 가지고 있음."]},{"cat":"봉사","items":["도움이 필요한 친구들을 적극적으로 돕고, 학급 내에서 봉사정신이 투철하여 모든 일에 솔선수범하는 타에 모범이 되는 학생임.","마음이 순수하고 정이 많아 힘이 약한 친구나 소외된 사람들을 도우려는 마음을 갖고 있어 다른 친구들에게 좋은 본보기가 되고 있음.","자신이 가지고 있는 것을 타인에게 베풀기를 잘 하고 이것을 통해 행복감을 느낄 줄 앎.","봉사정신이 탁월한 학생으로 다른 친구들이 꺼려하는 청소나 교사의 도움 요청을 손 걷어붙이고 앞장 서서 적극적으로 해결하려는 모습이 기특함.","자신이 가지고 있는 것을 타인에게 잘 베풀며 도움이 필요한 친구를 자신의 일처럼 잘 도와주는 배려심이 있는 학생임.","학급의 어려운 일을 솔선수범하여 처리하고 나눔의 정신을 실천하는 모범적인 어린이임."]},{"cat":"성실","items":["계획을 수립하여 단계적으로 차근차근 해결해 나가는 꾸준함과 성실함이 있음.","꾸준히 노력하는 태도가 바람직하며 목표를 이루기 위해 부단히 애쓰는 면이 타의 모범이 됨.","단계적으로 차근차근 해결해 나가는 꾸준함과 성실함이 있음.","자신이 정한 목표에 다다르기 위해 꾸준히 노력하는 태도가 돋보임.","자신이 한 약속을 지키고 주어진 일에 최선을 다하므로 무슨 일이든 믿고 맡길 수 있음.","근면 성실하고 매사에 협조적이고 급우도 잘 도우며, 주어진 역할에 끝까지 책임을 다하려는 노력이 꾸준함.","배움공책을 성실하게 작성하여 양과 질 모두 다른 사람의 모범이 될 정도로 돋보임.","성실한 태도로 자신의 일을 잘 수행하는 어린이로 수업에 바른 자세로 임하고, 목표를 가지고 꾸준히 노력하여 전 교과 성적이 우수함.","인사성이 바르고 자신이 맡은 일을 부지런히 실천해 다른 친구들의 모범이 됨.","수업에 대한 집중력이 높고 학습에 대한 성실한 태도를 보이며 각종 학업에 대한 책임감이 뛰어남","학습할 때는 언제나 최선을 다하는 자세를 가지고 있으며, 과제나 시험을 위해 꾸준히 노력하는 모습을 보임.","주어진 과제나 목표를 달성하기 위해 끈기와 인내심을 가지고 열심히 노력하는 학생임","성실함을 바탕으로 한 뛰어난 학업 성과는 주변 친구들 사이에서도 높은 평가를 받고 있음.","학습에 대한 성실함이 모범이 되어 다른 학생들에게도 영향력을 미치며, 항상 예의 바른 태도와 참신한 아이디어로 동료들에게 영감을 주는 모습을 보여줌."]},{"cat":"소신","items":["가치 있다고 여기는 대상에 대하여 뜻을 굽히지 않으며, 주위 환경에 쉽게 휩쓸리지 않고 자신의 주관에 따라 판단하고 신중하게 행동하는 결단력이 돋보이는 학생임.","무엇이 옳고 무엇이 옳지 않은지를 판단할 수 있고 매사 긍정적이고 자신감에 넘침.","무엇이 옳고 무엇이 옳지 않은지를 판단할 수 있고, 옳은 일에 대해서 자신의 생각을 굽히지 않는 결단력이 있음.","이루고자 하는 일에 집중하고 관심의 초점이 분명함.","자신에 대한 통제력을 토대로 하여 자신이 어떻게 행동할 것인지에 대해 명확하게 판단할 수 있음.","자신이 원하는 것을 하기 위해 수동적으로 반응하기보다 스스로 자신의 행동을 선택해서 통제함.","주위 환경에 쉽게 휩쓸리지 않고 자신의 주관에 따라 판단하고 행동하는 결단력이 돋보이며, 한 번 정한 목표에 도달하기 위해 끊임없이 노력하는 뚝심이 있는 학생임."]},{"cat":"비판적 사고력","items":["어떤 문제든지 다양한 측면에서 생각해보는 비판적 사고력이 뛰어난 학생으로 논리와 근거의 헛점을 잘 찾아냄.","새로운 것을 상상하고 고안하는 힘이 뛰어나 문제를 새로운 시각에서 해석하고 풀어내는 능력이 돋보임.","다양한 관점을 고려하여 문제를 분석하고 해결하는 능력이 뛰어나며, 학습 과정에서 주어진 내용에 대해 깊게 생각하고 의문을 제기하여 참신한 아이디어를 제시함.","자신의 의견을 논리적으로 뒷받침하며 타당한 주장을 전개하는 데에도 능하고, 주어진 상황을 분석하여 논리적인 결론을 도출하는 능력을 보여줌.","학교 수업에서도 질문을 주도적으로 하며 교사와 함께 토론하고 논쟁을 통해 학습의 질을 높이는 데 기여함.","비판적 사고와 분석력을 바탕으로 주어진 주제에 대해 깊게 탐구하며 새로운 지식을 습득하는 능력이 뛰어남.","문제 해결 능력과 창의적 사고력을 통해 다양한 시각을 통해 문제를 접근하고 해결하는 능력을 보여줌.","다양한 독서로 상식이 풍부하고, 이를 바탕으로 일반적인 생각과는 다른 논리적 비판력이 돋보이는 글을 잘 씀."]},{"cat":"신뢰","items":["기본적인 학습규칙을 잘 이행하려고 노력하며, 자신이 정한 목표를 이루기 위해 성실하게 정진하는 태도가 바람직한 학생임.","말과 행동이 일치하고 자신의 역할을 충실하게 수행하여 주위 친구들로부터 신뢰가 있는 학생임.","말과 행동이 일치하며 가장 가치 있는 것이 무엇인지를 알고 그에 따라 행동함.","말과 행동이 침착하고 사려 깊으며 시간을 유익하게 잘 활용함.","매사에 준비하는 자세가 정착되어 있으며 맡은 일의 끝맺음을 잘함.","거짓이 없고 진실하며 꾸밈없이 행동하며 인정도 많아 급우와의 사이가 좋음.","솔직하고 믿음직한 태도를 바탕으로 신뢰를 쌓는 행동을 함.","스스로 맡은 일을 잘 처리하며 무슨 일이든 열심히 하는 태도를 가졌음.","시간을 효과적으로 활용하고 스스로 공부하는 태도가 양호함.","자신의 말을 지키고 최선을 다하여 믿고 맡길 수 있도록 행동함.","자신이 믿는 바를 지키기 위해 노력하며 한결같은 마음으로 상대방을 대함.","자신이 불리한 경우에도 거짓말을 하지 않고 말과 행동이 참됨.","자신이 한 약속을 지키고 주어진 일에 최선을 다하므로 무슨 일이든 믿고 맡길 수 있음.","친구들에게 화를 잘 내지 않고, 이해해 주려고 노력하며, 진실한 마음으로 대화를 나누는 모습으로 친구들에게 신뢰가 높음.","모둠에서 맡은 역할을 다하려고 노력하며, 사소한 약속이라도 중요하게 여기며 지키려고 노력함."]},{"cat":"열정","items":["매사에 의욕이 강하고 자신감이 넘치며, 많은 친구와 사귀고 공동의 일에 적극적으로 참여함.","관심있는 것에 온 마음과 힘을 쏟아 집중하며 그 과정에서 즐거움과 행복함을 느낄 줄 앎.","무엇이든 욕심을 가지고 열심히 하려는 태도가 돋보이는 학생으로 성취욕구가 강하여 앞으로의 발전이 기대됨.","온 마음과 힘을 쏟아 일을 해결하며, 목표를 달성할 때 느끼는 성취감을 즐김.","평소에 명랑 쾌활한 성격으로 적극적인 자세로 행사활동에 참여하며 교우관계에서 신뢰가 두터움."]},{"cat":"자율","items":["매사에 솔선수범하고 자기에게 주어진 일에 대해 보다 능동적인 태도를 가지고 노력함.","수업 태도와 학습 의지가 높아 자율적으로 학업에 집중하며 주어진 과제를 완벽히 수행하는 학생임.","선생님의 지시나 동기부여를 받지 않고도 스스로 목표를 설정하고 그에 맞춰 계획을 세워 학습에 임함.","친구들과의 관계에서도 자율적으로 행동하며 서로를 존중하고 배려하는 마인드를 가지고 있어 학교에서 모범적인 모습을 보여주고 있음.","학습에 대한 자율성을 갖추고 있는만큼 학교 생활에서도 자유로운 의사 표현과 행동을 보이며, 독립적이고 책임감 있는 모습을 보여줌.","다른 학생들의 의견이나 다양한 의견을 존중하며 학교 생활에서도 자율적인 태도를 유지함.","학습에 있어서 선생님의 도움을 받지 않아도 스스로 문제를 해결하고 어려움을 극복하는 자기 해결 능력이 뛰어남.","자신이 원하는 것을 하기 위해 수동적으로 반응하기보다 스스로 자신의 행동을 선택해서 통제하며, 부족한 부분을 반성하고 보완하여 앞으로의 성장이 더욱 기대됨."]},{"cat":"적극성","items":["말이 많은 편은 아니지만 해야 할 말은 분명하게 하고 있으며 발표를 찾아서 하지는 않지만 발표의 기회가 주어질 경우 자신의 생각과 의견을 적극적으로 피력함.","모든 일에 진취적이며 자신감이 많아 학교생활을 매우 즐겁게 함.","수업시간에 다소 산만한 경향이 있으나 발표 및 대답의 기회가 자주 제공됨에 따라 학습 내용을 잘 이해하기 위해 노력하는 태도가 많이 향상되었음.","수업시간에 발표를 잘 하며, 각종 과제물 수행을 우수하게 하기 위한 노력으로 교사의 의도를 수시로 확인 하는 등 학습 전반에 적극적으로 참여함.","수업시간에 소극적이었으나 현재는 과거에 비해 적극적으로 참여하고 있음.","수업시간에 손을 들고 발표의 기회를 요구하는 행동은 적으나 담임교사의 질문에 적절히 대답할 줄 앎.","수업시간에 손을 들고 발표의 기회를 요구하는 행동은 적으나 담임교사의 질문에 적절히 대답하고 수학 교과의 경우 핵심을 파악하는 것에 적극적으로 활동 함.","수업시간에 손을 들고 발표의 기회를 요구하는 행동은 적으나 담임교사의 질문에 적절히 대답하고 의견을 논리적으로 설명함.","수업시간에 적극적으로 발표 및 질문에 참여하고 교실 청소 역시 성실히 수행함.","수업시간에 적극적으로 참여하며 대답과 발표를 자신감 있는 목소리로 크게 함.","무엇이든 욕심을 가지고 열심히 하려는 태도가 바람직하며 성취욕구가 강하여 앞으로의 발전이 기대됨.","수업시간에 적극적으로 참여하며 핵심을 간파하는 질문과 대답을 많이 함.","초등학생 답지 않게, 사회 현상에 전반에 관심이 많고 그 관심이 사회, 과학 과목에 대한 동기로 이어져 자신이 좋아하는 단원에 대한 몰입력이 대단한 학생임.","수업시간에 적극적으로 발표에 임하며, 학습 전반에 능동적으로 참여해 높은 수준의 결과물을 만들어 냄.","자신이 관심있는 부분이 생기면 놀라운 집중력과 적극성을 보이며, 뛰어난 능력을 보여줌","자신이 관심있는 부분에 대해선 놀라운 집중력과 적극성을 보이며, 몰입하는 능력이 뛰어남.","학기 초에 비해 수업에 참여하는 적극성이 높아졌으며, 발표를 통해 자신의 생각을 조리있게 표한함.","전 교과에서 도드라지는 적극성을 보이며 특히 발표를 포함하여 각종 말하기 시 논리력이 뛰어나고 담화에 설득력이 있음."]},{"cat":"절제","items":["해야 할 일에 대한 정확한 이해를 바탕으로 자신의 미래를 위해 욕구를 지연하는 것이 가능함.","학습 태도가 매우 진지하고 꾸준하며 언제나 자기 자신을 돌아보며 더 나은 방향을 찾아가려는 의지를 가지고 있음.","즉흥적인 판단보다는 체계적으로 문제를 분석하고 해결하는 능력을 갖추고 있어 교과 학문에서 높은 성취도를 보임.","교우 관계에서도 감정적인 충동보다는 상대의 입장을 이해하고 배려하는 자세를 가지고 있어 동료들과의 원활한 소통을 이끌어내고 있음.","항상 자기 통제를 잘 하며 타인에게 영향을 받지 않고 자신의 가치관을 지키려는 의지를 보이는 모범적인 학생임.","과제에 대한 완성도가 높고 자기 관리 능력이 탁월하여 학업에 전념하고자 하는 의지를 보여줌.","학교 생활에서의 모범적인 모습과 규칙 준수에 대한 믿음을 가지고 있어 교사와 학우들 사이에서 큰 신뢰를 받고 있음.","하고 싶은 것과 해야 하는 것을히 구분하여 행동할 수 있으며 자기 통제력이 양호함."]},{"cat":"정리정돈","items":["주위가 체계적으로 정리되도록 주변을 조화롭고 가지런하게 유지할 줄 암.","자신의 주위가 체계적으로 정리되도록 주변을 조화롭고 가지런하게 유지함.","용의 복장이 단정하고 주위를 깨끗하게 정돈하고 깔끔한 성격임.","주어진 일을 계획을 세워 실천하고 맡은 일에 최선을 다하며, 주위가 체계적으로 정리되도록 정돈함.","자신이 맡은 1인 1역할을 성실하게 수행하며, 다른 친구들의 일도 자기 일처럼 도와줌."]},{"cat":"존중","items":["자신을 낮추면서도 다른 친구의 의견을 귀담아 듣고 수용할 수 있는 아량이 돋보이는 학생임.","자신이 속한 집단의 규범을 존중하고 친구를 귀하게 여겨 보호해줌.","친구와의 약속과 우정을 소중히 여기며 모둠 활동에서 양보하고 배려하는 태도를 가지고 있어 활동을 원만히 수행함.","항상 상대방을 배려하고 양보하는 자세를 보여주며, 친구들과의 갈등 상황에서도 서로를 존중하고자 노력하였음.","존중하는 자세로 타인과의 관계를 유지하며, 학교 안에서도 친구들에게 배려와 존중을 보여주는 모범생임.","친구들에게 상담이나 도움을 요청할 때에도 상대방의 의견을 존중하며, 그에 맞는 조언을 해주려고 노력하였음.","나와 의견이 다르다고 해서 멀리하는 것이 아니라 모두가 합의할 수 있는 방법을 찾음으로써 신뢰를 받음.","토의활동을 할 때 다른 사람의 입장에서 생각하고 말하며 소수의 의견도 존중하는 태도를 지니고 있음."]},{"cat":"창의성","items":["문제 상황에 부딪쳤을 때 기지를 발휘해서 이를 해결하는 재치가 돋보임.","남들과는 다른 창의적 사고력을 가져, 문제상황에 조우했을 때 남들과는 다른 색다른 방법으로 문제를 해결해 냄.","새로운 것을 상상하고 고안하는 힘이 뛰어나, 문제를 새로운 시각에서 해석하고 풀어내는 능력이 돋보임.","어려운 일에 가끔씩 기발한 생각을 내어 잘 해결함.","지적 탐구심이 강하고 상상력이 풍부함. 특히, 수학·과학 분야에서 탁월한 능력을 가지고 있으며 생각이 창의적이고 열린 사고가 돋보임","새롭고 낯선 내용이나 활동에 대하여 두려움 보다는 깊은 호기심과 탐구심을 가지고 주저 없이 질문하는 적극적인 태도를 보임.","새롭고 낯선 내용이나 활동에 대하여 두려움 보다는 깊은 호기심과 탐구심을 가지고 주저 없이 질문하는 적극적인 태도를 보이며 창의적인 아이디어를 구상하여 표현하는 능력이 뛰어남.","다른 사람들과는 다른 창의적 사고능력을 갖춘 학생으로, 사고의 독창성이 뛰어남.","진실을 말하되 상대방의 심정을 고려하여 친절하고 부드럽게 표현하는 능력이 뛰어남.","책임","맡은 일을 책임감 있게 잘 수행하고 모든 일에 모범을 보임.","무슨 일이든 맡은 일을 훌륭하게 해냄으로써 타인으로부터 신뢰를 얻고 있음.","무슨 일이든 조금 느리기는 하지만 끝까지 최선을 다하여 훌륭하게 마무리하는 태도를 가지고 있어, 앞으로가 기대되는 학생임.","무슨 일이든 조금 느리기는 하지만 끝까지 최선을 다하여 훌륭하게 마무리하는 태도를 가지며 긍정적이고 차분하여 친구들과 잘 어울림.","아직 한국말이 서툰데도 불구하고, 성실한 태도로 자신의 일을 잘 수행하는 어린이로 수업에 바른 자세로 임하고 성실히 노력하여 전 교과 성적이 우수함.","성실한 태도로 자신의 일을 잘 수행하는 어린이로 수업에 바른 자세로 임하고 성실히 노력하여 전 교과 성적이 우수함.","자기가 해야 할 일을 성실히 수행하고 모둠 친구들이 잘 할 수 있도록 옆에서 독려함.","자기의 행동에 끝까지 책임을 지며, 맡은 일을 최선을 다해 잘 하기 위해 노력하는 모습을 보임.","끈기를 가지고 주어진 과제를 항상 열심히 해내려고 노력하며 이해력, 논리적 사고력, 비판적 사고력이 뛰어남.","주어진 일을 끈기 있게 해결하고 작은 일에도 최선을 다함.","주어진 일을 끝까지 책임감있게 해결하고, 스스로 맡은 일을 잘 처리하며, 무슨 일이든 열심히 하는 태도를 가졌음.","맡은 바 역할을 성실하게 수행하면서도 도움이 필요한 친구들을 잘 돕는 등 책임감이 강한 학생임.","학습내용에 대한 성취의욕이 있어 전 교과 성적이 많이 발전함.","학습을 꾸준히 인내심을 갖고 하려는 태도가 부족하여 과제를 대강 해오거나 마치지 못하는 경우가 있으므로 꾸준한 과제 해결 태도가 필요함.","항상 용모가 단정하고 차분한 성격으로 조용히 자신의 할 일을 마무리하는 어린이로 수업 태도가 항상 바르며 그리기 및 악기 연주에 재능이 돋보임.","긍정적인 에너지가 많고 활동적이며 자신이 할 일을 잊지 않고 책임감 있게 행동하기 위해 노력함.","수업 중 교사가 제시하는 과제를 해결하기 위해 노력하며 책임감 있게 행동함.","수업 중에 교사가 제시하는 과제를 해결하기 위해 노력하고 성취 수준도 훌륭함.","본인의 역할을 제대로 수행하기 위해 노력하며 수행능력이 탁월함.","본인이 말 한 것에 대해 약속을 지킬 줄 앎."]},{"cat":"친절","items":["사람들에게 상냥하고 부드럽게 대하며, 친구와 마찰이 생겼을 때 나의 주장을 내세우기보다 상대방의 말을 수용해주고 받아들이는 아량이 있어 큰 다툼 없이 문제를 원만하게 해결함.","친구들에게 배려심을 보여주고 친구들에게 도움이 되는 일을 잘 함.","친구들에게 친절을 베풀고 친구들에게 도움이 되는 일을 잘 함.","항상 주변 어른들께 밝고 공손히 인사하는 모습이 돋보이며, 학교 생활의 모든 활동에 최선을 다하여 성실히 참여함.","차분하고 다정다감한 성품으로 언제나 작은 미소로 모두에게 친절하게 대하며, 웃어른들에게 항상 예의 바르고 공손하게 행동함.","웃어른께 예의가 바르고, 모든 일에 열정적으로 참여함.","친구의 작은 부탁도 소홀이 여기지 않고 잘 들어주며, 주변 모든 사람들에게 항상 친절하게 대함."]},{"cat":"타인존중","items":["남의 의견을 존중할 줄 알며 단체 활동에 적극적인 태도를 지녔음.","남의 의견을 존중할 줄 알며 단체 활동에 참여하는 태도가 양호하고 교우관계가 원만함.","말씨가 차분하고 남의 의견을 존중할 줄 앎.","성격이 부드러워 웬만한 일에는 다툼을 벌이지 않는 어른스러운 모습을 지니고 있음.","자신과 모습이나 생각이 달라도 서로를 존중해 가면서 함께 살아가야 한다는 사실을 알고 바르게 실천함.","자신과 주변의 상황을 생각하며 행동하는 능력이 다소 미흡하여 자기 주장이 강하나, 다른 사람의 입장에서 생각하려는 노력이 엿보임.","단체 생활의 규칙을 바르게 준수하고 자신이 맡은 역할에 성실히 임함.","자신을 낮추면서도 다른 친구의 의견을 귀담아 듣고 수용할 수 있는 아량이 돋보이는 학생임.","자신이 속한 집단의 규범을 존중하고 친구를 귀하게 여겨 보호해줌.","차분하고 다정다감한 성품으로 언제나 작은 미소로 모두에게 친절하게 대하여 친구들에게 신망이 두터운 학생으로 수업 시간에 바른 자세로 참여함.","친구들과 갈등을 겪은 후 자신의 잘못을 반성하고 친구를 배려하는 마음을 가지려고 노력함.","타인에게 대하는 태도가 상냥하고 몸가짐이 공손함.","다정 다감한 성품으로 주변 친구들과 잘 어울리며, 다른 친구들을 존중하고 배려하는 태도를 갖추고 있음.","평소 학급에서 잘 어울리지 못하는 친구를 도와주는 등 주변을 돌볼 수 있는 마음을 가져 다른 친구들의 모범이 됨."]},{"cat":"협력","items":["친구들과 서로 힘을 합쳐 어려운 일도 함께 해내는 태도가 바람직함.","기본적인 학습 규칙을 잘 지키고 모둠 토의 학습에도 매우 적극적으로 참여함.","다른 사람들을 도울 줄 아는 착한 마음씨와 웃어른을 진심으로 따르는 모습이 칭찬받을 만함.","모둠토의학습에 잘 참여하며 주변 정리 정돈을 바르게 하려고 노력함.","모둠활동, 발표대회 등에서 각자의 역할을 합리적인 방법으로 나누고 부진한 부분에 대해 솔선하여 이를 개선하는 등 급우들의 관계를 잘 조율하는 모습이 돋보임.","모둠활동에서 각자의 역할을 합리적인 방법으로 나누고 부진한 부분에 대해 솔선하여 이를 개선하는 등 급우들의 관계를 잘 조율하는 모습이 돋보임.","모둠활동에서 친구들과 함께 도와가며 적극적으로 참여하고 친구들을 배려하며 협동하여 좋은 결과를 성취함.","모든 일에 솔선수범하며 협력학습 활동에 적극적으로 참여함.","역할 분담 활동을 성실히 수행하고 다른 사람의 입장을 잘 이해(의사결정능력)말을 조리 있게 잘 하며, 생활 주변 현상에 대해 남다른 관심을 가졌으며 매사 진취적임.","적극적인 성격으로 친구들과 사이좋게 어울리며 친구들 사이에서 믿음과 신뢰를 왔지만 쾌활하고 사교성이 뛰어나서 주변 친구들과 잘 어울리며, 다른 친구들을 잘 배려하고 이해하는 학생임.","언어적 이해력과 표현력이 뛰어나 자신의 생각과 느낌을 시나 짧은 글로 구체적이고 생생하게 표현해 냄.","새로운 도전을 받아들이고, 어려운 상황에서도 긍정적인 자세로 문제를 해결해 나가는 학생임.","수리적 문제해결 능력이 뛰어나며, 복잡한 문제들도 체계적으로 분석하여 해결하는 데 능숙함.","체육활동에서 높은 지구력과 협응력을 바탕으로 팀원들과 함께 목표를 달성하는 모습이 인상적임.","예의 바르고 공손한 태도를 갖추어 다른 사람들과의 대화에서도 능숙하게 의사소통을 하고 있음.","밝고 톡톡 튀는 성격으로 주변 친구들에게 활력소가 되며 학급에 긍정적인 분위기를 전달하는 학생임.","배움공책을 성실하게 작성하고 배운 내용을 체계적으로 정리하는 능력이 뛰어남.","논리력과 사고력이 뛰어나 문제의 핵심을 파악해 문제를 해결함.","독후 활동으로 독서록을 성실하게 작성하고, 배운 내용을 체계적으로 정리하는 능력이 뛰어남.","사교적이고 붙임성 있는 성격으로 친구들과 소통을 원활히 하며, 항상 밝고 긍정적인 태도로 주변을 이끄는 학생임.","좋아하는 분야의 과제에 몰입하는 능력이 뛰어나며, 깊은 관심과 열정으로 주어진 과제를 완수함.","역사적 사실에 대한 지식이 풍부하고, 학습에 대한 열정이 높음.","리더쉽을 가지고 주변 친구들을 아우르기 위해 노력하며, 다른 친구의 의견을 존중함.","새로운 도전을 받아들이고, 어려운 상황에서도 긍정적인 자세로 문제를 해결해 나가는 모습이 인상적임.","학급의 규칙을 잘 준수하고, 매사에 성실한 태도를 보여주는 학생임.","창의적인 사고력을 발휘하여 다양한 재료로 자신만의 작품을 만들어 냄.","사교성이 좋아 친구들과의 소통에서도 적극적인 모습을 보이며, 협력적인 태도로 갈등 상황을 원만하게 해결하는 데도 능력을 발휘함.","수리적 사고력이 뛰어나 높은 성취도를 보여주며, 계산 문제를 능숙하게 해결함.","또한, 체육활동에 적극적으로 참여하며 건강한 생활습관을 가지고 있음.","새로운 아이디어를 제시하며 토의에 적극적으로 참여하며, 자신의 생각을 능숙하게 발표함.","학급 내에서 사소한 규칙도 잘 지키면서 타인과 정정 당당하게 경쟁하는 건전한 정신을 지니고 있음.","다양한 채색 도구를 활용하여 자신만의 표현력을 발휘하며, 창의적인 작품을 완성하는 능력이 뛰어남.","다양한 주제에 대한 지식과 통찰력을 보유하고 있으며, 문제해결력이 특출남.","자신의 생각을 글로 표현하는 능력이 성장함.","주변 친구들을 배려하고 존중하는 모습을 보이며, 학급에 긍정적인 영향을 끼치고 있음.","자신의 생각과 느낌을 그림으로 표현하는 능력이 뛰어나며, 창의적인 아이디어를 제시하는 데에도 능숙함.","모둠 활동 시 리더십과 팀워크를 발휘하여 공동의 목표를 향해 노력하는 모습이 인상적임.","또한 예술 활동에서 창의적이고 감각적인 면모를 보이고 있음.","어떤 일이든지 책임감을 가지고 끈기있게 해결하는 모습이 인상적임.","친구들을 배려하고 존중하는 태도를 가지고 있어, 친구들 사이에서 인기가 있음.","관심있는 분야에 집중하고 몰입하여, 끝까지 노력하는 모습이 인상적임.","창의적인 생각을 바탕으로 문제를 해결하는 데 뛰어난 능력을 보임.","모둠활동에 적극적으로 참여하여, 친구들과의 협력을 통해 공동의 목표를 성취하기 위해 노력함.","친구들과 함께하는 놀이 활동을 즐기며, 주변 친구들을 배려하고 존중하는 태도를 가지고 있음.","예의 바르고 웃어른을 공경하며, 주변 친구들에게 긍정적인 영향을 주고 있음.","공손하고 예의 바른 태도로 학교 생활을 하며, 선생님과 친구들에게 좋은 인상을 주는 학생임.","주어진 과제를 성실히 수행하며, 끝까지 끝내는 끈기와 인내력이 뛰어난 학생임."]},{"cat":"추가문장풀(완성 예시)","items":["기본적인 학습 습관이 잘 잡혀 있고 수업에 있어 성실하게 참여하는 태도가 돋보이며 무엇이든 끈기 있게 완수하는 학생임. 특히 주변 정리 정돈에 능하며, 자신의 물건을 잘 관리하는 모습이 타의 모범이 됨. 말수가 많은 편은 아니나 토의 등에서 자신의 의견을 낼 때는 근거를 들어 전달력 있게 이야기할 줄 알며, 문제 해결 과정이 어렵더라도 침착하게 다시 생각하는 시간을 갖고 스스로 해내려는 모습이 매우 기특함. 신체 활동을 즐기고 운동 기능이 뛰어나 체육과의 모든 수업에 즐겁게 참여함. 차분한 성품으로 모둠 활동이나 부서 활동에서 자신에게 주어진 역할에 책임감을 가지고 해내는 모습을 보여주었으며, 무엇이든 믿고 맡길 수 있는 성실한 자세를 지니고 있음. 다른 사람의 일에 공감할 줄 알고 배려심이 있으며, 성별을 가리지 않고 친구들과 두루 잘 어울림.","매사에 밝고 유쾌한 성품으로 교실에 활기를 주는 학생이며, 특유의 재치와 함께 사교성이 뛰어나 친구들과 잘 어울림. 때로는 장난이 지나쳐 친구들과의 갈등이 발생할 때도 있지만 자기가 잘못한 일을 솔직하게 말하고 반성하는 훌륭한 태도를 지님.호기심이 많고 틀에 박히지 않은 다양한 아이디어를 많이 생각하며 학급의 크고 작은 일에 적극적으로 참여함. 특히 거의 매시간 발표에 참여할 만큼 수업 중 뛰어난 발표력을 보여주며, 모르는 것을 부끄러워하지 않고 적극적으로 해답을 찾아 질문할 줄 앎. 학년도 초에 과제를 미루는 경향이 다소 있었으나 교사의 조언을 듣고 능동적이고 성실하게 해결하려는 노력을 보여주었기에 앞으로 더욱 크게 발전할 것으로 믿음. 기본적으로 운동신경이 좋아 자신의 기량을 나타낼 수 있도록 체육활동에 열심히 참여하였으며, 특히 티볼 활동에서 민첩성과 순발력을 보여줌.","함께 정한 규칙을 잘 지키고 생각이 깊고 차분하며, 자주적인 학습 습관 및 생활 태도가 정착되어 있어 준비물을 잘 챙기고 자신의 주변을 스스로 정리할 줄 앎. 특히 글자체가 무척 정갈하고 필기를 꼼꼼히 하는 장점이 돋보임. 공감 능력과 배려심이 있고 정이 많아 어려움에 처한 친구를 잘 도와주며, 학급의 크고 작은 행사에 성실하게 임함. 집중력 있게 수업에 참여하고 항상 주어진 과제를 최선을 다해 해결하는 모습을 보여줌. 평소 적극적으로 발표에 나서지는 않으나, 기회가 주어졌을 때 학급 친구들 모두가 공감할 만큼 멋지게 발표하는 모습을 보여주었기에 앞으로 사람들 앞에 서는 것에 자신감을 가지고 능동적으로 나선다면 더욱 훌륭히 성장할 것임.다른 사람의 의견을 존중할 줄 알기에 단체 활동에 있어 친구들과 원만한 관계를 이루며 참여함.","평소 인사성이 바르고 웃어른에 대한 예의를 지키는 모습이 타의 모범이 되며, 온화하고 긍정적인 성품으로 친구들과의 사귐이 원만함. 가끔 수줍어하는 모습은 남아 있으나 일 년 동안 한층 성장한 모습으로 본인이 원하는 바를 또렷하게 말할 수 있는 용기가 생겼음. 학업에 있어 부족하다고 느끼는 과목을 꾸준히 복습하며 학년 초에 비해 학업 성취도가 눈에 띄게 향상되었으며 그만큼 자신감도 커진 점이 무척 대견한 학생임. 다만 주어진 과제를 미루는 경향이 다소 있기에 앞으로 스스로 계획하여 성실하게 과제를 수행하는 습관을 기른다면 더욱 성장할 것임. 기초생활 습관이 바르게 형성되어 있어 한 번 정해진 규칙은 끝까지 잘 지키고 주변 정리 정돈을 잘함. 배려심이 남달라 주변에 도움이 필요한 친구나 학급에 봉사가 필요할 때 주저하지 않고 손길을 내미는 따뜻한 마음을 지니고 있음.","기초 학습이 탄탄하여 교과 문제 해결력이 뛰어나며, 이해력과 논리적 사고력이 높아 학업 성취도가 고루 우수한 편임. 특히 본인이 가진 수 감각과 연산 능력으로 수학과 전 영역의 성취도에 있어 좋은 결과를 보여줌. 일 년간 한 번도 과제를 기한 안에 제출하지 않은 적이 없을 만큼 주어진 과제를 미루지 않고 성실하게 해내는 모습이 타의 모범이 되며, 기본 생활 습관도 잘 잡혀 있어 주변 정리 정돈에 능함. 모둠 활동에서 대표자로서 책임 있는 역할을 하는 것에 주저함이 없으며 특유의 온화한 리더십이 있어 주변 사람들을 끌어당김. 밝고 긍정적인 학생으로 타인에 대한 배려심이 깊고 공감 능력이 남달라 남녀를 가리지 않고 교우 관계가 매우 원만함. 학급에 도움이 필요한 상황이 있다면 선뜻 나서는 봉사 정신을 지닌 훌륭한 학생임.","기본적인 이해력과 사고력이 좋아 학업 성취도가 전반적으로 양호하며 수업 태도 또한 성실함. 특히 어휘력이 풍부하고 자신이 생각한 것을 글로 나타내는 능력이 무척 뛰어나기에 이러한 장점을 꾸준히 개발시켜 나가면 좋겠음. 발표를 할 때 목소리를 작게 하여 전달력이 떨어지는 경향이 다소 있으므로 앞으로 자신감을 가지고 능동적으로 자신의 의견을 이야기한다면 더욱 큰 발전이 있을 것임. 손재주가 좋고 섬세하며 표현 능력이 뛰어나 재료의 특성을 살려 만들기를 잘함. 학기 초 변화된 환경에서 적응해 가는 시간이 걸리기는 했지만, 특유의 침착하고 사려 깊은 행동으로 자신과 맞는 친구들과 긍정적인 상호작용을 하며 잘 어울리는 모습을 보여줌. 학업이나 생활 태도 전반에 있어 또래보다 성숙한 의식을 보여주며, 추진력이 있고 의지가 강하여 한 번 정한 목표를 미루지 않고 끝까지 실천해 내는 모습이 돋보이는 훌륭한 학생임.","호기심이 많고 쾌활하여 학교생활을 즐겁게 하며, 무엇이든 주어진 것을 끈기 있게 완수하는 능력이 있고 성실하게 임하는 자세가 훌륭함. 수업 시간에 가끔 주의 집중력이 흐트러질 때가 있으나 학년 초에 비해 학업에 대한 의욕이 증가하여 과제를 성실하게 해결하고, 학습 태도도 안정적으로 바뀌면서 모든 면에서 크게 발전한 점이 무엇보다 칭찬할 만함. 낙천적이며 유머를 아는 학생으로 주변 친구들을 끌어당기는 매력이 있어 교우 관계가 원만함. 잘못된 행동을 인정하고 먼저 사과할 줄 아는 용기가 있으며, 도움이 필요한 친구가 있다면 먼저 나서서 도와줄 줄 아는 성품을 지님. 기본적으로 운동 신경이 좋고 활동적이며 민첩성과 순발력이 있어 특히 구기 운동 종목에서 우수한 실력을 보였으며, 평소 늦게까지 축구 훈련과 연습에 열심히 매진할 만큼 축구에 대한 열정이 남다르기에 이 방면으로 눈부신 성과가 기대되는 학생임.","기초 학습이 탄탄하고 이해력과 문해력이 뛰어나 전 교과 학업 성취도가 고루 우수함. 특히 수업 중 발표를 무척 잘하며, 모든 수업과 학급의 행사에 누구보다 성실하게 참여는 태도가 칭찬할 만함. 학급에서 주도적인 역할을 도맡다 보니 모두를 좋은 방향으로 이끌려는 과정에서 다소 직선적으로 말을 하여 갈등을 빚을 때가 있었으나, 가정과 학교의 관심 속에서 친구들에게 말을 둥글게 하려 노력하고 변화하는 모습을 보여준 점이 무엇보다 훌륭함.사교성이 좋아 남녀를 가리지 않고 두루 잘 어울리며, 교사와 친구들에게 신망이 두터움. 다만 주변 정리 정돈이 다소 미흡한 면이 있으므로 앞으로의 성장을 위하여 생활 습관을 개선한다면 더욱 크게 발전할 것임. 뛰어난 운동 신경을 보이며 자신의 기량을 나타낼 수 있도록 체육 활동에 적극적으로 참여하였으며, 특히 티볼 활동에서 민첩성과 순발력을 보여줌. 공동체를 이끄는 타고난 통솔력을 갖추고 있으며, 추진력이 있어 한 번 공동의 목표가 정해지면 주변을 독려하며 성취해내기에 앞으로의 성장이 무척 기대됨.","기본 생활 습관과 학습 습관이 잘 잡혀 있고 교과 문제 해결력이 돋보이며, 어휘력과 문장 구사력이 좋고 논리적으로 사고할 줄 알기에 학업 성취도가 고루 우수한 편임. 수업 중 집중력이 높고, 적극적으로 수업에 참여하며 사교성이 있어 대부분의 친구들과 잘 어울림. 협력하여 활동해야 하는 문제 상황에서 주도적으로 의견을 조율하는 모습을 보여주었으며, 적극적인 자세로 함께 참여하는 모둠원들과 잘 어우러져 해결 방안을 모색하는 모습이 인상적임. 평소 그리기에 흥미가 많고 감각이 있어 또래에 비하여 미술 과목에 상당한 소질이 있고, 음악적으로도 예술성이 뛰어나 특히 피아노를 잘 다룸. 목표가 있을 때 자기 주도적으로 계획을 세워 실천하는 능력이 있으며, 무엇이든 성실하게 열심히 임하는 태도가 바람직하고 성취 욕구가 강하기에 앞으로의 발전이 더욱 기대됨.","자기 물건을 잘 정리하고, 학습에 필요한 준비물을 챙기는 습관이 잘 정착되어 있음. 주어진 기간 내에 과제를 성실하게 해결해오는 모습이 돋보이며, 맡은 것은 끝까지 해내려고 하고, 매사에 충실히 임해 어떤 일이든 좋은 결과를 얻어 내는 모습이 인상적임. 때로 수업 시간에 다소 산만해지는 경향이 있으나 주의를 환기하면 금세 집중력을 회복하는 태도를 보여줌.손을 들고 발표의 기회를 요구하는 행동은 적으나 질문이 주어지면 적절히 대답하고 의견을 논리적으로 설명하는 모습을 보여주었기에 방학 기간을 통해 자신감을 가지고 발표하는 연습을 한다면 더욱 성장할 것이라 기대됨.신체 기능이 탁월해 몸을 쓰는 활동을 좋아하고 특히 체육 교과에 즐겁게 참여하였으며, 티볼에서 눈에 띄는 민첩성을 보여줌. 교우 관계가 원만하며 우정의 가치를 중요시하고, 성향이 맞는 친구들과 끈끈한 모습을 보여줌.","지적 탐구심과 호기심이 강하고 상식이 풍부함. 창의적이고 상상력이 뛰어나 수업 활동 중 기발한 아이디어를 제시함으로써 다른 친구들에게 신선한 자극을 줄 때가 많음. 기본적으로 긍정적이고 웃음이 많은 밝은 성정을 지니고 있으며, 친구들과 두루 잘 어울리고 수업 중 발표에 잘 참여함. 경청하는 습관이 잡혀 있어 교사의 설명을 듣고 빨리 이해하며, 이로 인해 활동 과정에 실수가 적고 항상 먼저 해결하여 친구들을 도와줌. 디자인이나 만들기 등의 활동에 소질이 있고 시각적 표현을 잘하며, 감성이 풍부하여 사진 찍기를 좋아하고 경치 등을 보고 자신이 느낀 바를 잘 이야기함. 자기 주도적으로 학습하고 생활할 줄 아는 모습이 돋보이며 기초 학습이 잘 되어있기에 앞으로 여러 방면에서 더욱 성장할 것이라 기대함.","전 교과의 기본 개념을 충실하게 인지하고 있고 긍정적인 태도로 수업에 임하는 모습이 바람직함. 당당하고 쾌활하여 학교생활을 즐겁게 하며, 학급의 모든 일에 열심히 주도적으로 참여하는 모습이 칭찬할 만함. 주변 친구들에게 친화력 있게 다가가 교우 관계가 원만하며, 또래보다 성숙하게 사고할 줄 알고 자신의 마음과 생각을 타인에게 전달하는 전달력이 뛰어남. 때로는 직설적인 언어 표현으로 인하여 친구들과의 갈등이 발생할 때도 있지만, 자신이 잘못한 부분에 대해서 솔직하게 인정하고 먼저 사과할 줄 아는 훌륭한 태도를 지녔으며, 도움이 필요한 상황에서 먼저 다가갈 줄 아는 따듯한 마음씨를 지님. 목소리가 곱고 예쁘며 박자에 대한 감각이 있어 노래를 부를 때 실력이 두드러지고, 피아노 치는 것을 좋아하는 등 음악적으로 예술성이 있는 학생임.","집중력 있고 섬세하여 실수를 하지 않으려고 노력하는 태도가 돋보이는 학생으로, 학업에 대한 의지가 강하고 이해력이 좋음. 수업 태도도 모범적이어서 전 교과 성취 수준이 높고 모든 일에 최선을 다함. 자기 주도적으로 계획을 세워 실천하는 능력이 뛰어나고 기본 생활 습관이 잘 잡혀 있어 주어진 과제를 시간 안에 성실하게 수행하는 능력이 있음. 평소 웃어른을 공경할 줄 알고, 인사성이 바르며 규칙을 지키려 노력하는 점이 타의 모범이 됨. 바르고 고운 말씨를 사용하는 모습을 보여주며, 다정한 성품을 지녀 교우 관계가 원만함. 또래보다 성숙한 사고로 학급 일을 주도적으로 해나가나 때로는 교사에게 무엇이든 공유하고 말하기를 좋아하는 아이 같은 모습을 지닌 순수한 학생이며, 타인의 장점을 볼 줄 알고 아낌없이 친구를 칭찬할 줄 아는 고운 마음씨를 지님.","이해력과 문제 해결력이 우수하고 전 교과의 기본 개념을 충실하게 인지하고 있으며, 긍정적인 태도로 수업에 임하는 모습이 바람직함. 내면이 밝고 따스한 성정으로, 항상 잘 웃고 친한 친구들 앞에서는 굉장히 활발한 모습도 보여주며 남녀 모두와 친하게 지내는 등 교우 관계가 원만함. 개인 활동보다 함께 진행하는 프로젝트 활동이나 모둠 학습에 관심과 흥미가 높아 배움의 과정에 집중하는 모습을 보이고, 그 결과 또한 우수함. 많은 사람들 앞에 나서거나 손들어 발표하는 행위는 적으나, 함께 생각을 나누는 과정에서 자신의 의견을 내는데 거리낌이 없으며 다른 사람의 이야기도 귀 기울여 들음. 언제나 주어진 과제를 성실하게 완성하며, 본인이 맡은 일은 끝까지 최선을 다해 마무리하려는 모습을 칭찬함.","이해력이 뛰어나고 굉장히 꼼꼼한 학생으로, 전 교과에서 학업 성취도가 고루 우수함. 수업 시간에 집중력이 좋고 매사에 성실하게 과제와 주어진 활동을 수행하는 모습이 타의 귀감이 되는 모범적인 학생임. 독서 습관이 잘 형성되어 있어 상식이 풍부하고 문장 구사력과 어휘력이 좋으며, 특히 자신의 생각을 글로 표현하는데 흥미와 재능을 보이기에 앞으로 이러한 장점을 꾸준히 살려간다면 크게 발전할 것으로 기대됨. 말과 행동이 온화하고 생각의 깊이가 있으며 그 성숙함으로 주변의 신뢰를 받기에 남녀를 가리지 않고 두루 잘 어울림. 도움이 필요한 친구에게 먼저 손을 내밀 줄 알며, 특히 모둠원들과의 협동이 필요한 활동에 있어서 자신이 이해한 것을 다른 사람들에게 친절하게 설명해주는 모습이 칭찬할 만함.","배움에 대한 열정이 크며 기초 학습이 잘 되어있고 이해력이 좋아 전 교과의 성취도가 우수함. 특히 역사에 관심이 있어 사회 교과목에 흥미와 적극성을 보였으며, 궁금한 것을 스스로 탐구하는 자기 주도적 학습 능력이 뛰어남. 시간 관리를 잘하고, 항상 집중하는 모습을 보여주며 선생님의 설명이나 말을 놓치지 않아 수업 상황에서 핵심적인 역할을 할 때가 많음. 성격이 다정다감하고 배려심이 남달라 남녀 모두와 친하게 지내며, 특유의 온화한 리더십과 성숙한 사고로 주변 친구들의 신망을 받음. 말과 행동이 침착하고 사려가 깊으며 학급 모든 일에 솔선수범함. 사고의 폭이 넓어 자신의 의견을 개진해야 하는 문제 상황이 주어졌을 때 타인을 충분히 설득할 수 있는 의견을 제시하는 모습이 인상적임. 매사 성실한 태도로 맡은 일의 끝맺음을 잘하고 약속을 잘 지키는 믿음직한 어린이임.","이해력이 우수하여 전 과목 성취도가 높고 특히 암기력이 뛰어나며 사회과 역사 영역에 대한 관심과 이해도가 남다른 학생임. 생각의 깊이가 있으며 매사 신중한 언행으로 주변 친구들의 신뢰를 받음. 말수가 적은 편이고 나서서 발표를 많이 하지는 않지만, 모둠 토의 활동에서 의견을 공유할 때나 교사가 질문을 던질 때면 상당히 논리적이고 정확하게 말해 학급 전체가 학습 목표에 도달할 수 있게 하는 결정적 역할을 맡을 때가 많음. 차분하고 진지한 태도가 인상적이며, 모든 일에 끈기를 가지고 최선을 다함. 실수를 배움의 기회로 삼고 자신이 성취한 것에 대해 자랑하는 일을 삼가고 겸손한 자세를 취함. 평소 가족을 생각하는 마음이 크고, 성격이 온순하나 그 내면에는 강직한 모습이 있어 친구들과 두루두루 잘 지내면서도 자기만의 원칙을 지킬 줄 아는 외유내강의 모습을 잘 보여줌.","공감 능력과 배려심이 남다르고 정이 많아 교우 관계가 원만하며 학급의 크고 작은 행사에 적극적으로 참여함. 학기 초에 비하여 수업 태도와 과제 이행의 성실도가 눈부시게 발전했으며, 학습 활동을 끝까지 최선을 다해 마치려는 자세가 훌륭함. 호기심, 탐구심이 왕성하여 수업 시간에 질문을 많이 하며 발표력이 좋고, 특히 수학적 사고력이 있어 수학과 영역에 흥미를 느끼고 우수한 성취도를 보여줌. 재치 있고 유쾌한 성품으로 유머를 알아 주변 친구들도 함께 즐겁게 만드는 재주가 있으며, 가끔 수업 시간에 농담이 지나쳐 주의가 산만해지거나 친구들과의 의견 다툼이 있을 때도 있지만 빠르게 인정하고 먼저 사과하는 태도를 보여 교사와 친구들에게 신뢰를 주는 훌륭한 학생임.주어진 일을 책임감 있게 잘 이행하며, 방과 후에 시간이 될 때 자발적으로 학급 청소를 도맡아 하여 친구들이 깨끗한 교실에서 공부할 수 있도록 봉사한 적이 많을 만큼 학급을 사랑하고 타인에게 도움을 주고 싶은 따스한 마음씨를 지님.","신체 활동을 즐기고 운동 기능이 뛰어나 체육 수업에 즐겁게 참여하며, 활동적인 수업에서는 의견 제시를 더욱 적극적으로 함. 국어 시간 지문을 읽을 때 인물의 대사를 실감 나게 읽는 것을 잘하여 수업 분위기를 유쾌하게 만들며, 평소 말수가 많은 편은 아니지만 친한 친구들 사이에서는 이야기를 잘하며 즐겁고 밝게 어울려 지냄. 양보의 미덕을 알고 나눌 줄 아는 성정을 갖고 있기에 대인 관계가 원만하며, 자신의 생각과 느낌을 솔직 담백하게 이야기할 수 있음. 앞으로의 발전을 위하여 꾸준히 책을 읽는 습관을 기르고 무엇보다 글자를 바르게 쓰도록 많은 노력이 요구되며, 의견을 또박또박 전달하는 연습을 한다면 더욱 훌륭하게 성장할 것으로 믿음. 모둠 활동에서 뒤에서 친구들을 묵묵하게 도와주는 모습이 인상 깊고, 손을 들어 발표를 요구하는 행동은 적으나기회가 주어졌을 때 최선을 다해 열심히 참여하는 모습이 돋보임.","웃어른에 대한 예절이 바르며, 밝고 명랑한 성격으로 성별을 가리지 않고 친구들과 즐겁게 어울림. 특히 어려운 상황에 처한 친구를 보면 흔쾌히 도와주려는 착한 마음씨가 인상적임. 기초 학습이 탄탄하고 이해력이 좋아 모든 교과의 학업 성취도가 두루 양호하며, 매 수업 시간 눈을 빛내며 교사의 말을 경청하고 중요한 학습 내용을 스스로 정리함. 배우는 과정을 좋아하고 열심히 참여하며, 어려운 과제에도 기죽지 않고 자신의 힘으로 해결할 수 있을 때까지 고민하는 모습이 기특함. 다만 주변 정리 정돈이 다소 미흡한 면이 보이므로 앞으로의 성장을 위하여 생활 습관을 개선한다면 더욱 크게 발전할 것임. 모둠 활동을 할 때 맡은 역할을 성실히 수행하며 교사와 적극적으로 상호작용함. 규칙을 잘 지키고 자신이 맡은 일은 끝까지 완수하기 위해 노력하는 모습이 칭찬할 만함.","기본 학습 습관이 잘 잡혀 있고 이해력이 좋음. 자기 주도적으로 학습할 줄 알며 집중력이 높아 매 수업 시간에 또렷한 눈빛으로 교사의 말을 경청함. 스스로 꾸준히 노력하여 사회 역사 영역에 있어 학기 초에 비하여 많은 발전을 보여준 점을 칭찬함. 무슨 일이든 성실하게 임하며 주어진 과제를 늘 기한 내에 완성하는 책임감 있는 모습이 인상적이며, 올 한 해 받아쓰기에서 꾸준히 만점을 받는 등 목표한 것을 이루는 능력이 있음. 자신이 알고 있는 내용을 다른 친구들에게 구체적으로 설명하며 모둠 활동에서 구성원과 협력하여 문제를 해결하는 모습이 돋보임. 웃어른께 예의 바르고 타인의 아픔에 공감할 줄 아는 따듯한 마음을 지녔으며, 말과 행동이 차분하고 상대방을 배려하며 대화를 나눌 줄 알기에 친구들과의 사이가 좋음. 자기 주변 정리 정돈이 깔끔하며, 준비물과 수업 활동을 늘 미리 준비하는 자세가 훌륭함.","학업에 있어 내적 동기가 높고 자신감이 있으며 이해가 빨라 전 과목 성취도가 고루 우수한 편임. 성취 욕구가 커 스스로 더 잘하기 위해 노력하는 열정이 있어 학기 초에 비하여 특히 영어과에서 더욱 좋은 결과를 냄. 기본 학습 습관이 바르게 형성되어 있어 매 수업 시간 눈을 빛내며 교사의 말을 경청하고 중요한 학습 내용을 스스로 정리함. 자기 주변 정리 정돈이 깔끔하며, 준비물을 포함하여 수업 활동을 늘 미리 준비하는 자세가 훌륭함. 평소 적극적으로 발표에 나서지는 않으나, 기회가 주어졌을 때 멋지게 발표하는 모습을 보여주었음. 말과 행동이 침착하고 사려가 깊으며, 타인의 입장에서 공감할 줄 알기에 교우 관계가 원만함. 모둠 활동을 할 때 맡은 역할을 성실히 수행하며 갈등 관계를 만들지 않고 어떤 친구들과 모둠을 구성하든지 협동을 잘하고, 모둠원들에게 도움을 주는 모습이 보기 좋음. 웃어른에 대한 예의 바른 태도가 돋보이며, 인사성이 무척 바르고 규칙을 지키려 노력하는 점이 모범적인 학생임.","이해력이 좋아 전 교과 성취도가 고루 우수하며 자신의 생각을 글로 잘 나타냄. 학습을 준비하는 자세가 바람직하고 수업에 능동적으로 임하며, 집중도가 높고 학업에 대한 욕심이 있어 스스로 더 잘하기 위해 노력하는 열정이 있음. 함께 정한 규칙을 잘 지키고 생각이 깊고 차분하며, 자주적인 학습 습관 및 생활 태도가 정착되어 있음. 항상 주어진 과제를 정해진 기간 안에 최선을 다해 해결하는 모습을 보여 친구들에게 귀감이 됨. 수줍음이 많아 낯을 가리는 경우가 있으나 시간을 충분히 주어 익숙해지면 자신의 생각을 조리 있게 잘 이야기함.성격이 온화하고 다정다감하여 모두와 잘 어울리며, 단짝 친구와 깊이 있는 교우 관계를 맺음. 말과 행동이 침착하고 사려 깊으며, 성품이 올곧아 주변에서 일어나는 작은 일에 대하여 감사하는 마음을 갖고 예의 있게 생활함.","평소 수업에 열심히 참여하며 자신의 의견을 이야기하는 것에 주저함이 없고 발표력이 뛰어남. 자신의 의견을 보다 또박또박 전달하는 연습을 한다면 더할 나위 없이 좋겠음. 신체 표현 활동에 자신감이 넘치고 창의성이 돋보이며 춤을 추는 것과 노래 부르는 것을 좋아하여 특히 음악 시간 등에서 즐거운 마음과 태도로 임하는 모습이 보기 좋음. 기본적으로 운동 신경이 있어 티볼 활동에 적극적으로 참여하며 점차 성장하는 모습을 보여주어 많은 칭찬을 받음. 솔직하고 엉뚱한 매력과 밝고 구김살 없는 성격으로 학교생활을 씩씩하고 즐겁게 하며, 특유의 긍정적인 에너지와 함께 주변 친구들에게 친화력 있게 다가가 교우 관계가 원만함. 다만 흥미가 낮은 교과목이나 장문으로 글을 쓰는 활동들에 대해서는 중도에 쉽게 포기하려 하므로, 강점인 특유의 끈기와 적극적인 태도로 주어진 학업과 과제에 최선을 다한다면 학업에 있어 큰 발전이 있을 것으로 확신함.","수업 시간에 주의 집중을 잘하고 항상 긍정적인 태도로 모든 활동에 임하는 모습이 바람직하며, 주어진 문제를 스스로 끈기 있게 해결하는 모습이 대견함. 과제 수행의 완성도가 높고, 전 교과의 기본 개념을 충실하게 인지하고 있으며 특히 꾸준한 노력으로 영어과 성취도가 학기 초에 비하여 월등히 좋아짐. 기본적으로 사교성이 좋고 밝고 긍정적인 에너지가 있어 다수의 친구들과 두루 잘 어울리며, 도움이 필요한 친구에게 먼저 다가가는 따듯한 마음을 지님. 또한 대가를 바라지 않고 서로 나누는 자세가 몸에 배어있으며 친구들의 잘못을 너그럽게 용서할 줄 앎. 무엇보다 학교생활 전반의 일을 자기 주도적으로 계획하고 관리하는 능력이 있으며, 이해력이 좋아 새로운 것을 금방 습득하고 매사에 집중력 있게 임하므로 앞으로가 더욱 기대되는 학생임.","해야 할 일을 정확하게 파악할 줄 알며, 바른 태도로 수업에 임하는 태도와 어려운 문제가 있어도 스스로 끝까지 해결하고자 노력하는 점을 칭찬함. 끈기가 있고 이해력이 좋으므로 앞으로 특히 수학과 영역에 있어서 복습과 예습을 병행하여 노력한다면 학업 성취도 면에 있어 더욱 발전할 것이 분명함. 매사 성실한 모습으로 맡은 일의 끝맺음을 잘하고 공동체의 규칙을 잘 지키는 믿음직한 어린이임. 웃어른에 대한 예의가 바르고 타인의 아픔에 공감할 줄 아는 따듯한 마음을 지녔으며, 상대방을 배려하며 대화를 나눌 줄 알기에 친구들과의 사이가 좋음. 친구의 작은 부탁도 소홀히 여기지 않고 잘 들어주며 주변 사람들에게 친절하게 대함. 모둠 구성원이 도움을 필요로 할 때 자신이 알고 있는 내용을 구체적으로 설명하는 모습이 인상 깊음. 민첩성과 순발력이 있어 티볼 활동에서 기량을 보여주었으며, 신체를 움직이는 활동을 좋아하여 모든 체육 활동에 적극적으로 참여함.","밝고 쾌활하여 학교생활을 즐겁게 하며, 특유의 긍정적인 에너지가 돋보이는 학생으로 주변 친구들에게 친화력 있게 다가가 교우 관계가 무척 원만함. 자신의 의견을 논리적으로 정리하여 전달하는 능력이 뛰어나 토론 수업이나 학급 회의 시간의 모습이 돋보이며, 때로는 의견 차이로 인한 갈등이 발생할 때도 있지만, 자신이 인정할 부분이 있다면 솔직하게 인정하고 먼저 손 내밀 줄 아는 훌륭한 태도를 지님. 다른 과목에 비하여 수학 과목을 다소 어려워하여 흥미를 잃는 모습을 보였으나, 지속적인 노력과 끈기로 학기 초에 비하여 특히 연산 영역에서 많은 발전을 이루었으므로 앞으로도 다양한 문제를 풀어보는 연습을 통해 수학에 대한 내적 동기와 문제 해결력을 기른다면 학업 성취도에서 더욱 큰 향상이 기대됨. 신체를 움직이는 모든 활동을 좋아하는 학생으로 기본적으로 운동 신경이 있고, 체육과 수업에서 특히 적극적임. 발표력이 우수하여 거의 모든 수업 시간에 자신감 있게 발표하는 모습을 보여주었으며, 수업에서 주도적인 역할을 할 때가 많음. 새로운 것에 대한 호기심과 관심이 많아 질문을 잘하며, 모둠 협동 학습에 적극적으로 참여하여 창의적이고 재치 있는 결과물을 낼 뿐만 아니라 친한 친구들과 뭔가를 계획하고 협동하여 해결하는 활동에 소질이 있음.","학습 태도가 바르고 수업에 적극적으로 참여하며 주의 깊게 경청하고 배운 것을 자신의 것으로 내면화하는 능력이 뛰어남.","흥미가 낮은 교과에 대해서는 과제 수행을 쉽게 포기하려 하므로, 성실하고 적극적인 태도로 주어진 학업에 최선을 다한다면 큰 발전이 있을 것으로 기대됨.","논리적으로 사고하고 근거를 토대로 결론을 도출할 수 있으며, 생각과 의견을 효과적으로 잘 전달함.","배우는 과정을 좋아하고 열심히 참여하며, 어려운 과제에도 기죽지 않고 자신의 힘으로 해결할 수 있을 때까지 고민하는 모습이 기특함.","이해력이 양호하고 문제 해결력이 있어 어려운 문제도 성심성의껏 해결하며 과제를 끝까지 하려고 하는 점이 바람직함.","학습을 준비하는 자세가 바람직하고 수업에 능동적으로 임하며, 집중도가 높고 학업에 대한 욕심이 있어 스스로 더 잘하기 위해 노력하는 열정이 있음.","매 수업을 능동적으로 집중력 있게 참여하면서, 교사의 말을 놓치지 않아 어려운 질문을 제시하였을 때도 적절하게 대답하는 모습을 보여주며 모두의 박수를 받음.","주변의 칭찬을 받았을 때 교만하지 않고 매사에 신중하면서도 자신을 낮추는 태도에서 겸손함의 미덕을 엿볼 수 있음.","평소 그리기에 흥미가 많고 감각이 있어 또래에 비하여 미술 과목에 상당한 소질이 있음. 인물과 사물을 비례에 맞게 그릴 줄 알며, 작품 구상 능력이 뛰어나고 색감과 표현력이 돋보임."]}]},{"id":"ja","name":"자율활동","limit":1500,"target":3,"cats":[{"cat":"장애인식교육","items":["장애인이 일상생활에서 불편함을 느끼는 점을 이해하고, 그들의 불편함을 최소화할 수 있는 방법을 배움.","다양한 장애 유형에 대해 이해하고, 그들의 특성에 맞는 배려와 대처 방법을 배움.","장애인에 대한 편견과 차별을 없애기 위해 노력하고, 서로 다른 개성과 능력을 인정하며 존중하는 태도를 갖추게 됨."]},{"cat":"지진대피 훈련","items":["지진대피훈련을 통해 지진 발생 시 대피하는 위치와 방법을 배우고 실천하며 연습함.","학생들이 지진대피훈련을 통해 대피 시 필요한 준비물과 대처 방법을 배워 자신감이 생김.","지진대피훈련을 통해 학생들이 대피하는 과정에서 서로 돕고 지지해주는 모습을 보며 더욱 화합함을 느낌.","지진대피훈련을 통해 학생들이 대피하는 과정에서 불안감을 느끼지 않도록 대처 방법을 익히고 연습함.","학생들이 지진대피훈련을 통해 대피 시 신속하고 안전하게 대처하는 방법을 익혀 적극적으로 대처하고자 다짐함."]},{"cat":"화재대피훈련","items":["화재대피훈련을 통해 화재 발생 시 빠르게 대처하는 방법을 배우고, 안전한 대피를 실천할 수 있도록 노력함.","비상상황 발생 시 침착하게 대처하는 방법을 학습하고, 안전한 대피를 위해 노력함.","대피 시간을 최소화하기 위해 대피 경로와 출구를 미리 파악하고, 실제 상황에서도 빠르게 대처할 수 있도록 노력함.","화재 발생 시 주변 상황을 파악하고, 안전한 대피를 위해 다른 사람들과 협력하여 노력함.","화재 대피훈련을 통해 화재 발생 시 빠르게 대처하는 방법을 익히고, 실제 상황에서도 안전하게 대처할 수 있도록 노력함."]},{"cat":"생명존중교육","items":["생명존중교육을 통해 생명의 소중함을 깨닫고, 서로간의 존중과 배려의 중요성을 느끼게 되었음.","생명존중교육을 통해 타인의 생명과 안전을 존중하고, 도움이 필요한 사람에게 적극적으로 도움을 주는 마음가짐을 갖추고자 노력함."]},{"cat":"학교폭력 예방교육","items":["학교폭력예방교육을 통해 다른 학생들의 감정을 존중하고 서로 배려하는 마음을 가지게 되었음.","학교폭력예방교육을 통해 언어폭력이나 신체폭력이 상처를 주는 것임을 알게 되어 더욱 조심스럽게 행동하게 되었음.","학교폭력예방교육을 통해 친구와의 갈등을 해결하는 방법을 배우고, 자신의 감정을 표현하는 법을 익혀 자신감이 생겼음.","학교폭력예방교육을 통해 다른 학생들의 차이점을 인정하고 존중하는 태도를 가지게 되어 더욱 다양한 사람들과 친 이므로 학습과제를 보다 정확하게 이해하려는 노력을 기울인다면 더 크게 발전할 것임.","학년 초에 비해 연극 활동에 스스로 참여하려는 주도성을 보이며 모둠활동에도 적극적으로 참여함.","표현이 섬세하고 친구들 앞에서 발표를 잘하며,주변을 잘 살펴 다른 사람의 부족한 부분을 도와줄 줄 앎.","다른 사람의 생각을 잘 듣고 수용하는 열린 자세를 가지고 있음.","창의적이고 표현하는 것을 좋아하나 부끄러움이 많아 자신의 역량을 충분히 펼치지 못하는 점이 아쉬움.","아이디어가 풍부하고 몸짓표현에 창의적이며 매사에 열정적임.","모둠 활동에서 양보하고 배려하여 상대방의 의견을 수용하며,작품 완성도에 대한 욕구가 강함.","성격이 밝고 쾌활하여 수업에 적극적으로 참여하며 몸짓표현이 창의적임.","장난기가 많아 집중을 흐리기도 하지만 모둠활동을 적극적으로 이끌어 나가며 과제를 명확히 수행해 냄.","수업에 즐겁게 참여하는 태도는 바람직하나 수업 내용 외적인 것에 관심이 많아 수업분위기를 흐리는 경우가 종종 있음.","자유로운 신체 표현 활동을 통해 움직임과 표현의 중요성을 이해하고 잘 표현함.","자유로운 신체 표현 활동을 통해 나의 신체에 집중하며 주어지는 속도와 상황에 맞게 잘 움직임.","주어진 상황의 특징을 파악하여 해당 장면을 정지된 동작으로 잘 나타냄.","제시된 장소에서 일어날 수 있는 일을 상상하여 이야기를 구성하고 이를 몸 동작으로 잘 표현함.","제시된 장면을 보고 표현에 필요한 인물과 동작을 파악하여 이를 정지 동작으로 잘 나타냄.","대본을 읽고 등장인물의 성격에 맞게 여러 대사를 재해석하며 잘 표현함.","자신의 역할에 맞게 다른 배우들과 호흡을 맞춰가며 역할극을 잘함.","역할에 어울리는 감정 표현 방법을 알아보고 감정을 살려가며 대본을 잘 읽음.","역할에 맞게 감정을 넣으며'역할극 리허설에 적극적으로 참여함.","자신이 맡은 역할의 성격과 특징을 파악하고 다른 배우들과 호흡을 맞춰가며 역할극을 잘함.","오감 열기 활동을 통해 다양한 감각을 몸으로 표현하는 방법을 알고 이를 정지 동작으로 잘 표현함.","대본을 읽고 자신에게 맞는 역할을 정한 뒤 다른 배우들과 호흡을 맞추어 대본을 잘 읽음.","다양한 감정을 몸짓과 표정으로 표현하는 방법을 이해하고 역할에 맞게 감정을 넣어 대본을 잘 읽음.","모둠 친구들과 배려의 자세로 의견을 주고 받는 태도가 바람직함.","이야기의 흐름과 인물의 성격을 스스로 분석하여 어울리는 대사와 몸짓으로 연극에 참여함.","이야기의 주제,인물의 성격,사건의 흐름 등을 바르게 이해하여 이에 어울리는 대사로 잘 표현함.","등장인물의 성격에 대해 친구들과 이야기를 나누며 연극으로 표현할 대사와 행동 등을 정하여 연습에 참여하며 이를 무대에서 잘 표현함.","이야기에 나오는 등장인물이 되어 인물의 성격과 사건,주제가 잘 전달되도록 연극으로 잘 표현함.","주변의 소품과 도구들을 사용하여 사건의 흐름이 더욱 잘 이해되게 연극을 만들고 관객에게 잘 들리는 목소리와 발성으로 연극을 잘 발표함.","친구의 의견을 잘 경청하며 연극 연습에 참여하고 이야기에 나오는 인물의 말과 행동을 다양하고 창의적으로 해석하여 연극으로 잘 표현함.","큰 목소리와 역할에 어울리는 동작으로 연극에 적극적으로 참여하며 발성이 좋아 연극의 주제가 관객에게 잘 전달됨.","이야기의 구성 요소가 잘 드러나게 연극으로 잘 구성하고 주변의 소품과 도구를 연극에 적극적으로 활용하여 관객의 이해를 도움.","친구의 의견을 잘 경청하며 연극 연습의 분위기를 좋게 형성함.","인물의 성격을 다양한 표정과 몸짓으로 잘 표현하며 연극 활동에 적극적으로 참여함.","이야기 속 인물,사건들의 특징을 잘 파악하여 해당 장면을 극에 알맞은 대사와 몸짓으로 연극을 잘 표현함.","이야기의 주제를 창의적으로 잘 해석하여 연극에 즐거움을 더하는 재능이 뛰어남.","연습할 때 친구들을 배려하는 모습이 돋보이고 자신의 생각을 친구들과 함께 조율하는 모습이 보기 좋음.","연극활동에 창의적이고 적극적인 태도로 임하며 자신만의 표현 방식으로 당당하게 표현하여 친구들에게 좋은 본보기가 됨."]}]},{"id":"jr","name":"진로활동","limit":1500,"target":3,"cats":[{"cat":"일과 직업에 대해 알아보기","items":["일과 직업의 의미에 대해 알아보고 일과 직업을 통해 보람과 즐거움을 느낄 수 있음을 인식함.","일과 직업의 의미에 대해 알아보고 일은 단순한 즐거움과 재미를 위한 놀이나 여가활동,휴식과 다름을 인식함.","일과 직업의 의미에 대해 알아보고 일과 직업이 가지는 여러 가지 중요성에 대해 느낌.","일과 직업의 의미에 대해 알아보고 일과 직업이 주는 자신의 가치 실현,사회구성원으로서의 기여에 대해 생각함."]},{"cat":"직업 탐색","items":["사회가 변화하고 기술과 산업이 발달하면서 직업이 점점 다양해지고 있음을 인식하고 이에 따라 직업 정보 탐색의 중요성을 생각함.","직업의 다양성 알고 직업별로 하는 일이나 일하는 조건,취업하는 방법,직업 전망,임금 수준 등 직업과 관련된 다양한 정보의 중요성을 인식함.","사회의 변화와 기술과 산업의 발달에 따른 직업의 다양성을 알고 직업 정보 탐색의 필요성을 인식함.","사회의 변화에 따라 직업이 점점 다양해짐을 알고 직업과 관련한 다양한 정보를 탐색하는 것의 중요성을 인식함.","직업이 다양해짐에 따라 일이나 일하는 조건,취업하는 방법,직업 전망,임금 수준 등의 직업 정보를 탐색하는 것이 중요함을 인식함.","사회가 변화하고 기술과 산업이 발달하면서 직업이 점점 다양해지고 있음을 인식하고 여러 가지 직업 정보를 탐색함.","직업의 다양성 알고 직업별로 하는 일이나 일하는 조건,취업하는 방법,직업 전망,임금 수준 등 직업과 관련된 다양한 정보를 탐색함.","사회의 변화와 기술과 산업의 발달에 따른 직업의 다양성을 알고 자신이 원하는 직업과 관련하여 여러 가지 직업 정보를 찾아봄.","직업이 다양해짐에 따라 일이나 일하는 조건,취업하는 방법,직업 전망,임금 수준 등의 직업 정보를 탐색함.","사회의 변화에 따라 직업이 점점 다양해짐을 알고 자신이 원하는 직업과 관련한 다양한 정보를 찾아봄."]},{"cat":"나에 대해 알아보고 나에게 맞는 직업 탐색(6)","items":["사람마다 가지는 특성이 다르므로 나의 성격,흥미,적성을 고려하여 나에게 알맞은 직업을 탐색함.","나의 성격,흥미,적성 등을 알아보고 나의 특성에 대한 이해를 바탕으로 알맞은 직업을 탐색함.","나의 생활 경험을 떠올려 나의 특성을 알아보고 나의 성격,흥미,적성에 맞는 직업을 탐색함.","진로인식검사를 통해 나의 특성을 파악하고 나의 성격,흥미,적성에 맞는 직업을 탐색함.","나에게 어울리는 직업을 알아보고 대안 직업 또한 탐색하여 나의 특성에 어울리는 여러 가지 직업에 대해 탐색함.","나의 특성을 고려하여 나에게 어울리는 직업을 찾아보고 목표직업을 갖기 위한 실천계획을 세우며 목표 실현을 다짐함."]},{"cat":"잡월드(놀이형 검사)","items":["놀이형 체험활동을 통해 자신이 잘 할 수 있는 것,좋아하는 것에 대해 탐색하고 자신의 진로를 탐색해 보는 시간을 가짐.","다양한 지능에 관한 체험프로그램에 참여하여 자신이 가진 강점을 파악하고 이를 토대로 자신의 진로를 탐색함.","여러 가지 체험프로그램에 참여하며 나의 강점 지능을 찾아보고 이를 활용하여 자신의 진로에 대해 생각해 봄.","‘나의 강점 지능 찾아보기’놀이형 체험프로그램에 참여하여 자신에 대해 자세히 알아보고 결과에 어울리는 진로를 찾아봄.","놀이형 체험프로그램에 참여하며 내가 잘 하는 것을 찾아보고 이를 활용할 수 있는 나의 진로에 대해 탐색함.","재미있게 놀고 체험하면서 자신의 흥미와 적성을 알아보고 유형에 맞는 직업과 진로정보를 탐색함.","재미있게 놀고 체험하면서 자신의 흥미와 적성을 느껴보고 개인별 결과지를 통해 자신에게 적합한 직업에 대한 정보를 얻음.","다양한 체험프로그램에 참여하여 자신의 흥미와 적성을 알아보고 유형에 맞는 직업과 진로정보를 탐색함.","다양한 체험프로그램에 참여하여     for(const a in o.recs||{})for(const no in o.recs[a]){const r=o.recs[a][no];if(r&&r.length)u[`R|${y}|${a}|${no}`]=JSON.stringify(r)}}
  for(const a in S.custom)(S.custom[a]||[]).forEach(c=>u[`C|${a}|${c.id}`]=JSON.stringify({cat:c.cat,t:c.t}));
  for(const k in S.hidden)u['H|'+k]='1';
  return u;
}
function cols(k,v){
  const p=k.split('|'),o=JSON.parse(v);
  if(p[0]==='Y')return [p[1],o.students.length,o.locked?'확정':'',o.lockedAt];
  if(p[0]==='R'){const st=((S.years[p[1]]||{}).students||[]).find(s=>String(s.no)===p[3]);return [p[1],areaName(p[2]),p[3],st?st.name:'',o.join(' '),new Date().toLocaleString('ko-KR')]}
  if(p[0]==='C')return [areaName(p[1]),o.cat,o.t];
  if(p[0]==='H')return [areaName(p[1]),k.slice(3+p[1].length)];
}
function fromUnits(m){
  const years={},custom={},hidden={};
  const yr=y=>years[y]||(years[y]=newYear());
  for(const k in m){const p=k.split('|'),v=m[k];
    try{
      if(p[0]==='Y'){const o=JSON.parse(v),y=yr(p[1]);Object.assign(y,{students:o.students||[],targets:o.targets||{},locked:!!o.locked,lockedAt:o.lockedAt||''})}
      else if(p[0]==='R'){const y=yr(p[1]);(y.recs[p[2]]||(y.recs[p[2]]={}))[p[3]]=JSON.parse(v)}
      else if(p[0]==='C'){const o=JSON.parse(v);(custom[p[1]]||(custom[p[1]]=[])).push({id:p[2],cat:o.cat,t:o.t})}
      else if(p[0]==='H')hidden[k.slice(2)]=1;
    }catch(e){console.warn('읽지 못한 줄',k)}
  }
  return {years,custom,hidden};
}
function pendingList(){
  const u=units(),list=[];
  for(const k in u)if(synced[k]!==u[k])list.push({k,v:u[k]});
  for(const k in synced)if(!(k in u))list.push({k,v:null});
  return list;
}
function setSync(st,msg){
  const el=$('#sync');if(!GAS)return;el.style.display='';el.className='muted';
  if(st==='ok')el.innerHTML=sheetUrl?`<a href="${sheetUrl}" target="_blank" title="저장 시트 열기">✓ 시트에 저장됨</a>`:'✓ 시트에 저장됨';
  if(st==='pending'||st==='saving')el.textContent='저장 중…';
  if(st==='load')el.textContent='시트에서 불러오는 중…';
  if(st==='fail'){el.className='fail';el.textContent='⚠ 저장 실패 — 다시 시도 중 (누르면 바로)';el.title=String(msg||'')}
}
function scheduleSync(ms){if(!GAS)return;clearTimeout(syncT);syncT=setTimeout(push,ms??700);if(!inflight)setSync('pending')}
function push(){
  if(!GAS||!S._loaded)return;
  if(inflight)return scheduleSync(300);
  const list=pendingList().slice(0,300);
  if(!list.length)return setSync('ok');
  list.forEach(x=>{if(x.v!==null)x.c=cols(x.k,x.v)});
  inflight=true;setSync('saving');
  GAS.withSuccessHandler(res=>{
    inflight=false;failN=0;
    list.forEach(x=>{if(x.v===null)delete synced[x.k];else synced[x.k]=x.v});
    try{localStorage.setItem(SKEY,JSON.stringify(synced))}catch(e){}
    if(res&&res.api<NEED_API)apiWarn(res.api);
    if(pendingList().length)push();else setSync('ok');
  }).withFailureHandler(err=>{inflight=false;failN++;setSync('fail',err&&err.message);scheduleSync(Math.min(30000,2000*failN))}).saveUnits(list);
}
function apiWarn(v){const b=$('#banner');b.style.display='block';b.innerHTML=`Apps Script의 <b>Code.gs</b>가 옛 버전(${v})입니다. 저장소의 haengbal/Code.gs를 다시 붙여 넣고 <b>배포 관리 → 새 버전</b>으로 다시 배포하세요.`}
function pull(first){
  if(!GAS||inflight)return;
  lastPull=Date.now();if(first)setSync('load');
  GAS.withSuccessHandler(res=>{
    sheetUrl=res.url||'';
    const server=res.units||{},local=units(),merged=Object.assign({},server);
    if(!Object.keys(synced).length){
      // 이 기기에서 처음 연결: 시트 내용을 기준으로 하고, 시트에 없는 이 기기 기록(빈 명단 제외)만 더한다
      for(const k in local){if(k in server)continue;if(k[0]==='Y'&&!JSON.parse(local[k]).students.length)continue;merged[k]=local[k]}
    }else{
      // 아직 시트에 못 보낸 이 기기의 변경은 지키고, 나머지는 시트(다른 기기에서 고친 것 포함)를 따른다
      for(const k in local)if(synced[k]!==local[k])merged[k]=local[k];
      for(const k in synced)if(!(k in local))delete merged[k];
    }
    const d=fromUnits(merged);
    S.years=d.years;S.custom=d.custom;S.hidden=d.hidden;
    if(!S.years[S.cur]){const ys=Object.keys(S.years).sort();S.cur=ys.length?ys[ys.length-1]:thisYear}
    synced=server;try{localStorage.setItem(SKEY,JSON.stringify(synced))}catch(e){}
    S._loaded=true;bankCache={};useCache=null;
    if(cur!=null&&!Y().students.some(s=>s.no===cur))cur=null;
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    renderAll();
    if(res.api<NEED_API)apiWarn(res.api);
    if(pendingList().length)push();else setSync('ok');
  }).withFailureHandler(err=>{setSync('fail',err&&err.message);setTimeout(()=>pull(first),3000)}).loadAll();
}
function Y(){return S.years[S.cur]||(S.years[S.cur]=newYear())}
function A(){return BANK.find(a=>a.id===area)}
function recs(no){const r=Y().recs[area]||(Y().recs[area]={});return r[no]||(r[no]=[])}
function target(){return Y().targets[area]||A().target||6}
function locked(){return !!Y().locked}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1600)}

/* NEIS 기준 분량: 한글 등 3바이트, 영문·숫자·공백 1바이트, 줄바꿈 2바이트 */
function neisBytes(s){let n=0;for(const ch of s){n+=ch==='\n'?2:(ch.charCodeAt(0)>127?3:1)}return n}
function finalOf(no){return recs(no).join(' ')}

/* 영역별 문장 은행 = 기본 문장 + 추가 문장 (숨긴 문장 제외) */
function bankOf(id){
  if(bankCache[id])return bankCache[id];
  const a=BANK.find(x=>x.id===id), list=[], cats=[];
  const add=(cat,t,custom,cid)=>{if(!cats.includes(cat))cats.push(cat);list.push({cat,t,custom,cid,hid:!!S.hidden[id+'|'+t]})};
  a.cats.forEach(c=>c.items.forEach(t=>add(c.cat,t,false)));
  (S.custom[id]||[]).forEach(c=>add(c.cat,c.t,true,c.id));
  list.sort((x,y)=>cats.indexOf(x.cat)-cats.indexOf(y.cat));
  return bankCache[id]={list,cats};
}
function usage(){
  if(useCache)return useCache;
  const m=new Map(), r=Y().recs[area]||{};
  for(const no in r)for(const t of r[no])m.set(t,(m.get(t)||0)+1);
  return useCache=m;
}
function changed(){useCache=null;save();renderStu();renderBank();renderCur()}

  else if(!y.students.length){b.style.display='block';b.innerHTML=`${S.cur}학년도 명단이 비어 있습니다. <button class="sm" id="openRoster">명단 입력</button> 지난 기록이 있으면 <b>백업 불러오기</b>로 가져오세요.`}

  }).join('')||`<div class="empty"><b>${y.students.length?'모두 끝났어요 🎉':'명단이 비어 있어요'}</b>${y.students.length?'':'위의 <b style="display:inline">명단</b> 버튼으로 넣으세요'}</div>`;

function renderBank(){
  const {list,cats}=bankOf(area),u=usage(),mine=new Set(cur!=null?recs(cur):[]);
  const showHid=$('#showHidden').checked, hideUsed=$('#hideUsed').checked;

  const terms=q.trim().split(/\s+/).filter(Boolean);

    let tx=esc(x.t);terms.forEach(w=>{tx=tx.split(esc(w)).join(`<mark>${esc(w)}</mark>`)});
    html+=`<div class="it ${isMine?'mine':''} ${x.hid?'hid':''}" data-i="${i}"><span class="ck"></span><span class="tx">${tx}${x.custom?'<span class="tag">추가</span>':''}</span>`+
      `<span class="ops">${x.custom?`<button class="sm" data-op="edit">고치기</button><button class="sm" data-op="del">지우기</button>`:`<button class="sm" data-op="hide">${x.hid?'되살리기':'숨기기'}</button>`}</span>`+
      (used?`<span class="use ${used>=3?'many':''}" title="이 문장을 쓴 학생 수">${used}명</span>`:'')+'</div>';
    shown++;
  });
  $('#bank').innerHTML=html||'<div class="empty"><b>맞는 문장이 없어요</b>검색어를 줄이거나 다른 묶음을 골라 보세요</div>';

function step(d){const st=Y().students;if(!st.length)return;let i=st.findIndex(s=>s.no===cur);i=Math.min(st.length-1,Math.max(0,i+d));pick(st[i].no)}

  const lines=$('#rosterTxt').value.split('\n').map(l=>l.trim()).filter(Boolean);
  const st=[];let auto=0;

  if(nos.size!==st.length)return alert('번호가 겹칩니다');
  const lost=Y().students.filter(s=>!nos.has(s.no)&&Object.values(Y().recs).some(r=>(r[s.no]||[]).length));
  if(lost.length&&!confirm(`명단에서 빠지는 학생의 기록도 지워집니다: ${lost.map(s=>s.name).join(', ')}\n계속할까요?`))return;
  lost.forEach(s=>Object.values(Y().recs).forEach(r=>delete r[s.no]));
  Y().students=st.sort((a,b)=>a.no-b.no);if(!nos.has(cur))cur=null;
  closeM();changed();renderTop();
};

/* 문장 추가 */
function fillAddCats(){
  const id=$('#addArea').value;
  $('#addCat').innerHTML=bankOf(id).cats.map(c=>`<option>${esc(c)}</option>`).join('')+'<option value="__new">+ 새 묶음…</option>';
  if(catSel!=='*'&&id===area)$('#addCat').value=catSel;
  $('#addNewCat').style.display=$('#addCat').value==='__new'?'':'none';
}
$('#btnAdd').onclick=()=>{$('#addArea').innerHTML=BANK.map(a=>`<option value="${a.id}" ${a.id===area?'selected':''}>${esc(a.name)}</option>`).join('');fillAddCats();$('#addTxt').value='';openM('#mAdd');$('#addTxt').focus()};
$('#addArea').onchange=fillAddCats;
$('#addCat').onchange=()=>{$('#addNewCat').style.display=$('#addCat').value==='__new'?'':'none';if($('#addCat').value==='__new')$('#addNewCat').focus()};
$('#addSave').onclick=()=>{
  const id=$('#addArea').value,cat=$('#addCat').value==='__new'?$('#addNewCat').value.trim():$('#addCat').value;
  if(!cat)return alert('묶음 이름을 쓰세요');
  const have=new Set(bankOf(id).list.map(x=>x.t));
  const ts=$('#addTxt').value.split('\n').map(t=>t.replace(/^[\s\d.)‣·•-]+(?=\S)/,'').trim()).filter(t=>t&&!have.has(t));
  if(!ts.length)return alert('추가할 새 문장이 없습니다 (이미 있는 문장은 건너뜁니다)');
  const arr=S.custom[id]||(S.custom[id]=[]);
  ts.forEach((t,i)=>arr.push({id:Date.now().toString(36)+i,cat,t}));
  bankCache={};$('#addTxt').value='';changed();toast(`${ts.length}개 추가했습니다`);
  if(id===area){catSel=cat;renderBank()}
};

/* 학급 전체 */
$('#btnAll').onclick=()=>{
  const lim=A().limit||1500;
  $('#allTitle').textContent=`${S.cur}학년도 ${A().name}`;
  $('#allBody').innerHTML=Y().students.map(s=>{const f=finalOf(s.no),b=neisBytes(f);
    return `<tr><td>${s.no}</td><td class="nm">${esc(s.name)}</td><td>${esc(f)||'<span class="muted">비어 있음</span>'}</td><td class="cnt">${[...f].length}자<br><span class="${b>lim?'over':''}">${b}B</span></td><td><button class="sm" data-cp="${s.no}">복사</button></td></tr>`}).join('');
  openM('#mAll');
};
$('#allBody').onclick=e=>{const b=e.target.closest('[data-cp]');b&&copy(finalOf(+b.dataset.cp))};
$('#allCopy').onclick=()=>copy(Y().students.map(s=>[s.no,s.name,finalOf(s.no)].join('\t')).join('\n'));
$('#allCsv').onclick=()=>{
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[['번호','이름',...BANK.map(a=>a.name)]].concat(Y().students.map(s=>[s.no,s.name,...BANK.map(a=>((Y().recs[a.id]||{})[s.no]||[]).join(' '))]));
  download(`행발_${S.cur}.csv`,'﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv');
};

/* 확정 */
$('#btnLock').onclick=()=>{
  const y=Y(),t=target(),short=y.students.filter(s=>recs(s.no).length<t);
  if(!confirm(`${S.cur}학년도 기록을 확정 저장할까요?`+(short.length?`\n\n(${A().name} 목표 ${t}개 미만: ${short.map(s=>s.name).join(', ')})`:'')+'\n\n확정하면 읽기 전용이 되고, 나중에 학년도에서 골라 다시 볼 수 있습니다.'))return;
  y.locked=true;y.lockedAt=new Date().toLocaleString('ko-KR');save();renderAll();
  if(confirm('확정했습니다. 지금 백업 파일도 저장할까요? (브라우저 기록이 지워져도 되살릴 수 있습니다)'))exportAll();
};

/* 백업 */
function exportAll(){
  const d={app:'haengbal',version:1,savedAt:new Date().toISOString(),years:S.years,custom:S.custom,hidden:S.hidden};
  download(`행발백업_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(d),'application/json');
  S.dirty=false;S.backupAt=Date.now();save();
}
$('#btnExport').onclick=exportAll;
$('#btnImport').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  let d;try{d=JSON.parse(await f.text())}catch(_){return alert('백업 파일을 읽지 못했습니다')}
  if(d.app!=='haengbal'||!d.years)return alert('행발 기록 도우미 백업 파일이 아닙니다');
  const clash=Object.keys(d.years).filter(y=>S.years[y]&&S.years[y].students.length);
  if(clash.length&&!confirm(`이미 있는 학년도(${clash.join(', ')})를 파일 내용으로 바꿉니다. 계속할까요?`))return;
  Object.assign(S.years,d.years);
  for(const id in d.custom||{}){const have=new Set((S.custom[id]||[]).map(c=>c.t));S.custom[id]=(S.custom[id]||[]).concat(d.custom[id].filter(c=>!have.has(c.t)))}
  Object.assign(S.hidden,d.hidden||{});
  const ys=Object.keys(d.years).sort();S.cur=ys[ys.length-1];cur=null;bankCache={};useCache=null;save();renderAll();
  toast(`${ys.join(', ')}학년도를 불러왔습니다`);
};
window.addEventListener('beforeunload',e=>{
  clearTimeout(saveT);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}
  if(GAS&&(inflight||pendingList().length)){push();e.preventDefault();e.returnValue=''}
});
$('#sync').onclick=()=>{if($('#sync').classList.contains('fail')){failN=0;S._loaded?push():pull(true)}};
document.addEventListener('visibilitychange',()=>{
  // 다른 기기에서 고친 내용 받기: 이 화면으로 돌아왔을 때, 보낼 것이 없고 30초가 지났으면
  if(document.visibilityState==='visible'&&S._loaded&&!inflight&&!pendingList().length&&Date.now()-lastPull>30000)pull(false);
});

renderAll();
if(GAS)pull(true);else S._loaded=true;
</script>
</body>
</html>
