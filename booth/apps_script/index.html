<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --ink:#1f2937; --muted:#6b7280; --bg:#fff8ef; --card:#fff; --main:#ff7a59; --main2:#ffb347; --ok:#16a34a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
         background:var(--bg); color:var(--ink); }
  .wrap { max-width:520px; margin:0 auto; padding:18px 16px 40px; }
  h1 { font-size:26px; margin:6px 0 2px; text-align:center; }
  .sub { text-align:center; color:var(--muted); margin:0 0 18px; font-size:14px; }
  .step { background:var(--card); border-radius:18px; padding:16px; margin-bottom:14px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
  .step h2 { font-size:17px; margin:0 0 10px; }
  .step h2 b { display:inline-block; width:26px; height:26px; line-height:26px; border-radius:50%; background:var(--main);
               color:#fff; text-align:center; font-size:14px; margin-right:6px; }
  input[type=text] { width:100%; font-size:17px; padding:12px; border:2px solid #f1e3d3; border-radius:12px; }
  .hint { color:var(--muted); font-size:13px; margin:8px 0 0; }
  .btn { display:block; width:100%; border:0; border-radius:14px; padding:15px; font-size:18px; font-weight:700;
         background:linear-gradient(90deg,var(--main),var(--main2)); color:#fff; }
  .btn.ghost { background:#fff; color:var(--main); border:2px solid var(--main); }
  .btn:disabled { opacity:.45; }
  #preview { display:none; width:100%; border-radius:12px; margin-top:12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .style { border:2px solid #f1e3d3; border-radius:14px; padding:10px; background:#fff; text-align:left; font-size:15px; }
  .style .e { font-size:26px; display:block; }
  .style small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .style.on { border-color:var(--main); background:#fff1ea; }
  .err { color:#dc2626; font-weight:700; text-align:center; min-height:20px; margin:10px 0; }
  .center { text-align:center; }
  .spin { width:64px; height:64px; margin:20px auto; border-radius:50%; border:7px solid #ffe2d6; border-top-color:var(--main);
          animation:r 1s linear infinite; }
  @keyframes r { to { transform:rotate(360deg); } }
  #result { width:100%; border-radius:16px; margin:10px 0; display:none; }
  .big { font-size:20px; font-weight:800; margin:8px 0; }
  a.btn { text-decoration:none; text-align:center; margin-top:10px; }
  .howto { text-align:left; background:#fff7ed; border-radius:12px; padding:10px 14px; margin:12px 0 0; font-size:14px; line-height:1.6; }
  .howto ol { margin:4px 0 0; padding-left:20px; }
  .badge { display:inline-block; padding:6px 12px; border-radius:99px; background:#e8f7ee; color:var(--ok); font-weight:700; margin:4px; }
  /* 큰 화면 모아 보기 */
  .wall { max-width:none; padding:24px; }
  .wall h1 { font-size:40px; }
  .wgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; }
  .wcard { background:#fff; border-radius:18px; padding:10px; box-shadow:0 2px 10px rgba(0,0,0,.07); }
  .wcard img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:12px; background:#f3f4f6; }
  .wcard .n { font-weight:800; font-size:18px; margin:8px 2px 0; }
  .wcard .s { color:var(--muted); font-size:14px; margin:2px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const VIEW = '<?= view ?>';
// 키·이름은 Code.gs의 STYLES, booth/styles.py와 같아야 한다.
const STYLES = [
  { key:'felt',       label:'양모펠트 인형',  e:'🧶', d:'보송보송 털실 인형' },
  { key:'clay',       label:'클레이 인형',    e:'🟠', d:'찰흙으로 빚은 인형' },
  { key:'anime2d',    label:'2D 애니메이션',  e:'📺', d:'TV 만화 주인공' },
  { key:'anim3d',     label:'3D 애니메이션',  e:'🎬', d:'극장 애니메이션 주인공' },
  { key:'plush',      label:'봉제 인형',      e:'🧸', d:'폭신한 천 인형' },
  { key:'pixel',      label:'픽셀아트 게임',  e:'🎮', d:'옛날 게임 캐릭터' },
  { key:'watercolor', label:'수채화 그림책',  e:'🎨', d:'그림책 속 주인공' },
  { key:'sticker',    label:'스티커',         e:'🌟', d:'흰 테두리 귀여운 스티커' }
];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const call = (fn, ...args) => new Promise((ok, no) =>
  google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...args));
const JOB_KEY = 'booth_job';
let photo = '', style = '', timer = null;

function formView() {
  $('#app').innerHTML = `<div class="wrap">
    <h1>🎨 캐릭터 공방</h1>
    <p class="sub">내가 그린 캐릭터를 AI가 새로운 모습으로 바꿔 줘요</p>
    <div class="step"><h2><b>1</b>내 별명</h2>
      <input id="nick" type="text" maxlength="12" placeholder="예: 별빛토끼, 3번" autocomplete="off">
      <p class="hint">진짜 이름 대신 별명이나 번호를 적어요. 패들렛과 사진에 이 별명이 나와요.</p></div>
    <div class="step"><h2><b>2</b>그림 찍기</h2>
      <button class="btn ghost" id="shot">📷 내 그림 찍기</button>
      <input id="file" type="file" accept="image/*" capture="environment" hidden>
      <img id="preview" alt="찍은 그림">
      <p class="hint">얼굴은 찍지 말고, <b>캐릭터 그림만</b> 화면에 꽉 차게 찍어요.</p></div>
    <div class="step"><h2><b>3</b>어떤 모습으로 바꿀까요?</h2>
      <div class="grid">${STYLES.map(s => `<button class="style" data-k="${s.key}"><span class="e">${s.e}</span>${s.label}<small>${s.d}</small></button>`).join('')}</div></div>
    <div class="step"><h2><b>4</b>캐릭터 소개 <small style="color:#6b7280;font-weight:400">(안 써도 돼요)</small></h2>
      <input id="intro" type="text" maxlength="60" placeholder="예: 축구를 좋아하고 노래를 잘해요">
      <p class="hint">취미·특기를 적으면 AI가 그림에 살짝 담아 줘요.</p></div>
    <div class="err" id="err"></div>
    <button class="btn" id="send" disabled>보내기 🚀</button>
  </div>`;
  $('#shot').onclick = () => $('#file').click();
  $('#file').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { photo = await shrink(f); $('#preview').src = photo; $('#preview').style.display = 'block'; $('#shot').textContent = '📷 다시 찍기'; }
    catch (err) { $('#err').textContent = '사진을 읽지 못했어요. 다시 찍어 주세요.'; }
    ready();
  };
  document.querySelectorAll('.style').forEach(b => b.onclick = () => {
    style = b.dataset.k; document.querySelectorAll('.style').forEach(x => x.classList.toggle('on', x === b)); ready();
  });
  $('#nick').oninput = ready;
  $('#send').onclick = send;
}

function ready() { $('#send').disabled = !($('#nick').value.trim() && photo && style); }

// 폰 사진(수 MB)을 긴 변 1600px JPEG로 줄인다. 회전 정보(EXIF)는 브라우저가 반영한다.
async function shrink(file) {
  let img;
  try { img = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(file); }); }
  const k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85);
}

async function send() {
  $('#send').disabled = true; $('#send').textContent = '보내는 중…'; $('#err').textContent = '';
  try {
    const r = await call('submitDrawing', { nickname: $('#nick').value, style, intro: $('#intro').value, image: photo });
    localStorage.setItem(JOB_KEY, r.id);
    waitView(r.id);
  } catch (err) {
    $('#err').textContent = (err && err.message) || '보내지 못했어요. 다시 눌러 주세요.';
    $('#send').textContent = '보내기 🚀'; ready();
  }
}

function waitView(id) {
  $('#app').innerHTML = `<div class="wrap center">
    <h1>🎨 캐릭터 공방</h1>
    <div class="step"><div class="spin" id="spin"></div>
      <div class="big" id="msg">보냈어요!</div><p class="hint" id="hint"></p>
      <img id="result" alt="완성된 캐릭터">
      <div id="badges"></div>
      <div id="share"></div></div>
    <button class="btn ghost" id="again">✏️ 다른 캐릭터 또 만들기</button>
  </div>`;
  $('#again').onclick = () => { if (timer) clearTimeout(timer); localStorage.removeItem(JOB_KEY); photo = ''; style = ''; formView(); };
  poll(id);
}

let shown = false;
async function poll(id) {
  let st;
  try { st = await call('getStatus', id); } catch (e) { timer = setTimeout(() => poll(id), 6000); return; }
  if (st.status === 'missing') { localStorage.removeItem(JOB_KEY); formView(); return; }
  const msg = $('#msg'), hint = $('#hint');
  if (st.status === '대기') {
    msg.textContent = st.ahead > 0 ? `앞에 ${st.ahead}명이 기다리고 있어요` : '곧 그리기 시작해요!';
    hint.textContent = st.note || (st.workerOnline ? `${st.nickname}의 그림을 ${st.styleLabel}(으)로 바꿀 거예요.` : '부스 컴퓨터가 준비되면 시작해요. 잠깐만 기다려 주세요.');
  } else if (st.status === '변환 중') {
    msg.textContent = `AI가 ${st.styleLabel}(으)로 그리는 중… 🖌️`;
    hint.textContent = '1~2분쯤 걸려요. 이 화면을 켜 두세요.';
  } else if (st.status === '완성') {
    $('#spin').style.display = 'none';
    msg.textContent = `${st.nickname}의 캐릭터 완성! 🎉`;
    hint.textContent = '';
    if (!shown && st.hasResult) {
      shown = true;
      call('getResultImage', id).then(src => { if (src) { $('#result').src = src; $('#result').style.display = 'block'; } });
    }
    $('#badges').innerHTML = (st.printed ? '<span class="badge">🖨️ 인쇄했어요</span>' : '') +
                             (st.padlet ? '<span class="badge">📌 패들렛에 올렸어요</span>' : '');
    if (!$('#share').innerHTML) $('#share').innerHTML = shareBox(st);
    if ((st.printed && st.padlet) || shownLong(id)) return;   // 인쇄·패들렛이 꺼져 있어도 2분 뒤엔 그만 묻는다
  } else if (st.status === '오류') {
    $('#spin').style.display = 'none';
    msg.textContent = '앗, 이번엔 잘 안 됐어요 😢';
    hint.textContent = st.note || '선생님께 말해 주세요. 다시 만들어 줄게요.';
    return;
  }
  timer = setTimeout(() => poll(id), 5000);
}
// 완성 그림 저장 + (자동 게시가 아니면) 아이가 직접 패들렛에 올리는 버튼
function shareBox(st) {
  let h = '<p class="hint">그림을 <b>꾹 누르면</b> 내 폰에 저장할 수 있어요.</p>';
  if (st.resultUrl) h += `<a class="btn ghost" href="${esc(st.resultUrl)}" target="_blank" rel="noopener">🔍 크게 보기·저장</a>`;
  if (st.padletUrl && !st.padlet) {
    h += `<a class="btn" href="${esc(st.padletUrl)}" target="_blank" rel="noopener">📌 패들렛에 올리기</a>
      <div class="howto"><b>패들렛에 올리는 방법</b><ol>
        <li>위 그림을 꾹 눌러 <b>사진 저장</b></li>
        <li>📌 버튼 → 패들렛에서 <b>＋</b> 누르기</li>
        <li>저장한 그림을 올리고, 제목에 <b>${esc(st.nickname)}</b>(내 별명) 적기 → 게시</li></ol></div>`;
  }
  return h;
}
const doneAt = {};
function shownLong(id) { doneAt[id] = doneAt[id] || Date.now(); return Date.now() - doneAt[id] > 120000; }

async function wallView() {
  document.body.style.background = '#fff8ef';
  $('#app').innerHTML = `<div class="wrap wall"><h1>🎨 캐릭터 공방 갤러리</h1><p class="sub" id="wsub"></p><div class="wgrid" id="wgrid"></div></div>`;
  const tick = async () => {
    try {
      const d = await call('getWall', 30);
      $('#wsub').textContent = d.waiting ? `지금 ${d.waiting}명의 캐릭터를 그리는 중이에요` : 'QR을 찍고 내 캐릭터를 보내 보세요!';
      $('#wgrid').innerHTML = d.items.map(it => `<div class="wcard"><img src="${esc(it.url)}" alt=""><div class="n">${esc(it.nickname)}</div><div class="s">${esc(it.styleLabel)}${it.intro ? ' · ' + esc(it.intro) : ''}</div></div>`).join('');
    } catch (e) { /* 다음 차례에 다시 */ }
    setTimeout(tick, 15000);
  };
  tick();
}

if (VIEW === 'wall') wallView();
else { const id = localStorage.getItem(JOB_KEY); id ? waitView(id) : formView(); }
</script>
</body>
</html>
