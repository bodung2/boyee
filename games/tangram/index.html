<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>칠교 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* VOICE: 유아 교실의 놀이 — 밝고 다정하게, 글은 짧게
   IDEA: 나무 칠교 상자 — 원목 판 위의 짙은 그림자 자리에 색 조각을 끼워 넣는다
   PICTURE: 게임판 자체(그림자 모양 + 조각 상자)가 첫 화면의 그림
   COLOUR and TYPE: 해바라기 노랑 바탕, 원목 판, 토마토 빨강 강조 / Jua 제목 + Gowun Dodum 본문
   LAYOUT: 위에 작은 머리띠(단계·시간·버튼), 아래 게임판이 화면을 채움; 넓으면 조각 상자가 오른쪽, 좁으면 아래 */
:root{color-scheme:light dark;
  --bg:light-dark(#ffd23f,#22160b);--ink:light-dark(#2b1a0e,#fbe9cf);--soft:light-dark(#6b4a2a,#d8bf9c);
  --wood:light-dark(#f4d6a0,#4a3220);--wood2:light-dark(#ebc78b,#3e2a1a);--frame:light-dark(#b9763a,#2c1d10);
  --hole:light-dark(#4a2d17,#0f0904);--tray:light-dark(rgba(120,70,20,.14),rgba(0,0,0,.28));
  --accent:#e8483b;--card:light-dark(#fffaf0,#2f2013);--line:light-dark(#e6cfa8,#4d3826)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Gowun Dodum",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px max(3vw,12px) 8px}
h1{font:400 clamp(26px,4vw,36px)/1.05 Jua,sans-serif;margin:0;letter-spacing:.01em}
.who{display:flex;align-items:center;gap:8px;margin-inline-start:auto;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:2px solid var(--ink);background:transparent;font-family:Jua,sans-serif;font-size:17px}
.chip.solid{background:var(--ink);color:var(--bg)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:0 max(3vw,12px) 10px}
.stage-no{font:400 30px/1 Jua,sans-serif}
.stage-sub{color:var(--soft);font-size:15px}
.clock{font:400 22px/1 Jua,sans-serif;font-variant-numeric:tabular-nums;margin-inline-start:auto;white-space:nowrap}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;min-width:44px;padding:0 14px;border-radius:14px;border:0;background:var(--card);box-shadow:0 3px 0 var(--frame);font-family:Jua,sans-serif;font-size:17px;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--frame)}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:22px;height:22px}
.btn.go{background:var(--accent);color:#fff;box-shadow:0 3px 0 #a72a20}
.board{margin:0 max(3vw,12px);padding:10px;border-radius:22px;background:var(--frame);box-shadow:0 10px 0 rgba(0,0,0,.14)}
.board-in{border-radius:14px;overflow:hidden;background:repeating-linear-gradient(97deg,var(--wood) 0 22px,var(--wood2) 22px 24px,var(--wood) 24px 61px,var(--wood2) 61px 62px)}
#svg{display:block;width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.piece{cursor:grab;stroke-linejoin:round;transition:filter .2s}
.piece.sel{stroke:#fff;stroke-width:.07}
.won .piece{animation:pop .6s ease-out}
@keyframes pop{50%{filter:brightness(1.3)}}
.flash{animation:flash .6s ease-in-out 4}
@keyframes flash{50%{opacity:.15}}
.tip{padding:12px max(3vw,12px) 24px;color:var(--soft);font-size:15px;max-width:70ch}
.dlg{position:fixed;inset:0;display:none;place-items:center;background:rgba(30,15,5,.55);padding:16px;z-index:5}
.dlg.open{display:grid}
.card{background:var(--card);border-radius:24px;padding:22px clamp(16px,4vw,30px);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 10px 0 var(--frame)}
.card h2{font:400 32px/1.1 Jua,sans-serif;margin:0 0 6px}
.card p{margin:6px 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text]{font:inherit;font-size:20px;min-height:52px;width:100%;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.names{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.names button{min-height:44px;padding:0 14px;border-radius:22px;border:2px solid var(--line);background:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin:6px 0 16px}
.grid button{min-height:48px;border-radius:12px;border:0;background:var(--wood);font-family:Jua,sans-serif;font-size:18px;position:relative}
.grid button.done{background:#2bb673;color:#fff}
.grid button.now{outline:3px solid var(--accent)}
.grid button:disabled{opacity:.35;cursor:default}
.tier{font:400 18px/1 Jua,sans-serif;margin:12px 0 4px}
.big{font:400 clamp(40px,9vw,64px)/1 Jua,sans-serif;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:16px}
th{font-weight:400;font-family:Jua,sans-serif;text-align:start;color:var(--soft);padding:6px 4px;border-bottom:2px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid var(--line)}
td.num,th.num{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.me td{background:light-dark(#fff1c2,#4a3410)}
.rank{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-family:Jua,sans-serif}
.r1{background:#f7c531;color:#2b1a0e}.r2{background:#cfd6dd;color:#2b1a0e}.r3{background:#e39a5b;color:#2b1a0e}
.del{border:0;background:transparent;color:var(--soft);min-height:36px;font-size:14px;text-decoration:underline}
.note{font-size:14px;color:var(--soft)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.confetti i{position:absolute;top:-20px;width:12px;height:12px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media(prefers-reduced-motion:reduce){.won .piece,.flash,.confetti i{animation:none}.confetti{display:none}}
@media(max-width:600px){.stage-no{font-size:26px}.clock{font-size:20px}.btn span{display:none}.btn{padding:0 10px}}
</style>
</head>
<body>
<header class="top">
  <h1>칠교 놀이터</h1>
  <div class="who">
    <button class="chip" id="bStages" type="button">단계 고르기</button>
    <button class="chip" id="bBoard" type="button">순위표</button>
    <button class="chip solid" id="bName" type="button">이름 넣기</button>
  </div>
</header>
<div class="bar">
  <div><div class="stage-no" id="stageNo">1단계</div><div class="stage-sub" id="stageSub"></div></div>
  <div class="tools">
    <button class="btn" id="bRotL" type="button" aria-label="왼쪽으로 돌리기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 11a8 8 0 1 1 2.3 5.7"/><path d="M4 5v6h6"/></svg><span>돌리기</span></button>
    <button class="btn" id="bRotR" type="button" aria-label="오른쪽으로 돌리기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg><span>돌리기</span></button>
    <button class="btn" id="bFlip" type="button" aria-label="뒤집기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M9 7 3 17h6z"/><path d="M15 7l6 10h-6z"/></svg><span>뒤집기</span></button>
    <button class="btn" id="bHint" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span>힌트</span></button>
    <button class="btn" id="bReset" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M3 12h13M10 6l-6 6 6 6"/><path d="M20 5v14"/></svg><span>처음부터</span></button>
  </div>
  <div class="clock" id="clock" aria-live="off">0:00</div>
</div>
<main class="board"><div class="board-in"><svg id="svg" role="img" aria-label="칠교 놀이판"></svg></div></main>
<p class="tip">조각을 끌어다 그림자 자리에 놓아요. 조각을 <b>톡</b> 누르면 빙글 돌아가고, 평행사변형은 <b>뒤집기</b>로 뒤집어요. 그림자를 빈틈없이 채우면 성공!</p>

<div class="dlg" id="dlgName" role="dialog" aria-modal="true" aria-labelledby="hName"><form class="card" id="fName">
  <h2 id="hName">누가 놀이할까요?</h2>
  <p>이름이나 별명을 써 주세요. 순위표에 이 이름으로 기록돼요.</p>
  <input type="text" id="iName" maxlength="12" autocomplete="off" placeholder="예: 별님반 하늘">
  <div class="names" id="names"></div>
  <div class="row"><button class="btn go" type="submit">시작하기</button><button class="btn" type="button" data-close>닫기</button></div>
  <p class="note" id="nameNote"></p>
</form></div>

<div class="dlg" id="dlgWin" role="dialog" aria-modal="true" aria-labelledby="hWin"><div class="card">
  <h2 id="hWin">성공!</h2>
  <div class="big" id="winTime">0:00</div>
  <p id="winMsg"></p>
  <div class="row"><button class="btn go" id="bNext" type="button">다음 단계</button><button class="btn" id="bAgain" type="button">한 번 더</button><button class="btn" id="bWinBoard" type="button">순위표</button></div>
</div></div>

<div class="dlg" id="dlgStages" role="dialog" aria-modal="true" aria-labelledby="hStages"><div class="card">
  <h2 id="hStages">단계 고르기</h2>
  <p class="note">초록 칸은 성공한 단계예요. 다음 단계까지 열려 있어요.</p>
  <div id="stageGrid"></div>
  <button class="btn" type="button" data-close>닫기</button>
</div></div>

<div class="dlg" id="dlgBoard" role="dialog" aria-modal="true" aria-labelledby="hBoard"><div class="card">
  <h2 id="hBoard">순위표</h2>
  <p class="note" id="boardNote"></p>
  <table><thead><tr><th>순위</th><th>이름</th><th class="num">단계</th><th class="num">걸린 시간</th><th></th></tr></thead><tbody id="boardRows"></tbody></table>
  <p class="note">많은 단계를 깬 사람이 앞, 같으면 성공한 단계의 최고 기록을 더한 시간이 짧은 사람이 앞이에요.</p>
  <button class="btn" type="button" data-close>닫기</button>
</div></div>

// ---------- 조각 (generate_levels.mjs와 같은 정의) ----------
const SHAPES = {L:[[0,0],[2,0],[0,2]], M:[[0,0],[2,0],[1,1]], S:[[0,0],[1,0],[0,1]], Q:[[0,0],[1,0],[1,1],[0,1]], P:[[0,0],[1,0],[2,1],[1,1]]};
const NAMES = {L:'큰 삼각형', M:'중간 삼각형', S:'작은 삼각형', Q:'정사각형', P:'평행사변형'};
const COLORS = {L:['#e8483b','#f28b2d'], M:['#f7c531'], S:['#2bb673','#1fa3c4'], Q:['#3a7bd5'], P:['#9b59d0']};
const R2 = Math.SQRT1_2, DIRS = [[1,0],[R2,R2],[0,1],[-R2,R2],[-1,0],[-R2,-R2],[0,-1],[R2,-R2]];
const TS = 0.5, CELL = 1.7, M = 1.3;

const poly = p => {
  let pts = SHAPES[p.t].map(([a,b]) => [p.f ? -a : a, b]);
  if (p.f) pts.reverse();
  const [c,s] = DIRS[p.k];
  return pts.map(([a,b]) => [a*c - b*s + p.x, a*s + b*c + p.y]);
};
const center = P => [P.reduce((s,v)=>s+v[0],0)/P.length, P.reduce((s,v)=>s+v[1],0)/P.length];
function setCenter(p, cx, cy){ const c = center(poly({...p, x:0, y:0})); p.x = cx - c[0]; p.y = cy - c[1]; }
function inside(P, x, y){
  for (let i = 0; i < P.length; i++){ const [x1,y1] = P[i], [x2,y2] = P[(i+1)%P.length];
    if ((x2-x1)*(y-y1) - (y2-y1)*(x-x1) < -1e-9) return false; }
  return true;
}
function sameShape(A, B, tol = 0.03){ // 같은 자리(대칭 조각은 돌려도 같음)인가
  if (A.length !== B.length) return false;
  return A.every(a => B.some(b => Math.hypot(a[0]-b[0], a[1]-b[1]) < tol));
}
function rng(seed){ let a = seed>>>0; return () => { a = (a+0x6D2B79F5)>>>0; let t = a; t = Math.imul(t^(t>>>15), t|1); t ^= t + Math.imul(t^(t>>>7), t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = sec => { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec/3600), m = Math.floor(sec/60)%60, s = sec%60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0'); };
const $ = id => document.getElementById(id);
const svg = $('svg'), NS = 'http://www.w3.org/2000/svg';

// ---------- 기록 저장 (이 기기 + 공유 순위표) ----------
const store = {
  get(k, d){ try { const v = localStorage.getItem('tangram.' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem('tangram.' + k, JSON.stringify(v)); } catch {} },
};
let players = store.get('players', {});       // 이름 → {name,best:{n:초},hints:{n:개}}
let me = store.get('current', null);
let db = null, remoteRows = null, writing = Promise.resolve(), canWrite = true;
const docId = name => 'p' + Array.from(new TextEncoder().encode(name), b => b.toString(16).padStart(2,'0')).join('');
function summary(pl){
  const best = pl.best || {}; let cleared = 0; while (best[cleared+1] != null) cleared++;
  const total = Object.keys(best).filter(n => +n <= cleared).reduce((s,n) => s + best[n], 0);
  return {cleared, total, solved: Object.keys(best).length};
}
function mergeBest(a = {}, b = {}){ const o = {...a}; for (const k in b) if (typeof b[k] === 'number' && b[k] >= 0 && (o[k] == null || b[k] < o[k])) o[k] = b[k]; return o; }
function saveRemote(pl){
  if (!db || !canWrite) return;
  const s = summary(pl);
  const body = {name: pl.name, best: pl.best, cleared: s.cleared, total: s.total, solved: s.solved, updated: new Date().toISOString()};
  writing = writing.then(() => db.doc('scores/' + docId(pl.name)).set(body)).catch(e => {
    if (e && e.code === 'invalid_argument') { canWrite = false; return setBoardNote(); } // 공유 순위표에 쓸 권한이 없는 방문자
    $('boardNote').textContent = '공유 순위표에 저장하지 못했어요(' + (e && e.code || '오류') + '). 이 기기에는 저장돼 있어요.';
  });
}
async function pullRemote(name){
  if (!db || !name) return;
  try {
    const snap = await db.doc('scores/' + docId(name)).get();
    const pl = players[name] || {name, best:{}, hints:{}};
    const before = JSON.stringify(pl.best);
    if (snap.exists){ const d = snap.data(); pl.best = mergeBest(pl.best, d.best); }
    players[name] = pl; store.set('players', players);
    if (!snap.exists || JSON.stringify(snap.data().best) !== JSON.stringify(pl.best)) saveRemote(pl);
    if (before !== JSON.stringify(pl.best)) updateHeader();
  } catch {}
}
function connectDb(){
  if (!window.claude || typeof window.claude.use !== 'function') return setBoardNote();
  window.claude.use('db').then(d => {
    db = d; setBoardNote();
    if (!db) return;
    let timer = setTimeout(() => { $('boardNote').textContent = '공유 순위표를 아직 불러오지 못했어요. 잠시 뒤 다시 열어 보세요.'; }, 10000);
    db.collection('scores').orderBy('cleared','desc').limit(300).onSnapshot(snap => {
      if (!snap.metadata.fromCache) { clearTimeout(timer); setBoardNote(); }
      remoteRows = snap.docs.map(d => d.data()).filter(r => r && typeof r.name === 'string');
      if ($('dlgBoard').classList.contains('open')) renderBoard();
    }, e => { clearTimeout(timer); $('boardNote').textContent = '공유 순위표를 열 수 없어요(' + (e && e.code || '오류') + '). 이 기기 기록을 보여 줘요.'; remoteRows = null; });
    if (me) pullRemote(me);
  }).catch(() => setBoardNote());
}
function setBoardNote(){
  $('boardNote').textContent = !db ? '이 기기에서 놀이한 친구들의 기록이에요. (claude.ai에 로그인하면 모두의 순위표가 보여요)'
    : canWrite ? '이 놀이판을 여는 모든 친구의 기록이 함께 보여요.'
    : '모두의 순위표를 보고 있어요. 이 계정의 기록은 이 기기에만 저장돼 다른 사람에게는 보이지 않아요.';
  $('nameNote').textContent = db ? '순위표는 이 놀이판을 함께 쓰는 사람에게 보여요. 별명을 써도 좋아요.' : '';
}

// ---------- 단계 준비 ----------
let LV, slots, pieces, layout, sel = null, startT = 0, hintsUsed = 0, solved = false, samples, outlineAnchors;
let gTarget, gHint, gTray, gPieces;

function loadLevel(n){
  n = Math.max(1, Math.min(LEVELS.length, n));
  LV = LEVELS[n-1]; solved = false; hintsUsed = 0; sel = null;
  const raw = LV.s.map(([t,k,f,x,y]) => ({t, k, f: !!f, x, y}));
  let w = 0, h = 0; for (const s of raw) for (const [x,y] of poly(s)) { w = Math.max(w,x); h = Math.max(h,y); }
  const PW = Math.max(w + 2*M, 6.2), PH = Math.max(h + 2*M, 5.6), ox = (PW - w)/2, oy = (PH - h)/2;
  slots = raw.map(s => { const o = {...s, x: s.x + ox, y: s.y + oy}; o.P = poly(o); return o; });
  layout = {PW, PH, tw: w, th: h};
  const rnd = rng(n * 104729 + 7), steps = LV.rot === 90 ? [0,2,4,6] : [0,1,2,3,4,5,6,7];
  const order = slots.map((_, i) => i).sort(() => rnd() - .5);
  const seen = {};
  pieces = slots.map((s, i) => {
    const ci = seen[s.t] = (seen[s.t] || 0) + 1;
    return {id: i, t: s.t, k: LV.same ? s.k : steps[Math.floor(rnd()*steps.length)], f: LV.same ? s.f : (s.t === 'P' && LV.n > 35 ? rnd() < .5 : false),
      x: 0, y: 0, tray: true, cell: order.indexOf(i), color: COLORS[s.t][(ci-1) % COLORS[s.t].length]};
  });
  // 정답 판정용 표본점과, 끝점 맞춤용 테두리 꼭짓점
  samples = [];
  const st = 0.08;
  for (let y = oy - .4 + .031; y < oy + h + .4; y += st) for (let x = ox - .4 + .029; x < ox + w + .4; x += st)
    samples.push([x, y, slots.some(s => inside(s.P, x, y))]);
  outlineAnchors = [];
  for (const s of slots) for (const v of s.P) {
    const out = [...Array(12)].some((_, i) => { const a = i*Math.PI/6, px = v[0] + .06*Math.cos(a), py = v[1] + .06*Math.sin(a); return !slots.some(z => inside(z.P, px, py)); });
    if (out && !outlineAnchors.some(a => Math.hypot(a[0]-v[0], a[1]-v[1]) < .01)) outlineAnchors.push(v);
  }
  startT = performance.now();
  buildSvg(); fit(); updateHeader();
  if (me) { const pl = players[me]; if (pl) { pl.last = n; store.set('players', players); } }
}

// 조각들을 합친 바깥 테두리 하나만 그린다 — 조각마다 따로 그리면 이음매가 가는 선으로 비쳐 답이 보인다
function outlinePath(polys){
  const key = v => Math.round(v[0]*1e4) + ',' + Math.round(v[1]*1e4);
  const verts = [];
  for (const P of polys) for (const v of P) if (!verts.some(u => Math.hypot(u[0]-v[0], u[1]-v[1]) < 1e-4)) verts.push(v);
  const segs = new Map();
  for (const P of polys) P.forEach((a, i) => {
    const b = P[(i+1) % P.length], dx = b[0]-a[0], dy = b[1]-a[1], L2 = dx*dx + dy*dy;
    const on = verts.map(v => [((v[0]-a[0])*dx + (v[1]-a[1])*dy) / L2, v])
      .filter(([t, v]) => t > 1e-6 && t < 1 - 1e-6 && Math.abs((v[0]-a[0])*dy - (v[1]-a[1])*dx) / Math.sqrt(L2) < 1e-4)
      .sort((p, q) => p[0] - q[0]).map(x => x[1]);
    const chain = [a, ...on, b];
    for (let j = 0; j < chain.length - 1; j++) {
      const p = chain[j], q = chain[j+1], k = key(p) + '|' + key(q), rk = key(q) + '|' + key(p);
      if (segs.has(rk)) segs.delete(rk); else segs.set(k, [p, q]);   // 두 조각이 맞닿은 안쪽 변은 지운다
    }
  });
  const out = new Map();
  for (const [p, q] of segs.values()) { const k = key(p); if (!out.has(k)) out.set(k, []); out.get(k).push([p, q]); }
  let d = '', guard = segs.size + 5;
  for (const list of out.values()) while (list.length) {
    let [p, q] = list.pop(); const start = key(p);
    d += 'M' + p[0].toFixed(4) + ',' + p[1].toFixed(4);
    while (key(q) !== start && guard-- > 0) {
      d += 'L' + q[0].toFixed(4) + ',' + q[1].toFixed(4);
      const nx = out.get(key(q)); if (!nx || !nx.length) break;
      q = nx.pop()[1];
    }
    d += 'Z';
  }
  return d;
}

function buildSvg(){
  svg.innerHTML = `<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx=".05" dy=".08" stdDeviation=".05" flood-color="#2b1500" flood-opacity=".35"/></filter></defs>
    <g id="gTray"></g><g id="gTarget"></g><g id="gHint"></g><g id="gPieces"></g>`;
  gTray = svg.querySelector('#gTray'); gTarget = svg.querySelector('#gTarget'); gHint = svg.querySelector('#gHint'); gPieces = svg.querySelector('#gPieces');
  gTarget.innerHTML = `<path d="${outlinePath(slots.map(s => s.P))}" fill="var(--hole)" stroke="var(--hole)" stroke-width=".02" stroke-linejoin="miter"/>`;
  gPieces.innerHTML = pieces.map(p => `<polygon class="piece" data-i="${p.id}" fill="${p.color}" stroke="rgba(0,0,0,.28)" stroke-width=".035" filter="url(#sh)"><title>${NAMES[p.t]}</title></polygon>`).join('');
}

// 넓은 화면이면 조각 상자를 오른쪽에, 좁으면 아래에
function fit(){
  const {PW, PH} = layout, N = pieces.length, W = svg.parentElement.clientWidth || 600;
  const Hmax = Math.max(340, window.innerHeight - svg.parentElement.getBoundingClientRect().top - 90);
  const right = (() => { const rows = Math.max(2, Math.floor((PH - .3) / CELL)), cols = Math.ceil(N / rows);
    return {mode:'right', rows, cols, tx: PW, ty: .15, tw: cols*CELL + .3, th: PH - .3, vw: PW + cols*CELL + .45, vh: PH}; })();
  const bottom = (() => { const cols = Math.max(2, Math.floor((PW - .3) / CELL)), rows = Math.ceil(N / cols);
    return {mode:'bottom', rows, cols, tx: .15, ty: PH, tw: PW - .3, th: rows*CELL + .3, vw: PW, vh: PH + rows*CELL + .45}; })();
  const sc = L => Math.min(W / L.vw, Hmax / L.vh);
  const L = W >= 640 && sc(right) >= sc(bottom) * 0.97 ? right : bottom;
  Object.assign(layout, L);
  svg.setAttribute('viewBox', `0 0 ${L.vw} ${L.vh}`);
  svg.style.height = Math.round(L.vh * sc(L)) + 'px';
  gTray.innerHTML = `<rect x="${L.tx}" y="${L.ty}" width="${L.tw}" height="${L.th}" rx=".35" fill="var(--tray)"/>`;
  for (const p of pieces) if (!p.tray && !inPlay(center(poly(p)))) p.tray = true;
  for (const p of pieces) draw(p);
}
const inPlay = ([x, y]) => x > 0 && y > 0 && x < layout.PW && y < layout.PH;
function cellCenter(i){
  const L = layout, c = L.mode === 'right' ? Math.floor(i / L.rows) : i % L.cols, r = L.mode === 'right' ? i % L.rows : Math.floor(i / L.cols);
  return [L.tx + .15 + (c + .5) * CELL, L.ty + .15 + (r + .5) * CELL];
}
function shown(p){
  const P = poly(p);
  if (!p.tray) return P;
  const c = center(P), [cx, cy] = cellCenter(p.cell);
  return P.map(v => [cx + (v[0]-c[0]) * TS, cy + (v[1]-c[1]) * TS]);
}
function draw(p){
  const el = gPieces.querySelector(`[data-i="${p.id}"]`);
  el.setAttribute('points', shown(p).map(v => v[0].toFixed(4) + ',' + v[1].toFixed(4)).join(' '));
  el.classList.toggle('sel', sel === p);
}
function select(p){ const old = sel; sel = p; if (old) draw(old); if (p) draw(p); updateTools(); }
function updateTools(){
  $('bRotL').disabled = $('bRotR').disabled = !sel || solved;
  $('bFlip').disabled = !sel || sel.t !== 'P' || solved;
}

// ---------- 돌리기 · 뒤집기 ----------
function rotate(p, dir){
  const c = center(poly(p)), step = LV.rot === 90 ? 2 : 1;
  p.k = (p.k + dir*step + 8) % 8; setCenter(p, c[0], c[1]);
  if (!p.tray) snap(p); draw(p); check();
}
function flip(p){
  if (p.t !== 'P') return;
  const c = center(poly(p)); p.f = !p.f; setCenter(p, c[0], c[1]);
  if (!p.tray) snap(p); draw(p); check();
}

// ---------- 끌어다 놓기 ----------
let drag = null;
function toWorld(e){ const m = svg.getScreenCTM().inverse(), pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(m); return [pt.x, pt.y]; }
svg.addEventListener('pointerdown', e => {
  const el = e.target.closest('.piece'); if (!el || solved) return;
  const p = pieces[+el.dataset.i], w = toWorld(e), c = center(poly(p));
  drag = {p, sx: e.clientX, sy: e.clientY, moved: false, off: p.tray ? [0, 0] : [c[0]-w[0], c[1]-w[1]], id: e.pointerId};
  svg.setPointerCapture(e.pointerId);
  gPieces.appendChild(el); select(p); e.preventDefault();
});
svg.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 7) return;
  drag.moved = true;
  const p = drag.p, w = toWorld(e);
  p.tray = false;
  const L = layout;
  setCenter(p, Math.min(L.vw - .2, Math.max(.2, w[0] + drag.off[0])), Math.min(L.vh - .2, Math.max(.2, w[1] + drag.off[1])));
  draw(p);
});
function endDrag(e){
  if (!drag || e.pointerId !== drag.id) return;
  const p = drag.p, moved = drag.moved; drag = null;
  if (!moved) return rotate(p, 1);
  const c = center(poly(p));
  if (!inPlay(c)) { p.tray = true; draw(p); return check(); }
  snap(p); draw(p); check();
}
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);

// 정답 자리 가까이 오면 쏙, 아니면 가까운 꼭짓점끼리 붙이기
function snap(p){
  const P = poly(p), c = center(P);
  let best = null;
  for (const s of slots) {
    if (s.t !== p.t) continue;
    const sc = center(s.P), d = Math.hypot(sc[0]-c[0], sc[1]-c[1]);
    if (d > .55 || (best && d >= best.d)) continue;
    const moved = P.map(v => [v[0] + sc[0]-c[0], v[1] + sc[1]-c[1]]);
    if (sameShape(moved, s.P)) best = {d, dx: sc[0]-c[0], dy: sc[1]-c[1]};
  }
  if (!best) {
    const anchors = outlineAnchors.concat(...pieces.filter(q => q !== p && !q.tray).map(poly));
    for (const v of P) for (const a of anchors) {
      const d = Math.hypot(a[0]-v[0], a[1]-v[1]);
      if (d < .32 && (!best || d < best.d)) best = {d, dx: a[0]-v[0], dy: a[1]-v[1]};
    }
  }
  if (best) { p.x += best.dx; p.y += best.dy; }
}

// ---------- 성공 판정 ----------
function check(){
  if (solved || pieces.some(p => p.tray)) return;
  const Ps = pieces.map(poly);
  let tgt = 0, miss = 0, extra = 0, over = 0;
  for (const [x, y, t] of samples) {
    let n = 0; for (const P of Ps) if (inside(P, x, y)) n++;
    if (t) { tgt++; if (!n) miss++; } else if (n) extra++;
    if (n > 1) over++;
  }
  const lim = tgt * 0.015;
  if (miss <= lim && extra <= lim && over <= lim) win();
}
function win(){
  solved = true; select(null);
  const sec = Math.round((performance.now() - startT) / 1000), n = LV.n;
  $('svg').parentElement.classList.add('won');
  setTimeout(() => $('svg').parentElement.classList.remove('won'), 700);
  let msg = '';
  if (me) {
    const pl = players[me] || (players[me] = {name: me, best:{}, hints:{}});
    const prev = pl.best[n];
    if (prev == null || sec < prev) { pl.best[n] = sec; msg = prev == null ? '기록을 남겼어요.' : '새 최고 기록이에요! (전에는 ' + fmt(prev) + ')'; }
    else msg = '최고 기록은 ' + fmt(prev) + '이에요.';
    pl.hints = pl.hints || {}; pl.hints[n] = hintsUsed;
    store.set('players', players); saveRemote(pl);
  } else msg = '이름을 넣으면 순위표에 기록돼요.';
  if (hintsUsed) msg += ' 힌트 ' + hintsUsed + '번.';
  $('hWin').textContent = n === LEVELS.length ? '100단계 모두 성공!' : n + '단계 성공!';
  $('winTime').textContent = fmt(sec);
  $('winMsg').textContent = msg;
  $('bNext').hidden = n === LEVELS.length;
  confetti(); updateHeader(); updateTools();
  setTimeout(() => openDlg('dlgWin'), 650);
}
function confetti(){
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['#e8483b','#f28b2d','#f7c531','#2bb673','#1fa3c4','#3a7bd5','#9b59d0'];
  box.innerHTML = Array.from({length: 40}, (_, i) => `<i style="left:${(i*37)%100}%;background:${cols[i%7]};animation-delay:${(i%10)*.06}s;${i%3?'':'border-radius:50%'}"></i>`).join('');
  document.body.appendChild(box); setTimeout(() => box.remove(), 2600);
}

// ---------- 화면 위쪽 ----------
function updateHeader(){
  const n = LV.n, sub = [LV.s.length + '조각', LV.s.length > 7 ? '칠교판 2벌' : '칠교판 1벌'];
  sub.push(LV.rot === 90 ? '90°씩 돌리기' : '45°씩 돌리기');
  if (LV.name) sub.unshift(LV.name);
  $('stageNo').textContent = n + '단계';
  $('stageSub').textContent = sub.join(' · ');
  $('bName').textContent = me ? me : '이름 넣기';
  updateTools();
}
setInterval(() => { if (LV && !solved) $('clock').textContent = fmt((performance.now() - startT) / 1000); }, 500);

// ---------- 대화 상자 ----------
function openDlg(id){ for (const d of document.querySelectorAll('.dlg')) d.classList.remove('open'); $(id).classList.add('open');
  const f = $(id).querySelector('input,.go,button'); if (f) setTimeout(() => f.focus(), 30); }
function closeDlg(){ for (const d of document.querySelectorAll('.dlg')) d.classList.remove('open'); }
document.addEventListener('click', e => {
  if (e.target.matches('[data-close]') || e.target.classList.contains('dlg')) closeDlg();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') return closeDlg();
  if (document.querySelector('.dlg.open') || !sel) return;
  if (e.key === 'r' || e.key === 'ArrowRight') rotate(sel, 1);
  if (e.key === 'ArrowLeft') rotate(sel, -1);
  if (e.key === 'f') flip(sel);
});

function openName(){
  const list = Object.keys(players).sort((a, b) => a.localeCompare(b, 'ko'));
  $('names').innerHTML = list.map(n => `<button type="button" data-n="${esc(n)}">${esc(n)}</button>`).join('');
  $('iName').value = me || '';
  openDlg('dlgName');
}
$('names').addEventListener('click', e => { const b = e.target.closest('[data-n]'); if (b) { $('iName').value = b.dataset.n; $('fName').requestSubmit(); } });
$('fName').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('iName').value.replace(/\s+/g, ' ').trim().slice(0, 12);
  if (!name) { $('iName').focus(); return; }
  me = name; store.set('current', me);
  if (!players[me]) { players[me] = {name: me, best:{}, hints:{}}; store.set('players', players); }
  closeDlg(); pullRemote(me);
  const s = summary(players[me]);
  loadLevel(Math.min(LEVELS.length, s.cleared + 1));
});

function openStages(){
  const s = me && players[me] ? summary(players[me]) : {cleared: 0}, best = me && players[me] ? players[me].best : {};
  const tiers = [[1,20,'쉬움 — 조각 2~4개, 90°씩 돌리기'],[21,50,'보통 — 조각 4~7개, 45°씩 돌리기'],[51,80,'어려움 — 조각 7~11개'],[81,100,'도전 — 칠교판 2벌, 조각 11~14개']];
  $('stageGrid').innerHTML = tiers.map(([a, b, label]) => `<div class="tier">${label}</div><div class="grid">` +
    Array.from({length: b - a + 1}, (_, i) => { const n = a + i, done = best[n] != null, lock = n > s.cleared + 1 && !done;
      return `<button type="button" data-s="${n}" class="${done ? 'done' : ''} ${LV && LV.n === n ? 'now' : ''}" ${lock ? 'disabled' : ''} aria-label="${n}단계${done ? ' 성공' : ''}">${n}</button>`; }).join('') + '</div>').join('');
  openDlg('dlgStages');
}
$('stageGrid').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (b && !b.disabled) { closeDlg(); loadLevel(+b.dataset.s); } });

function boardRows(){ // 공유 순위표 + 이 기기 기록(공유 순위표에 못 쓰는 방문자도 자기 기록은 보이게)
  const best = {};
  for (const r of remoteRows || []) best[r.name] = mergeBest(best[r.name], r.best);
  for (const p of Object.values(players)) best[p.name] = mergeBest(best[p.name], p.best);
  return Object.keys(best).map(name => ({name, ...summary({best: best[name]})}));
}
let delArm = null;
function renderBoard(){
  const rows = boardRows().filter(r => r.cleared > 0).sort((a, b) => b.cleared - a.cleared || a.total - b.total).slice(0, 50);
  $('boardRows').innerHTML = rows.length ? rows.map((r, i) => `<tr class="${r.name === me ? 'me' : ''}">
    <td><span class="rank ${i < 3 ? 'r' + (i+1) : ''}">${i + 1}</span></td><td>${esc(r.name)}</td>
    <td class="num">${r.cleared}</td><td class="num">${fmt(r.total)}</td>
    <td class="num"><button class="del" type="button" data-del="${esc(r.name)}">${delArm === r.name ? '정말 지울까요?' : '지우기'}</button></td></tr>`).join('')
    : '<tr><td colspan="5">아직 기록이 없어요. 1단계부터 도전해 봐요!</td></tr>';
}
$('boardRows').addEventListener('click', async e => {
  const b = e.target.closest('[data-del]'); if (!b) return;
  const name = b.dataset.del;
  if (delArm !== name) { delArm = name; return renderBoard(); }
  delArm = null; delete players[name]; store.set('players', players);
  if (name === me) { me = null; store.set('current', null); updateHeader(); }
  if (db) { try { await db.doc('scores/' + docId(name)).delete(); } catch (err) { $('boardNote').textContent = '공유 순위표에서 지우지 못했어요(' + (err && err.code || '오류') + ').'; } }
  renderBoard();
});
function openBoard(){ delArm = null; renderBoard(); openDlg('dlgBoard'); }

$('bName').onclick = openName; $('bStages').onclick = openStages; $('bBoard').onclick = openBoard; $('bWinBoard').onclick = openBoard;
$('bNext').onclick = () => { closeDlg(); loadLevel(LV.n + 1); };
$('bAgain').onclick = () => { closeDlg(); loadLevel(LV.n); };
$('bReset').onclick = () => loadLevel(LV.n);
$('bRotL').onclick = () => sel && rotate(sel, -1);
$('bRotR').onclick = () => sel && rotate(sel, 1);
$('bFlip').onclick = () => sel && flip(sel);
$('bHint').onclick = () => {
  if (solved) return;
  const placed = pieces.filter(p => !p.tray).map(poly);
  const s = slots.find(z => !placed.some(P => sameShape(P, z.P)));
  if (!s) return;
  hintsUsed++;
  const el = document.createElementNS(NS, 'polygon');
  el.setAttribute('points', s.P.map(v => v.join(',')).join(' '));
  el.setAttribute('fill', 'rgba(255,255,255,.55)'); el.setAttribute('stroke', '#fff'); el.setAttribute('stroke-width', '.06');
  el.classList.add('flash'); gHint.appendChild(el); setTimeout(() => el.remove(), 2500);
};
let lastW = 0;
const ro = new ResizeObserver(() => { const w = svg.parentElement.clientWidth; if (LV && w !== lastW) { lastW = w; fit(); } });
ro.observe(svg.parentElement);
addEventListener('resize', () => LV && fit());

// ---------- 시작 ----------
if (me && !players[me]) me = null;
loadLevel(me ? Math.min(LEVELS.length, summary(players[me]).cleared + 1) : 1);
if (!me) openName();
connectDb();
window.__tangram = {levels: LEVELS, load: loadLevel, check, draw, solved: () => solved, slots: () => slots, pieces: () => pieces, solve(){ // 시험용
  for (const p of pieces) { const s = slots[p.id]; Object.assign(p, {k: s.k, f: s.f, x: s.x, y: s.y, tray: false}); draw(p); } check(); }};
}
</script>
